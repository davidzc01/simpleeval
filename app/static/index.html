<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simpleEval - LLM 与 Agent 评测工具</title>
    <style>
        /* ==================== 设计令牌 ==================== */
        :root {
            /* 背景 */
            --page-bg: #f7f8fa;
            --card-bg: #ffffff;
            --light-bg: #f4f5f7;
            --row-hover: #fafbfc;
            --code-bg: #1e1e24;
            --code-inline: #2a2a32;

            /* 文字灰阶 */
            --ink-1: #1a1d24;
            --ink-2: #2d3138;
            --ink-3: #5c6470;
            --ink-4: #8a919c;
            --ink-5: #b0b6bf;
            --ink-6: #d6dae0;

            /* 强调色 */
            --accent: #3b6fae;
            --accent-deep: #2f5c91;
            --accent-pale: #ecf2f9;
            --accent-bd: #c3d6ea;

            /* 语义色 */
            --green: #1a7f4b;
            --green-bg: #effaf3;
            --green-bd: #c2e7d1;
            --red: #d13438;
            --red-bg: #fdf0f0;
            --red-bd: #f3c9cb;
            --amber: #b36b00;
            --amber-bg: #fdf6e8;
            --amber-bd: #f2dcae;
            --teal: #0f766e;
            --teal-bg: #eff9f7;
            --teal-bd: #b8e0da;
            --gray: #7d8590;
            --gray-bg: #f4f5f7;
            --gray-bd: #dde1e6;

            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-pill: 999px;

            /* 阴影 */
            --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
            --shadow-dropdown: 0 8px 24px rgba(16,24,40,.12);
            --shadow-modal: 0 16px 48px rgba(16,24,40,.18);

            /* 字体 */
            --font-ui: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;

            /* 间距 */
            --sidebar-width: 220px;
            --header-height: 56px;
        }

        /* ==================== 重置 ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--ink-2);
            background: var(--page-bg);
            line-height: 1.5;
        }

        .mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
        }

        .num {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ==================== 布局 ==================== */
        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--code-bg);
            color: #9a9fab;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 5;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #333;
        }

        .sidebar-logo {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }

        .nav-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .12s ease;
            position: relative;
        }

        .nav-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            color: var(--accent);
            background: var(--accent-pale);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
        }

        .nav-item .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #333;
            font-size: 12px;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--ink-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .content {
            padding: 28px;
            flex: 1;
        }

        /* ==================== 按钮 ==================== */
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all .12s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-deep);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--ink-2);
            border: 1px solid var(--ink-6);
        }

        .btn-secondary:hover {
            background: var(--light-bg);
        }

        .btn-danger {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red-bd);
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================== 卡片 ==================== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 16px 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .card + .card {
            margin-top: 12px;
        }

        /* ==================== 指标卡 ==================== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 16px;
            text-align: center;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--ink-1);
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--ink-3);
        }

        /* ==================== 表格 ==================== */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--ink-6);
        }

        th {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-3);
            background: var(--light-bg);
        }

        tr:hover td {
            background: var(--row-hover);
        }

        .truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==================== 表单 ==================== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-3);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--ink-6);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            transition: border-color .12s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-pale);
        }

        .form-input.mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            background: var(--card-bg);
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        select.form-input {
            cursor: pointer;
        }

        /* ==================== 代码块 ==================== */
        .code-block {
            background: var(--code-bg);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
            overflow-x: auto;
        }

        .code-block .code-header {
            color: #888;
            font-size: 11px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        /* ==================== 标签/徽章 ==================== */
        .tag {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 500;
        }

        .tag-exact { background: var(--accent-pale); color: var(--accent); }
        .tag-contains { background: var(--teal-bg); color: var(--teal); }
        .tag-not_contains { background: var(--red-bg); color: var(--red); }
        .tag-length { background: var(--amber-bg); color: var(--amber); }
        .tag-llm_judge, .tag-judge { background: #f3e8ff; color: #7c3aed; }

        /* ==================== 状态 ==================== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-passed { background: var(--green-bg); color: var(--green); }
        .status-passed .status-dot { background: var(--green); }
        .status-failed { background: var(--red-bg); color: var(--red); }
        .status-failed .status-dot { background: var(--red); }
        .status-running { background: var(--amber-bg); color: var(--amber); }
        .status-running .status-dot { background: var(--amber); animation: pulse 1.5s infinite; }
        .status-queued { background: var(--teal-bg); color: var(--teal); }
        .status-queued .status-dot { background: var(--teal); }
        .status-disabled { background: var(--gray-bg); color: var(--gray); }
        .status-disabled .status-dot { background: var(--gray); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ==================== Tabs ==================== */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--ink-6);
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 16px;
            cursor: pointer;
            color: var(--ink-3);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .12s ease;
        }

        .tab:hover {
            color: var(--ink-2);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==================== 导入拖拽区 ==================== */
        .import-drop-zone {
            border: 2px dashed var(--ink-6);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color .12s ease, background .12s ease;
        }
        .import-drop-zone:hover {
            background: var(--row-hover);
            border-color: var(--accent-bd);
        }

        /* ==================== 模态框 ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(23,26,33,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-modal);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow: auto;
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--ink-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--ink-4);
        }

        .modal-body {
            padding: 18px 22px;
        }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid var(--ink-6);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ==================== 三栏对比视图 ==================== */
        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .comparison-column {
            background: var(--code-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .comparison-header {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            background: var(--code-inline);
        }

        .comparison-content {
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: #e0e0e0;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ==================== 进度条 ==================== */
        .progress-bar {
            height: 8px;
            background: var(--light-bg);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-pill);
            transition: width .4s ease;
        }

        /* ==================== 空态 ==================== */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--ink-4);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* ==================== Toast ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-dropdown);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn .2s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-success { border-left: 3px solid var(--green); }
        .toast-error { border-left: 3px solid var(--red); }
        .toast-warning { border-left: 3px solid var(--amber); }

        /* ==================== 任务指示器 ==================== */
        .task-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid var(--amber-bd);
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background .12s ease;
            max-width: 100%;
            overflow: hidden;
        }

        .task-indicator:hover {
            background: var(--amber-bd);
        }

        .task-indicator .status-dot {
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        .task-indicator .task-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ==================== 骨架屏 ==================== */
        .skeleton {
            background: linear-gradient(90deg, var(--light-bg) 0%, var(--row-hover) 50%, var(--light-bg) 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s infinite linear;
            border-radius: var(--radius-sm);
            display: block;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-row td, .skeleton-cell {
            padding: 10px 12px;
        }

        .skeleton-line {
            height: 12px;
            width: 100%;
        }

        .skeleton-line.w-60 { width: 60%; }
        .skeleton-line.w-40 { width: 40%; }
        .skeleton-line.w-30 { width: 30%; }
        .skeleton-line.w-80 { width: 80%; }

        .skeleton-card {
            height: 80px;
            border-radius: var(--radius-lg);
        }

        /* ==================== 隐藏类 ==================== */
        .hidden { display: none !important; }

        /* ==================== 工具类 ==================== */
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .text-right { text-align: right; }
        .text-muted { color: var(--ink-4); }

        /* B-7: 响应解析行编辑器 + JSON 树点选 */
        .rp-path-list { display: flex; flex-direction: column; gap: 6px; }
        .rp-path-row { display: flex; gap: 6px; align-items: center; }
        .rp-path-row .rp-path-input { flex: 1; font-size: 13px; }
        .rp-path-row .btn-sm { padding: 4px 10px; line-height: 1.4; }
        .rp-toolbar { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

        .json-tree { font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-2); }
        .json-tree .jt-row { margin-left: 18px; border-left: 1px dashed var(--gray-bd); padding-left: 8px; }
        .json-tree .jt-key { color: var(--accent); cursor: pointer; }
        .json-tree .jt-key:hover { text-decoration: underline; }
        .json-tree .jt-leaf { cursor: pointer; padding: 0 2px; border-radius: 2px; }
        .json-tree .jt-leaf:hover { background: var(--accent-pale); }
        .json-tree .jt-string { color: var(--green); }
        .json-tree .jt-number { color: var(--ink-1); font-weight: 600; }
        .json-tree .jt-boolean { color: var(--red); }
        .json-tree .jt-null { color: var(--ink-4); font-style: italic; }
        .json-tree .jt-bracket { color: var(--ink-3); cursor: pointer; user-select: none; }
        .json-tree .jt-bracket:hover { color: var(--accent); }
        .json-tree .jt-children.jt-hidden { display: none; }
        .json-tree .jt-preview { color: var(--ink-4); font-style: italic; margin-left: 8px; font-size: 11px; }
        .json-tree .jt-hint { font-size: 11px; color: var(--ink-4); margin-bottom: 8px; }
        .json-tree-container { border: 1px solid var(--gray-bd); border-radius: var(--radius-md); padding: 12px; max-height: 400px; overflow: auto; background: var(--gray-bg); }
        .rp-target-badge { font-size: 11px; color: var(--ink-4); margin-left: 8px; }
        .rp-target-badge.active { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">simpleEval</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-item" data-page="projects" onclick="navigateTo('projects')">
                    <span>📁</span> 项目总览
                </div>
                <div style="flex: 1; overflow-y: auto;">
                    <div id="projectList"></div>
                </div>
                <div style="padding: 8px 16px; border-top: 1px solid #333;">
                    <button class="btn btn-sm" style="width: 100%; background: transparent; color: #9a9fab; border: 1px dashed #444;" onclick="showCreateProjectModal()">+ 新建项目</button>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div id="runningTasks"></div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="header">
                <h1 class="header-title" id="pageTitle">Projects</h1>
                <div class="header-actions" id="headerActions">
                    <!-- 动态按钮 -->
                </div>
            </header>
            <div class="content" id="mainContent">
                <!-- 动态内容 -->
            </div>
        </main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== 全局状态 ====================
        const state = {
            projects: [],
            currentProject: null,
            currentRun: null,
            currentEvalsets: null,
            currentEvalsetId: null,
            apiBase: '/api'
        };

        // ==================== 辅助函数 ====================
        function isProjectReady(project) {
            // 检查项目是否配置完整（Target API 和 Judge）
            // B-6: custom 模式不要求 model
            if (!project) return false;
            const tc = project.target_config || {};
            const jc = project.judge_config || {};
            const targetReady = tc.base_url && (tc.api_type === 'custom' ? true : !!tc.model);
            return !!(targetReady && jc.base_url && jc.model);
        }

        // ==================== API 客户端 ====================
        async function api(endpoint, options = {}) {
            try {
                const res = await fetch(state.apiBase + endpoint, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail?.error?.message || data.detail?.message || 'Request failed');
                }
                return data;
            } catch (err) {
                console.error('API Error:', err);
                showToast(err.message, 'error');
                throw err;
            }
        }

        // ==================== 页面导航（带 hash 路由）====================
        // 程序化改 hash 时设此 flag，避免 hashchange 再触发一次 navigateTo 造成循环
        let _programmaticHash = false;

        function buildHash(page, params = {}) {
            if (page === 'projects') return '#/projects';
            if (page === 'project-detail') return `#/project/${encodeURIComponent(params.id || '')}`;
            if (page === 'run-detail') return `#/run/${encodeURIComponent(params.projectId || '')}/${encodeURIComponent(params.id || '')}`;
            return '#/projects';
        }

        function parseHash(hash) {
            const h = (hash || '').replace(/^#\/?/, '');
            if (!h) return null;
            const parts = h.split('/').map(decodeURIComponent);
            if (parts[0] === 'projects') return { page: 'projects' };
            if (parts[0] === 'project' && parts[1]) return { page: 'project-detail', params: { id: parts[1] } };
            if (parts[0] === 'run' && parts[1] && parts[2]) return { page: 'run-detail', params: { id: parts[2], projectId: parts[1] } };
            return null;
        }

        function navigateTo(page, params = {}) {
            // 同步 hash（静默：不触发 hashchange 二次导航）
            const newHash = buildHash(page, params);
            if (location.hash !== newHash) {
                _programmaticHash = true;
                location.hash = newHash;
            }
            runNavigation(page, params);
        }

        function runNavigation(page, params = {}) {
            // 加载侧栏项目列表
            loadSidebarProjects();

            document.getElementById('pageTitle').textContent = page === 'projects' ? '项目总览' : page === 'project-detail' ? (state.currentProject?.name || '项目详情') : page === 'run-detail' ? (state.currentRun?.id || 'Run 详情') : page;

            // 清除所有激活状态
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            const content = document.getElementById('mainContent');
            const headerActions = document.getElementById('headerActions');
            headerActions.innerHTML = '';

            switch(page) {
                case 'projects':
                    renderProjectsPage(content, headerActions);
                    break;
                case 'project-detail':
                    renderProjectDetailPage(content, headerActions, params);
                    break;
                case 'run-detail':
                    renderRunDetailPage(content, headerActions, params);
                    break;
            }
        }

        window.addEventListener('hashchange', () => {
            if (_programmaticHash) { _programmaticHash = false; return; }
            const parsed = parseHash(location.hash);
            if (!parsed) { runNavigation('projects'); return; }
            runNavigation(parsed.page, parsed.params || {});
        });

        function renderSparkline(data) {
            if (!data.length) return '-';
            // B-9: y 轴固定 0–1（pass_rate 为 0-1 小数），禁止 min-max 缩放
            const height = 20;
            const width = 60;
            const points = data.map((d, i) => {
                const x = data.length === 1 ? width / 2 : (i / (data.length - 1)) * width;
                const y = height - d.pass_rate * height;
                return `${x},${y}`;
            }).join(' ');
            return `<svg width="${width}" height="${height}"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
        }

        // B-9: 概览趋势图（双系列：pass_rate 折线 + total_token 浅柱）
        function renderTrendChart(trend) {
            if (!trend || !trend.length) return '<div class="empty-state-text">暂无趋势数据</div>';
            const n = trend.length;
            const width = 440;
            const height = 140;
            const pad = { top: 16, right: 20, bottom: 28, left: 44 };
            const plotW = width - pad.left - pad.right;
            const plotH = height - pad.top - pad.bottom;

            // token 最大值用于柱状图缩放
            const maxToken = Math.max(...trend.map(d => d.total_token || 0), 1);
            const barW = Math.min(plotW / n * 0.5, 20);
            const xStep = n === 1 ? 0 : plotW / (n - 1);
            const xFor = i => n === 1 ? pad.left + plotW / 2 : pad.left + i * xStep;
            // pass_rate y 轴固定 0-1
            const yRateFor = v => pad.top + plotH * (1 - v);
            // token y 轴 0-maxToken
            const yTokenFor = v => pad.top + plotH * (1 - v / maxToken);

            // 网格
            let grid = '';
            for (const v of [0, 0.5, 1.0]) {
                const y = yRateFor(v);
                grid += `<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--border)"/>`;
                grid += `<text x="${pad.left - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--ink-4)">${v.toFixed(1)}</text>`;
            }

            // token 柱
            let bars = '';
            trend.forEach((d, i) => {
                const x = xFor(i) - barW / 2;
                const y = yTokenFor(d.total_token || 0);
                const h = pad.top + plotH - y;
                bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--accent-pale)" rx="2"/>`;
            });

            // pass_rate 折线
            const pts = trend.map((d, i) => `${xFor(i).toFixed(1)},${yRateFor(d.pass_rate).toFixed(1)}`).join(' ');
            const dots = trend.map((d, i) => `<circle cx="${xFor(i).toFixed(1)}" cy="${yRateFor(d.pass_rate).toFixed(1)}" r="3" fill="var(--accent)" stroke="white" stroke-width="1.5"/>`).join('');

            // x 轴标签（run 序号）
            const xLabels = trend.map((d, i) => `<text x="${xFor(i).toFixed(1)}" y="${height - 8}" text-anchor="middle" font-size="10" fill="var(--ink-4)">#${i + 1}</text>`).join('');

            return `
                <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="max-width: 100%;">
                    ${grid}
                    ${bars}
                    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
                    ${dots}
                    ${xLabels}
                </svg>
                <div style="display: flex; gap: 16px; margin-top: 8px; font-size: 11px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 16px; height: 2px; background: var(--accent); display: inline-block;"></span>
                        <span style="color: var(--ink-3);">pass rate</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 12px; height: 12px; background: var(--accent-pale); display: inline-block; border: 1px solid var(--accent-bd);"></span>
                        <span style="color: var(--ink-3);">token</span>
                    </div>
                </div>
            `;
        }

        function renderSamplingCard(data) {
            // 空态：没有 run
            if (data.total_runs === 0) {
                return `
                    <div class="empty-state" style="padding: 24px 0;">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">跑两次评测后这里会显示采样稳定性</div>
                    </div>
                    <div style="padding: 0 0 8px; color: var(--ink-5); font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px;">
                        基于 case_name 跨 run 对齐，评测集改动可能稀释结果
                    </div>
                `;
            }

            const kValues = data.k_values || [1, 2, 3];
            const atK = data.pass_at_k || [];
            const powK = data.pass_pow_k || [];
            const totalCases = data.total_cases || 0;

            // 检查是否所有 k 的 value 都是 null（数据不足）
            const allNull = atK.every(e => e.value === null) && powK.every(e => e.value === null);
            if (allNull) {
                return `
                    <div class="empty-state" style="padding: 24px 0;">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">已有 ${data.total_runs} 次 run，但采样数不足以计算 pass@k/pass^k（需至少 2 次）</div>
                    </div>
                    <div style="padding: 0 0 8px; color: var(--ink-5); font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px;">
                        基于 case_name 跨 run 对齐，评测集改动可能稀释结果
                    </div>
                `;
            }

            // 渲染 SVG 折线图
            const svg = renderSamplingChart(atK, powK, totalCases);

            // 图例
            const legend = `
                <div style="display: flex; gap: 16px; margin-top: 8px; font-size: 12px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 16px; height: 2px; background: var(--accent); display: inline-block;"></span>
                        <span style="color: var(--ink-3);">pass@k（潜力上界）</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 16px; height: 2px; background: var(--ink-5); display: inline-block; border-bottom: 1px dashed var(--ink-5);"></span>
                        <span style="color: var(--ink-3);">pass^k（稳定下界）</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 12px; height: 12px; background: var(--accent-pale); display: inline-block; border: 1px solid var(--accent-bd);"></span>
                        <span style="color: var(--ink-3);">不确定性区间</span>
                    </div>
                </div>
            `;

            // 低 coverage 提示
            const lowCoverageHints = [];
            for (const entry of atK) {
                if (totalCases > 0 && entry.coverage / totalCases < 0.6) {
                    const needed = entry.k - data.total_runs;
                    if (entry.coverage === 0) {
                        lowCoverageHints.push(`<div style="color: var(--amber);">k=${entry.k}：需至少 ${entry.k} 次 run 才能计算（当前 ${data.total_runs} 次）</div>`);
                    } else {
                        lowCoverageHints.push(`<div style="color: var(--amber);">k=${entry.k}：采样不足（${entry.coverage}/${totalCases} 个 case 满足 n≥${entry.k}）</div>`);
                    }
                }
            }
            const hintsHtml = lowCoverageHints.length > 0
                ? `<div style="margin-top: 8px; font-size: 11px; padding: 8px 10px; background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: var(--radius-sm);">${lowCoverageHints.join('')}</div>`
                : '';

            return `
                ${svg}
                ${legend}
                ${hintsHtml}
                <div style="margin-top: 12px; color: var(--ink-5); font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px;">
                    基于 case_name 跨 run 对齐，评测集改动可能稀释结果 · 共 ${data.total_runs} 次 run · ${totalCases} 个 case
                </div>
            `;
        }

        // 采样稳定性 SVG 折线图
        function renderSamplingChart(atK, powK, totalCases) {
            const width = 480;
            const height = 160;
            const padding = { top: 16, right: 24, bottom: 32, left: 36 };
            const plotW = width - padding.left - padding.right;
            const plotH = height - padding.top - padding.bottom;

            const kValues = atK.map(e => e.k);
            const n = kValues.length;
            if (n === 0) return '';

            // x 映射：k 值 -> x 坐标
            const xFor = (k) => {
                const idx = kValues.indexOf(k);
                if (n === 1) return padding.left + plotW / 2;
                return padding.left + (plotW * idx) / (n - 1);
            };
            // y 映射：[0, 1] -> y 坐标（倒序）
            const yFor = (v) => padding.top + plotH * (1 - v);

            // 网格线（y=0, 0.25, 0.5, 0.75, 1.0）
            let gridHtml = '';
            for (const v of [0, 0.25, 0.5, 0.75, 1.0]) {
                const y = yFor(v);
                gridHtml += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
                gridHtml += `<text x="${padding.left - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--ink-4)">${v.toFixed(2)}</text>`;
            }

            // x 轴标签
            let xLabelsHtml = '';
            for (const k of kValues) {
                const x = xFor(k);
                xLabelsHtml += `<text x="${x}" y="${height - 10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">k=${k}</text>`;
            }

            // 判断点是否低 coverage（标灰）
            const isLowCov = (entry) => totalCases > 0 && (entry.coverage / totalCases) < 0.6;

            // 构造折线路径（跳过 value=null 的点，但这些点不连线）
            const buildPath = (entries, withGap = true) => {
                const pts = [];
                for (const e of entries) {
                    if (e.value === null) {
                        pts.push(null); // gap
                    } else {
                        pts.push({ x: xFor(e.k), y: yFor(e.value), low: isLowCov(e) });
                    }
                }
                let path = '';
                let inSegment = false;
                for (const p of pts) {
                    if (p === null) {
                        inSegment = false;
                    } else {
                        if (!inSegment) {
                            path += `M ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
                            inSegment = true;
                        } else {
                            path += ` L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
                        }
                    }
                }
                return path;
            };

            const atPath = buildPath(atK);
            const powPath = buildPath(powK);

            // 不确定性区域（pass@k 与 pass^k 之间）
            let areaPath = '';
            const atPts = atK.map(e => e.value === null ? null : { x: xFor(e.k), y: yFor(e.value) });
            const powPts = powK.map(e => e.value === null ? null : { x: xFor(e.k), y: yFor(e.value) });
            // 上边界（atK）从左到右
            let upperPts = atPts.filter(p => p !== null);
            let lowerPts = powPts.filter(p => p !== null).slice().reverse();
            if (upperPts.length >= 2 && lowerPts.length >= 2) {
                areaPath = 'M ' + upperPts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
                areaPath += ' L ' + lowerPts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
                areaPath += ' Z';
            }

            // 数据点
            let pointsHtml = '';
            for (const e of atK) {
                if (e.value === null) continue;
                const x = xFor(e.k);
                const y = yFor(e.value);
                const color = isLowCov(e) ? 'var(--ink-5)' : 'var(--accent)';
                pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${color}" stroke="white" stroke-width="1.5"/>`;
            }
            for (const e of powK) {
                if (e.value === null) continue;
                const x = xFor(e.k);
                const y = yFor(e.value);
                const color = isLowCov(e) ? 'var(--ink-6)' : 'var(--ink-3)';
                pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" stroke="white" stroke-width="1"/>`;
            }

            return `
                <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="max-width: 100%;">
                    ${gridHtml}
                    ${areaPath ? `<path d="${areaPath}" fill="var(--accent-pale)" fill-opacity="0.5" stroke="none"/>` : ''}
                    ${powPath ? `<path d="${powPath}" fill="none" stroke="var(--ink-5)" stroke-width="1.5" stroke-dasharray="4 3"/>` : ''}
                    ${atPath ? `<path d="${atPath}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ''}
                    ${pointsHtml}
                    ${xLabelsHtml}
                </svg>
            `;
        }

        function toggleCaseEditorFields() {
            const type = document.getElementById('ceEvalType')?.value;
            if (!type) return;
            const setDisplay = (id, show) => {
                const el = document.getElementById(id);
                if (el) el.style.display = show ? '' : 'none';
            };
            setDisplay('ceExactGroup', type === 'exact');
            setDisplay('ceContainsGroup', type === 'contains' || type === 'not_contains');
            setDisplay('ceLengthGroup', type === 'length');
            setDisplay('ceJudgeGroup', type === 'llm_judge');
        }

        async function saveCaseFromEditor(evalsetId, projectId, caseId) {
            const caseName = document.getElementById('ceCaseName').value.trim();
            const input = document.getElementById('ceInput').value;
            if (!caseName) { showToast('请填写 case_name', 'error'); return; }
            if (!input) { showToast('请填写 input', 'error'); return; }

            const evalType = document.getElementById('ceEvalType').value;
            const taskShape = document.getElementById('ceTaskShape').value.trim() || null;
            let expectedOutput = null, outputRequirement = null, evalParams = {};

            if (evalType === 'exact') {
                expectedOutput = document.getElementById('ceExpectedOutput').value;
            } else if (evalType === 'contains' || evalType === 'not_contains') {
                evalParams.substring = document.getElementById('ceSubstring').value;
            } else if (evalType === 'length') {
                const minV = document.getElementById('ceLengthMin').value;
                const maxV = document.getElementById('ceLengthMax').value;
                if (minV !== '') evalParams.min = parseInt(minV, 10);
                if (maxV !== '') evalParams.max = parseInt(maxV, 10);
            } else if (evalType === 'llm_judge') {
                outputRequirement = document.getElementById('ceOutputRequirement').value;
            }

            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = evalset.cases || [];
                const idx = cases.findIndex(c => c.id === caseId);
                const newCase = {
                    id: caseId,
                    case_name: caseName,
                    input,
                    expected_output: expectedOutput,
                    output_requirement: outputRequirement,
                    eval_type: evalType,
                    eval_params: evalParams,
                    task_shape: taskShape,
                    enabled: idx >= 0 ? cases[idx].enabled : true
                };
                if (idx >= 0) {
                    cases[idx] = newCase;
                } else {
                    cases.push(newCase);
                }
                await api(`/evalsets/${evalsetId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ ...evalset, cases })
                });
                closeModal('caseEditorModal');
                showToast(idx >= 0 ? '已更新用例' : '已新增用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        async function confirmDeleteCase(evalsetId, projectId, caseId) {
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);

        function renderConfigTab(container, project) {
            const tc = project.target_config;
            const jc = project.judge_config;
            const auth = tc.auth || { type: 'none', cookies: [], headers: [] };
            const rp = tc.response_parsing || { output_paths: [], token_paths: [], token_fields: [], token_scope: null };

            // 工具：判断字段是否被后端掩码
            const isMasked = v => v && typeof v === 'object' && v.masked === true;
            // 掩码占位符

        // B-6: API 模式切换时调整字段提示
        function toggleApiMode() {
            const mode = document.getElementById('targetApiType')?.value;
            const modelGroup = document.getElementById('modelGroup');
            const modelRequired = document.getElementById('modelRequired');
            const templateHint = document.getElementById('templateHint');
            if (!mode) return;
            if (mode === 'custom') {
                // custom: model 可选，request_template 必填
                if (modelRequired) modelRequired.style.display = 'none';
                if (templateHint) templateHint.textContent = '（必填，JSON 格式，不注入 model/messages）';
                if (modelGroup) modelGroup.querySelector('label').firstChild.textContent = 'model（可选） ';
            } else {
                // openai_compatible: model 必填
                if (modelRequired) modelRequired.style.display = '';
                if (templateHint) templateHint.textContent = '（留空 {input} = 默认 OpenAI 格式）';
                if (modelGroup) modelGroup.querySelector('label').firstChild.textContent = 'model ';
            }
        }

        function renderAuthFields(projectId) {
            const container = document.getElementById('authFields');
            if (!container) return;
            const type = document.getElementById('authType').value;
            const auth = state._auth || { type: 'none' };
            // 切换类型时保留同名字段，其它清空
            const isMasked = v => v && typeof v === 'object' && v.masked === true;
            const MASK_PLACEHOLDER = '••••••••';
            const secretInput = (id, value) => {
                const masked = isMasked(value);
                const val = masked ? MASK_PLACEHOLDER : escapeHtml(value || '');
                return `<input type="password" class="form-input mono" value="${val}" id="${id}" data-masked="${masked ? 'true' : 'false'}" oninput="this.dataset.masked='false'">`;
            };

            let html = '';
            if (type === 'bearer') {
                html = `
                    <div class="form-group">
                        <label class="form-label">bearer_token</label>
                        ${secretInput('authBearerToken', auth.bearer_token)}
                    </div>
                `;
            } else if (type === 'api_key') {
                html = `
                    <div class="form-group">
                        <label class="form-label">header 名</label>
                        <input type="text" class="form-input mono" value="${escapeHtml(auth.api_key_header || 'X-API-Key')}" id="authApiKeyHeader">
                    </div>
                    <div class="form-group">
                        <label class="form-label">api_key 值</label>
                        ${secretInput('authApiKeyValue', auth.api_key_value)}
                    </div>
                `;
            } else if (type === 'cookie') {
                const cookies = Array.isArray(auth.cookies) ? auth.cookies : [];
                html = `
                    <div class="form-group">
                        <label class="form-label">Cookies（每行一个 name=value）</label>
                        <textarea class="form-input mono" id="authCookies" placeholder="session=abc">${escapeHtml(cookies.map(c => `${c.name}=${isMasked(c.value) ? '••••••••' : (c.value || '')}`).join('\n'))}</textarea>
                        <div style="margin-top: 4px; font-size: 11px; color: var(--ink-4);">掩码值将自动用 __UNCHANGED__ 保留</div>
                    </div>
                `;
            } else if (type === 'headers') {
                const headers = Array.isArray(auth.headers) ? auth.headers : [];
                html = `
                    <div class="form-group">
                        <label class="form-label">自定义 Headers（每行 name: value）</label>
                        <textarea class="form-input mono" id="authHeaders" placeholder="X-Env: test">${escapeHtml(headers.map(h => `${h.name}: ${h.value || ''}`).join('\n'))}</textarea>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // 工具：从带 data-masked 的输入读取值，掩码时返回哨兵
        function readSecret(id) {
            const el = document.getElementById(id);
            if (!el) return '';
            if (el.dataset.masked === 'true') return '__UNCHANGED__';
            return el.value;
        }

        function collectAuth() {
            const type = document.getElementById('authType').value;
            const auth = { type, bearer_token: null, api_key_header: 'X-API-Key', api_key_value: null, cookies: [], headers: [] };
            if (type === 'bearer') {
                auth.bearer_token = readSecret('authBearerToken') || null;
            } else if (type === 'api_key') {
                auth.api_key_header = document.getElementById('authApiKeyHeader')?.value || 'X-API-Key';
                auth.api_key_value = readSecret('authApiKeyValue') || null;
            } else if (type === 'cookie') {
                const lines = (document.getElementById('authCookies')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
                auth.cookies = lines.map((line, i) => {
                    const idx = line.indexOf('=');
                    const name = idx >= 0 ? line.slice(0, idx).trim() : line;
                    const value = idx >= 0 ? line.slice(idx + 1).trim() : '';
                    // 用户没改掩码占位 → 哨兵
                    const oldValue = (state._auth?.cookies || [])[i]?.value;
                    const wasMasked = oldValue && typeof oldValue === 'object' && oldValue.masked === true;
                    return { name, value: wasMasked && value === '••••••••' ? '__UNCHANGED__' : value };
                });
            } else if (type === 'headers') {
                const lines = (document.getElementById('authHeaders')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
                auth.headers = lines.map(line => {
                    const idx = line.indexOf(':');
                    return { name: idx >= 0 ? line.slice(0, idx).trim() : line, value: idx >= 0 ? line.slice(idx + 1).trim() : '' };
                });
            }
            return auth;
        }

        // B-7: 响应解析行编辑器 + JSON 树点选
        // 当前激活的路径目标：'output_paths' | 'token_paths' | 'token_fields' | null
        // 用户点 input 聚焦时设值，点 JSON 树节点时按此目标填入

        const RP_LIST_IDS = {
            output_paths: 'rpOutputPathsList',
            token_paths: 'rpTokenPathsList',
            token_fields: 'rpTokenFieldsList'
        };

        function initRpPathLists(rp) {
            state._rpActiveTarget = null;
            state._rpSample = state._rpSample || '';
            // 填充 output_paths
            const op = Array.isArray(rp.output_paths) ? rp.output_paths : [];
            fillRpList('output_paths', op);
            // token 模式选择
            const hasPaths = Array.isArray(rp.token_paths) && rp.token_paths.length > 0;
            const hasFields = Array.isArray(rp.token_fields) && rp.token_fields.length > 0;
            const mode = hasPaths ? 'paths' : (hasFields ? 'fields' : 'none');
            const radio = document.querySelector(`input[name="rpTokenMode"][value="${mode}"]`);
            if (radio) radio.checked = true;
            // 填充 token_paths / token_fields
            fillRpList('token_paths', hasPaths ? rp.token_paths : []);
            fillRpList('token_fields', hasFields ? rp.token_fields : []);
            toggleRpTokenMode();
            updateRpActiveTargetLabel();
        }

        function fillRpList(target, values) {
            const listId = RP_LIST_IDS[target];
            const list = document.getElementById(listId);
            if (!list) return;
            list.innerHTML = '';
            if (values.length === 0) {
                addRpPathRow(target, '');
            } else {
                values.forEach(v => addRpPathRow(target, v));
            }
        }

        function addRpPathRow(target, value = '') {
            const listId = RP_LIST_IDS[target];
            const container = document.getElementById(listId);
            if (!container) return;
            const row = document.createElement('div');
            row.className = 'rp-path-row';
            const placeholder = target === 'token_fields' ? '字段名，如 total_tokens' : '$.路径，如 $.choices[0].message.content';
            row.innerHTML = `
                <input type="text" class="form-input mono rp-path-input" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" onfocus="setRpActiveTarget('${target}')">
                <button class="btn btn-sm btn-danger" onclick="removeRpPathRow(this)" title="删除">×</button>
            `;
            container.appendChild(row);
        }

        function removeRpPathRow(btn) {
            const list = btn.closest('.rp-path-list');
            const row = btn.closest('.rp-path-row');
            if (row) row.remove();
            // 至少保留一行（避免空 list 无法点选填入）
            if (list && list.children.length === 0) {
                addRpPathRow(list.dataset.target, '');
            }
        }

        function setRpActiveTarget(target) {
            state._rpActiveTarget = target;
            updateRpActiveTargetLabel();
        }

        function updateRpActiveTargetLabel() {
            const label = document.getElementById('rpActiveTargetLabel');
            if (!label) return;
            const t = state._rpActiveTarget;
            label.textContent = t ? t : '（未选）';
            // 高亮当前激活的列表 badge
            ['output_paths', 'token_paths', 'token_fields'].forEach(k => {
                const badge = document.getElementById('rpTargetBadge-' + k);
                if (badge) badge.classList.toggle('active', k === t);
            });
        }

        function toggleRpTokenMode() {
            const mode = document.querySelector('input[name="rpTokenMode"]:checked')?.value || 'none';
            const showPaths = mode === 'paths';
            const showFields = mode === 'fields';
            const pathsGroup = document.getElementById('rpTokenPathsGroup');
            const fieldsGroup = document.getElementById('rpTokenFieldsGroup');
            if (pathsGroup) pathsGroup.style.display = showPaths ? '' : 'none';
            if (fieldsGroup) fieldsGroup.style.display = showFields ? '' : 'none';
            // 切换到某模式但列表为空 → 自动加一行
            if (showPaths && document.getElementById('rpTokenPathsList').children.length === 0) addRpPathRow('token_paths');
            if (showFields && document.getElementById('rpTokenFieldsList').children.length === 0) addRpPathRow('token_fields');
        }

        // ============== JSON 树渲染 + 点选生成路径 ==============

        function parseSampleToTree() {
            const sample = document.getElementById('parsingSample')?.value.trim();
            const treeDiv = document.getElementById('jsonTree');
            const container = document.getElementById('jsonTreeContainer');
            if (!sample) { showToast('请先粘贴样例响应', 'warning'); return; }
            let data;
            try {
                data = JSON.parse(sample);
            } catch (e) {
                showToast('JSON 解析失败: ' + e.message, 'error');
                container.style.display = 'none';
                return;
            }
            state._rpSample = sample;
            treeDiv.innerHTML = renderJsonTree(data, '$');
            container.style.display = 'block';
            // 事件委托：点击 [data-path] 节点 → 生成路径；点击 [data-toggle] → 折叠
            treeDiv.onclick = e => {
                const toggler = e.target.closest('[data-toggle]');
                if (toggler) {
                    const children = toggler.nextElementSibling;
                    if (children && children.classList.contains('jt-children')) {
                        children.classList.toggle('jt-hidden');
                        toggler.classList.toggle('jt-collapsed');
                    }
                    return;
                }
                const node = e.target.closest('[data-path]');
                if (node) pickJsonPath(node.dataset.path);
            };
        }

        // 递归渲染 JSON 节点。path 是当前节点的 JSONPath
        function renderJsonTree(node, path) {
            if (node === null) {
                return `<span class="jt-leaf jt-null" data-path="${escapeHtml(path)}">null</span>`;
            }
            if (typeof node !== 'object') {
                const type = typeof node;
                const cls = type === 'string' ? 'jt-string' : (type === 'boolean' ? 'jt-boolean' : 'jt-number');
                const display = type === 'string' ? `"${escapeHtml(node)}"` : escapeHtml(String(node));
                return `<span class="jt-leaf ${cls}" data-path="${escapeHtml(path)}">${display}</span>`;
            }
            const isArray = Array.isArray(node);
            const entries = isArray
                ? node.map((v, i) => [i, v])
                : Object.entries(node);
            if (entries.length === 0) {
                return `<span class="jt-bracket">${isArray ? '[]' : '{}'}</span>`;
            }
            const children = entries.map(([k, v]) => {
                let childPath;
                if (isArray) {
                    childPath = `${path}[${k}]`;
                } else if (/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(String(k))) {
                    childPath = `${path}.${k}`;
                } else {
                    childPath = `${path}['${String(k).replace(/'/g, "\\'")}']`;
                }
                const preview = (v === null || typeof v !== 'object')
                    ? ''
                    : ` <span class="jt-preview">${escapeHtml(Array.isArray(v) ? `[${v.length} 项]` : `{${Object.keys(v).length} 键}`)}</span>`;
                return `<div class="jt-row">
                    <span class="jt-key" data-path="${escapeHtml(childPath)}">${escapeHtml(String(k))}:</span>
                    ${renderJsonTree(v, childPath)}
                    ${preview}
                </div>`;
            }).join('');
            const open = isArray ? '[' : '{';
            const close = isArray ? ']' : '}';
            return `<span class="jt-bracket" data-toggle="1" data-path="${escapeHtml(path)}">${open}</span>
                <div class="jt-children">${children}</div>
                <span class="jt-bracket">${close}</span>`;
        }

        function pickJsonPath(path) {
            const target = state._rpActiveTarget;
            if (!target) {
                showToast('请先点击上方的路径输入框选中目标', 'warning');
                return;
            }
            // token_fields 目标：把 $.a.b 转成末段字段名（用户可手改）
            let value = path;
            if (target === 'token_fields') {
                const m = path.match(/\.([A-Za-z_$][A-Za-z0-9_$]*)$/);
                if (m) value = m[1];
                else if (path !== '$') value = path.replace(/^\$\.?|^\$/, '').replace(/^\['/, '').replace(/'\]$/, '');
            }
            // 优先填当前聚焦的 input
            const active = document.activeElement;
            if (active && active.classList && active.classList.contains('rp-path-input') && active.closest('#' + RP_LIST_IDS[target])) {
                active.value = value;
                active.focus();
                return;
            }
            // 找第一个空 input 填入
            const list = document.getElementById(RP_LIST_IDS[target]);
            if (!list) return;
            const inputs = Array.from(list.querySelectorAll('.rp-path-input'));
            const empty = inputs.find(i => !i.value.trim());
            if (empty) {
                empty.value = value;
                empty.focus();
                return;
            }
            // 没空 input → 新增一行
            addRpPathRow(target, value);
            const last = list.querySelector('.rp-path-row:last-child .rp-path-input');
            if (last) last.focus();
        }

        function collectResponseParsing() {
            const readList = target => {
                const listId = RP_LIST_IDS[target];
                const list = document.getElementById(listId);
                if (!list) return [];
                return Array.from(list.querySelectorAll('.rp-path-input'))
                    .map(i => i.value.trim()).filter(Boolean);
            };
            const scopeRaw = document.getElementById('rpTokenScope')?.value.trim();
            let tokenScope = null;
            if (scopeRaw) {
                try { tokenScope = JSON.parse(scopeRaw); }
                catch (e) { /* 留空，save 时由后端兜底；test 时单独报错 */ }
            }
            const mode = document.querySelector('input[name="rpTokenMode"]:checked')?.value || 'none';
            return {
                output_paths: readList('output_paths'),
                token_paths: mode === 'paths' ? readList('token_paths') : [],
                token_fields: mode === 'fields' ? readList('token_fields') : [],
                token_scope: tokenScope
            };
        }

        // P2-6: 收集 token_budget（limit 留空 = null = 不限预算）
        function collectTokenBudget() {
            const limitEl = document.getElementById('budgetLimit');
            const warnEl = document.getElementById('budgetWarnOnly');
            if (!limitEl) return state.currentProject?.token_budget || null;
            const raw = limitEl.value.trim();
            if (!raw) return null;
            const limit = parseInt(raw, 10);
            if (isNaN(limit) || limit < 0) return null;
            return {
                limit,
                warn_only: warnEl ? warnEl.checked : true
            };
        }

        // 静默轮询：指数退避，弹窗打开/页面隐藏时暂停
        let runPollTimer = null;
        let runPollDelay = 2000;
        const RUN_POLL_MAX_DELAY = 10000;

        function startRunPolling(params) {
            stopRunPolling();
            runPollDelay = 2000;
            document.removeEventListener('visibilitychange', onVisibilityChange);
            document.addEventListener('visibilitychange', onVisibilityChange);
            scheduleRunPoll(params);
        }

        function stopRunPolling() {
            if (runPollTimer) { clearTimeout(runPollTimer); runPollTimer = null; }
        }

        function onVisibilityChange() {
            const params = state.currentRunParams;
            if (!params) return;
            if (document.hidden) {
                stopRunPolling();
            } else {
                // 恢复时立即补拉
                pollRunOnce(params);
            }
        }

        function scheduleRunPoll(params) {
            stopRunPolling();
            runPollTimer = setTimeout(() => pollRunOnce(params), runPollDelay);
        }

        async function pollRunOnce(params) {
            // 终止条件：run 已结束 / 已离开 run 详情页
            if (!state.currentRunParams || state.currentRunParams.id !== params.id) return;
            const status = state.currentRun?.status;
            if (status === 'completed' || status === 'failed') return;

            // 弹窗打开时暂停轮询，但仍排程下一轮（让用户关闭弹窗后继续）
            const modal = document.getElementById('caseModal');
            if (modal && !modal.classList.contains('hidden')) {
                scheduleRunPoll(params);
                return;
            }
            if (document.hidden) return;

            try {
                const run = await api(`/runs/${params.id}?project_id=${params.projectId}`);
                state.currentRun = run;
                let evalsetMap = {};
                if (state.currentRunEvalset) {
                    (state.currentRunEvalset.cases || []).forEach(c => { evalsetMap[c.case_name] = c; });
                }
                updateRunDetailDom(run, evalsetMap);
                // 指数退避
                runPollDelay = Math.min(RUN_POLL_MAX_DELAY, runPollDelay * 1.5);
                if (run.status === 'running' || run.status === 'queued') {
                    scheduleRunPoll(params);
                }
            } catch (err) {
                // 网络错误时降速重试
                runPollDelay = Math.min(RUN_POLL_MAX_DELAY, runPollDelay * 1.5);
                scheduleRunPoll(params);
            }
        }
