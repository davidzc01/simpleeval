<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simpleEval - LLM 与 Agent 评测工具</title>
    <style>
        /* ==================== 设计令牌 ==================== */
        :root {
            /* 背景 */
            --page-bg: #f7f8fa;
            --card-bg: #ffffff;
            --light-bg: #f4f5f7;
            --row-hover: #fafbfc;
            --code-bg: #1e1e24;
            --code-inline: #2a2a32;

            /* 文字灰阶 */
            --ink-1: #1a1d24;
            --ink-2: #2d3138;
            --ink-3: #5c6470;
            --ink-4: #8a919c;
            --ink-5: #b0b6bf;
            --ink-6: #d6dae0;

            /* 强调色 */
            --accent: #3b6fae;
            --accent-deep: #2f5c91;
            --accent-pale: #ecf2f9;
            --accent-bd: #c3d6ea;

            /* 语义色 */
            --green: #1a7f4b;
            --green-bg: #effaf3;
            --green-bd: #c2e7d1;
            --red: #d13438;
            --red-bg: #fdf0f0;
            --red-bd: #f3c9cb;
            --amber: #b36b00;
            --amber-bg: #fdf6e8;
            --amber-bd: #f2dcae;
            --teal: #0f766e;
            --teal-bg: #eff9f7;
            --teal-bd: #b8e0da;
            --gray: #7d8590;
            --gray-bg: #f4f5f7;
            --gray-bd: #dde1e6;

            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-pill: 999px;

            /* 阴影 */
            --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
            --shadow-dropdown: 0 8px 24px rgba(16,24,40,.12);
            --shadow-modal: 0 16px 48px rgba(16,24,40,.18);

            /* 字体 */
            --font-ui: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;

            /* 间距 */
            --sidebar-width: 220px;
            --header-height: 56px;
        }

        /* ==================== 重置 ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--ink-2);
            background: var(--page-bg);
            line-height: 1.5;
        }

        .mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
        }

        .num {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ==================== 布局 ==================== */
        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--code-bg);
            color: #9a9fab;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 5;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #333;
        }

        .sidebar-logo {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }

        .nav-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .12s ease;
            position: relative;
        }

        .nav-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            color: var(--accent);
            background: var(--accent-pale);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
        }

        .nav-item .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #333;
            font-size: 12px;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--ink-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .content {
            padding: 28px;
            flex: 1;
        }

        /* ==================== 按钮 ==================== */
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all .12s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-deep);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--ink-2);
            border: 1px solid var(--ink-6);
        }

        .btn-secondary:hover {
            background: var(--light-bg);
        }

        .btn-danger {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red-bd);
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================== 卡片 ==================== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 16px 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .card + .card {
            margin-top: 12px;
        }

        /* ==================== 指标卡 ==================== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 16px;
            text-align: center;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--ink-1);
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--ink-3);
        }

        /* ==================== 表格 ==================== */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--ink-6);
        }

        th {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-3);
            background: var(--light-bg);
        }

        tr:hover td {
            background: var(--row-hover);
        }

        .truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==================== 表单 ==================== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-3);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--ink-6);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            transition: border-color .12s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-pale);
        }

        .form-input.mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            background: var(--card-bg);
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        select.form-input {
            cursor: pointer;
        }

        /* ==================== 代码块 ==================== */
        .code-block {
            background: var(--code-bg);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
            overflow-x: auto;
        }

        .code-block .code-header {
            color: #888;
            font-size: 11px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        /* ==================== 标签/徽章 ==================== */
        .tag {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 500;
        }

        .tag-exact { background: var(--accent-pale); color: var(--accent); }
        .tag-contains { background: var(--teal-bg); color: var(--teal); }
        .tag-not_contains { background: var(--red-bg); color: var(--red); }
        .tag-length { background: var(--amber-bg); color: var(--amber); }
        .tag-llm_judge, .tag-judge { background: #f3e8ff; color: #7c3aed; }

        /* ==================== 状态 ==================== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-passed { background: var(--green-bg); color: var(--green); }
        .status-passed .status-dot { background: var(--green); }
        .status-failed { background: var(--red-bg); color: var(--red); }
        .status-failed .status-dot { background: var(--red); }
        .status-running { background: var(--amber-bg); color: var(--amber); }
        .status-running .status-dot { background: var(--amber); animation: pulse 1.5s infinite; }
        .status-queued { background: var(--teal-bg); color: var(--teal); }
        .status-queued .status-dot { background: var(--teal); }
        .status-disabled { background: var(--gray-bg); color: var(--gray); }
        .status-disabled .status-dot { background: var(--gray); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ==================== Tabs ==================== */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--ink-6);
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 16px;
            cursor: pointer;
            color: var(--ink-3);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .12s ease;
        }

        .tab:hover {
            color: var(--ink-2);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==================== 导入拖拽区 ==================== */
        .import-drop-zone {
            border: 2px dashed var(--ink-6);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color .12s ease, background .12s ease;
        }
        .import-drop-zone:hover {
            background: var(--row-hover);
            border-color: var(--accent-bd);
        }

        /* ==================== 模态框 ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(23,26,33,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-modal);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow: auto;
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--ink-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--ink-4);
        }

        .modal-body {
            padding: 18px 22px;
        }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid var(--ink-6);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ==================== 三栏对比视图 ==================== */
        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .comparison-column {
            background: var(--code-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .comparison-header {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            background: var(--code-inline);
        }

        .comparison-content {
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: #e0e0e0;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ==================== 进度条 ==================== */
        .progress-bar {
            height: 8px;
            background: var(--light-bg);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-pill);
            transition: width .4s ease;
        }

        /* ==================== 空态 ==================== */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--ink-4);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* ==================== Toast ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-dropdown);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn .2s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-success { border-left: 3px solid var(--green); }
        .toast-error { border-left: 3px solid var(--red); }
        .toast-warning { border-left: 3px solid var(--amber); }

        /* ==================== 任务指示器 ==================== */
        .task-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid var(--amber-bd);
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background .12s ease;
            max-width: 100%;
            overflow: hidden;
        }

        .task-indicator:hover {
            background: var(--amber-bd);
        }

        .task-indicator .status-dot {
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        .task-indicator .task-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ==================== 骨架屏 ==================== */
        .skeleton {
            background: linear-gradient(90deg, var(--light-bg) 0%, var(--row-hover) 50%, var(--light-bg) 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s infinite linear;
            border-radius: var(--radius-sm);
            display: block;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-row td, .skeleton-cell {
            padding: 10px 12px;
        }

        .skeleton-line {
            height: 12px;
            width: 100%;
        }

        .skeleton-line.w-60 { width: 60%; }
        .skeleton-line.w-40 { width: 40%; }
        .skeleton-line.w-30 { width: 30%; }
        .skeleton-line.w-80 { width: 80%; }

        .skeleton-card {
            height: 80px;
            border-radius: var(--radius-lg);
        }

        /* ==================== 隐藏类 ==================== */
        .hidden { display: none !important; }

        /* ==================== 工具类 ==================== */
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .text-right { text-align: right; }
        .text-muted { color: var(--ink-4); }

        /* B-7: 响应解析行编辑器 + JSON 树点选 */
        .rp-path-list { display: flex; flex-direction: column; gap: 6px; }
        .rp-path-row { display: flex; gap: 6px; align-items: center; }
        .rp-path-row .rp-path-input { flex: 1; font-size: 13px; }
        .rp-path-row .btn-sm { padding: 4px 10px; line-height: 1.4; }
        .rp-toolbar { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

        /* B-13: 变量 kv 行编辑器 */
        .kv-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
        .kv-row { display: flex; gap: 6px; align-items: center; }
        .kv-row .kv-key { flex: 1; font-size: 13px; }
        .kv-row .kv-val { flex: 2; font-size: 13px; }
        .kv-row .btn-sm { padding: 4px 10px; line-height: 1.4; }

        .json-tree { font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-2); }
        .json-tree .jt-row { margin-left: 18px; border-left: 1px dashed var(--gray-bd); padding-left: 8px; }
        .json-tree .jt-key { color: var(--accent); cursor: pointer; }
        .json-tree .jt-key:hover { text-decoration: underline; }
        .json-tree .jt-leaf { cursor: pointer; padding: 0 2px; border-radius: 2px; }
        .json-tree .jt-leaf:hover { background: var(--accent-pale); }
        .json-tree .jt-string { color: var(--green); }
        .json-tree .jt-number { color: var(--ink-1); font-weight: 600; }
        .json-tree .jt-boolean { color: var(--red); }
        .json-tree .jt-null { color: var(--ink-4); font-style: italic; }
        .json-tree .jt-bracket { color: var(--ink-3); cursor: pointer; user-select: none; }
        .json-tree .jt-bracket:hover { color: var(--accent); }
        .json-tree .jt-children.jt-hidden { display: none; }
        .json-tree .jt-preview { color: var(--ink-4); font-style: italic; margin-left: 8px; font-size: 11px; }
        .json-tree .jt-hint { font-size: 11px; color: var(--ink-4); margin-bottom: 8px; }
        .json-tree-container { border: 1px solid var(--gray-bd); border-radius: var(--radius-md); padding: 12px; max-height: 400px; overflow: auto; background: var(--gray-bg); }
        .rp-target-badge { font-size: 11px; color: var(--ink-4); margin-left: 8px; }
        .rp-target-badge.active { color: var(--accent); font-weight: 600; }

        /* ==================== T1-2: Tag chips ==================== */
        .tag-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .tag-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; font-size: 11px;
            background: var(--accent-pale); color: var(--accent-deep);
            border: 1px solid var(--accent-bd); border-radius: var(--radius-pill);
            cursor: default; user-select: none;
        }
        .tag-chip .tag-chip-x { cursor: pointer; color: var(--ink-4); font-weight: 600; }
        .tag-chip .tag-chip-x:hover { color: var(--red); }
        .tag-chip-toggle { cursor: pointer; }
        .tag-chip-toggle.off { background: var(--gray-bg); color: var(--ink-4); border-color: var(--gray-bd); }
        .tag-chip-toggle.off .tag-chip-x { color: var(--ink-5); }

        /* 表格内 tag chips（紧凑） */
        .tag-cell .tag-chip { font-size: 10px; padding: 1px 6px; }

        /* 评测弹窗 tag 筛选区 */
        .tag-filter-bar {
            margin-top: 12px; padding: 10px 12px;
            background: var(--light-bg); border: 1px solid var(--gray-bd);
            border-radius: var(--radius-md);
        }
        .tag-filter-bar .tag-filter-mode { margin-left: 12px; font-size: 12px; color: var(--ink-3); }
        .tag-filter-bar .tag-filter-mode label { margin-left: 8px; cursor: pointer; }

        /* ==================== T1-1: 危险操作菜单 ==================== */
        .row-menu-wrap { position: relative; display: inline-block; }
        .row-menu {
            position: absolute; right: 0; top: 100%; z-index: 10;
            min-width: 140px; padding: 4px 0;
            background: var(--card-bg);
            border: 1px solid var(--gray-bd);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-dropdown);
            display: none;
        }
        .row-menu.open { display: block; }
        .row-menu-item {
            display: block; width: 100%; padding: 8px 12px;
            background: none; border: none; cursor: pointer;
            font-size: 13px; color: var(--ink-2); text-align: left;
        }
        .row-menu-item:hover { background: var(--light-bg); }
        .row-menu-item.danger { color: var(--red); }
        .row-menu-item.danger:hover { background: var(--red-bg); }

        /* T1-1: 输入名称二次确认 */
        .confirm-input {
            width: 100%; padding: 8px 10px;
            border: 2px solid var(--gray-bd); border-radius: var(--radius-md);
            font-size: 13px; font-family: var(--font-mono);
        }
        .confirm-input:focus { border-color: var(--accent); outline: none; }
        .confirm-input.unlocked { border-color: var(--green); }

        /* ==================== T1-6: Dirty 警告 ==================== */
        .dirty-bar {
            margin-top: 12px; padding: 10px 12px;
            background: var(--amber-bg); border: 1px solid var(--amber-bd);
            border-radius: var(--radius-md); color: var(--amber);
            font-size: 12px; display: flex; align-items: center; gap: 12px;
        }
        .dirty-bar a { color: var(--accent-deep); cursor: pointer; text-decoration: underline; font-weight: 600; }
        .dirty-tab-dot {
            display: inline-block; width: 6px; height: 6px;
            background: var(--amber); border-radius: 50%;
            margin-left: 4px; vertical-align: middle;
        }

        /* ==================== T1-5: checks 列表编辑器 ==================== */
        .checks-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .check-row {
            display: grid; grid-template-columns: 1.2fr 1.2fr 1fr 1.6fr auto;
            gap: 6px; align-items: center; padding: 8px;
            background: var(--gray-bg); border-radius: var(--radius-md);
        }
        .check-row .form-input { font-size: 12px; padding: 4px 8px; }
        .check-row .btn-sm { padding: 4px 10px; line-height: 1.4; }
        .checks-section {
            border: 1px dashed var(--gray-bd); border-radius: var(--radius-md);
            padding: 12px; margin-top: 8px;
        }
        .checks-section > .checks-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink-3); font-size: 12px; }
        .checks-section.collapsed > .checks-body { display: none; }

        /* run 详情 check 结果展示 */
        .check-result-list { margin-top: 12px; }
        .check-result-row {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; margin-bottom: 4px;
            background: var(--gray-bg); border-radius: var(--radius-sm);
            font-size: 12px;
        }
        .check-result-row .chk-status { width: 8px; height: 8px; border-radius: 50%; }
        .check-result-row .chk-status.pass { background: var(--green); }
        .check-result-row .chk-status.fail { background: var(--red); }

        /* ==================== T1-7: Token 模式分段控件 ==================== */
        .token-mode-segment {
            display: inline-flex; padding: 2px; background: var(--light-bg);
            border: 1px solid var(--gray-bd); border-radius: var(--radius-md);
            margin-bottom: 8px; gap: 0;
        }
        .token-mode-segment label {
            font-size: 12px; cursor: pointer;
            color: var(--ink-3); border-radius: var(--radius-sm);
            transition: all .12s ease; display: inline-flex;
        }
        .token-mode-segment input { display: none; }
        .token-mode-segment label span {
            display: inline-block; padding: 5px 14px;
            border-radius: var(--radius-sm);
        }
        .token-mode-segment input:checked + span {
            background: var(--card-bg); color: var(--accent-deep);
            font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.08);
        }
        .token-scope-fold {
            margin-top: 8px; padding: 8px 10px;
            background: var(--gray-bg); border-radius: var(--radius-md);
            font-size: 11px; color: var(--ink-4);
        }
        .token-scope-fold summary { cursor: pointer; color: var(--ink-3); font-size: 12px; }
        .token-empty-hint {
            padding: 8px 10px; background: var(--gray-bg); border-radius: var(--radius-md);
            font-size: 11px; color: var(--ink-4); text-align: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">simpleEval</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-item" data-page="projects" onclick="navigateTo('projects')">
                    <span>📁</span> 项目总览
                </div>
                <div style="flex: 1; overflow-y: auto;">
                    <div id="projectList"></div>
                </div>
                <div style="padding: 8px 16px; border-top: 1px solid #333;">
                    <button class="btn btn-sm" style="width: 100%; background: transparent; color: #9a9fab; border: 1px dashed #444;" onclick="showCreateProjectModal()">+ 新建项目</button>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div id="runningTasks"></div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="header">
                <h1 class="header-title" id="pageTitle">Projects</h1>
                <div class="header-actions" id="headerActions">
                    <!-- 动态按钮 -->
                </div>
            </header>
            <div class="content" id="mainContent">
                <!-- 动态内容 -->
            </div>
        </main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== 全局状态 ====================
        const state = {
            projects: [],
            currentProject: null,
            currentRun: null,
            currentEvalsets: null,
            currentEvalsetId: null,
            apiBase: '/api',
            // T1-6 dirty 检测
            _configSnapshot: null,    // 配置页打开时保存的 JSON 快照
            _configDirty: false,
            _suppressDirtyCheck: false, // 切到 config tab 初始化期间临时关闭
            // Judge 双模式共享的 auth/_rp 状态
            _judgeAuth: null,
            _judgeRpSample: '',
            _judgeRpActiveTarget: null
        };

        // ==================== 辅助函数 ====================
        function isProjectReady(project) {
            // 检查项目是否配置完整（Target API 和 Judge）
            // B-6: custom 模式不要求 model
            if (!project) return false;
            const tc = project.target_config || {};
            const jc = project.judge_config || {};
            const targetReady = tc.base_url && (tc.api_type === 'custom' ? true : !!tc.model);
            return !!(targetReady && jc.base_url && jc.model);
        }

        // ==================== API 客户端 ====================
        async function api(endpoint, options = {}) {
            try {
                const res = await fetch(state.apiBase + endpoint, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail?.error?.message || data.detail?.message || 'Request failed');
                }
                return data;
            } catch (err) {
                console.error('API Error:', err);
                showToast(err.message, 'error');
                throw err;
            }
        }

        // ==================== Toast 提示 ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✗' : '⚠'}</span><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== 侧栏项目列表 ====================
        // B-11: active 用 URL hash 判断（不依赖 state.currentProject），数据缓存（不每次 fetch）
        function getActiveProjectIdFromHash() {
            const parsed = parseHash(location.hash);
            if (!parsed) return null;
            if (parsed.page === 'project-detail') return parsed.params?.id || null;
            if (parsed.page === 'run-detail') return parsed.params?.projectId || null;
            return null;
        }

        function renderSidebarProjects() {
            const container = document.getElementById('projectList');
            if (!container) return;
            const projects = state.sidebarProjects || [];
            const activeId = getActiveProjectIdFromHash();
            if (projects.length === 0) {
                container.innerHTML = '<div style="padding: 10px 16px; color: var(--ink-5); font-size: 12px;">暂无项目</div>';
                return;
            }
            container.innerHTML = projects.map(p => {
                const hasRunning = p.last_run?.status === 'running' || p.last_run?.status === 'queued';
                return `
                    <div class="nav-item project-item ${activeId === p.id ? 'active' : ''}"
                         data-page="project-detail" data-id="${escapeHtml(p.id)}"
                         onclick="navigateTo('project-detail', {id: '${escapeHtml(p.id)}'})">
                        ${hasRunning ? '<span class="status-dot"></span>' : '<span style="width: 6px;"></span>'}
                        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(p.name)}</span>
                    </div>
                `;
            }).join('');
        }

        async function loadSidebarProjects(force = false) {
            const container = document.getElementById('projectList');
            if (!container) return;
            // 有缓存且不强制 → 立即渲染（0 延迟，点击同步切换 active）
            if (state.sidebarProjects && !force) {
                renderSidebarProjects();
                return;
            }
            try {
                const data = await api('/projects');
                state.sidebarProjects = data.projects || [];
                renderSidebarProjects();
            } catch (err) {
                container.innerHTML = '<div style="padding: 10px 16px; color: var(--ink-5); font-size: 12px;">加载失败</div>';
            }
        }

        // 强制刷新侧栏（项目增删后调用）
        function refreshSidebarProjects() {
            state.sidebarProjects = null;
            loadSidebarProjects(true);
        }

        // ==================== 页面导航（带 hash 路由）====================
        // 程序化改 hash 时设此 flag，避免 hashchange 再触发一次 navigateTo 造成循环
        let _programmaticHash = false;

        function buildHash(page, params = {}) {
            if (page === 'projects') return '#/projects';
            if (page === 'project-detail') return `#/project/${encodeURIComponent(params.id || '')}`;
            if (page === 'run-detail') return `#/run/${encodeURIComponent(params.projectId || '')}/${encodeURIComponent(params.id || '')}`;
            return '#/projects';
        }

        function parseHash(hash) {
            const h = (hash || '').replace(/^#\/?/, '');
            if (!h) return null;
            const parts = h.split('/').map(decodeURIComponent);
            if (parts[0] === 'projects') return { page: 'projects' };
            if (parts[0] === 'project' && parts[1]) return { page: 'project-detail', params: { id: parts[1] } };
            if (parts[0] === 'run' && parts[1] && parts[2]) return { page: 'run-detail', params: { id: parts[2], projectId: parts[1] } };
            return null;
        }

        function navigateTo(page, params = {}) {
            // T1-6: 当前在 config tab 且 dirty 时，拦截离开
            if (state._configDirty && !_isNavigationSelf(page, params)) {
                showDiscardDirtyConfirm(() => {
                    state._configDirty = false;
                    state._configSnapshot = null;
                    removeConfigDirtyDot();
                    _navigateToNoCheck(page, params);
                });
                return;
            }
            _navigateToNoCheck(page, params);
        }

        // 同页同参数（如 openRunModal 二次导航）不视为离开，不拦截
        function _isNavigationSelf(page, params) {
            // 切到当前页面（如刷新当前项目详情）属于用户主动行为，仍拦截；此处仅跳过完全同 hash 的调用
            return false;
        }

        function _navigateToNoCheck(page, params = {}) {
            // 同步 hash（静默：不触发 hashchange 二次导航）
            const newHash = buildHash(page, params);
            if (location.hash !== newHash) {
                _programmaticHash = true;
                location.hash = newHash;
            }
            runNavigation(page, params);
        }

        // T1-6: 浏览器刷新/关闭拦截 —— beforeunload 由浏览器原生弹窗处理
        window.addEventListener('beforeunload', (e) => {
            if (state._configDirty) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        function runNavigation(page, params = {}) {
            // 加载侧栏项目列表（B-11: 有缓存时同步渲染，active 用 URL 判断）
            loadSidebarProjects();

            document.getElementById('pageTitle').textContent = page === 'projects' ? '项目总览' : page === 'project-detail' ? (state.currentProject?.name || '项目详情') : page === 'run-detail' ? (state.currentRun?.id || 'Run 详情') : page;

            // 清除非侧栏项目的 active（保留侧栏 project-item 的 active，由 loadSidebarProjects 用 URL 同步设好）
            document.querySelectorAll('.nav-item:not(.project-item)').forEach(el => el.classList.remove('active'));

            const content = document.getElementById('mainContent');
            const headerActions = document.getElementById('headerActions');
            headerActions.innerHTML = '';

            switch(page) {
                case 'projects':
                    renderProjectsPage(content, headerActions);
                    break;
                case 'project-detail':
                    renderProjectDetailPage(content, headerActions, params);
                    break;
                case 'run-detail':
                    renderRunDetailPage(content, headerActions, params);
                    break;
            }
        }

        // 记录上一个 hash，供 hashchange 时拦截 dirty 后回滚
        let _lastConfirmedHash = location.hash;
        window.addEventListener('hashchange', () => {
            if (_programmaticHash) { _programmaticHash = false; _lastConfirmedHash = location.hash; return; }
            const parsed = parseHash(location.hash);
            if (!parsed) { runNavigation('projects'); _lastConfirmedHash = location.hash; return; }
            // T1-6: dirty 拦截 —— 用户用浏览器前进/后退或手动改 hash 时
            if (state._configDirty) {
                // 回滚 hash（同步设 _programmaticHash，避免回滚再触发）
                _programmaticHash = true;
                location.hash = _lastConfirmedHash;
                showDiscardDirtyConfirm(() => {
                    state._configDirty = false;
                    state._configSnapshot = null;
                    removeConfigDirtyDot();
                    _navigateToNoCheck(parsed.page, parsed.params || {});
                    _lastConfirmedHash = location.hash;
                });
                return;
            }
            runNavigation(parsed.page, parsed.params || {});
            _lastConfirmedHash = location.hash;
        });

        // ==================== 骨架屏工具 ====================
        function skeletonRows(n, cols, widths) {
            // widths: 数组，每列宽度比例（如 ['w-60', 'w-40']），缺省用 'w-80'
            return Array.from({length: n}).map(() => {
                const tds = Array.from({length: cols}).map((_, i) => {
                    const w = (widths && widths[i]) || 'w-80';
                    return `<td class="skeleton-cell"><div class="skeleton skeleton-line ${w}"></div></td>`;
                }).join('');
                return `<tr class="skeleton-row">${tds}</tr>`;
            }).join('');
        }

        function skeletonMetrics(n) {
            return Array.from({length: n}).map(() =>
                `<div class="metric-card"><div class="skeleton skeleton-line w-60" style="height: 24px; margin-bottom: 6px;"></div><div class="skeleton skeleton-line w-40"></div></div>`
            ).join('');
        }

        // ==================== 运行中任务胶囊 ====================
        async function loadRunningTasks() {
            const container = document.getElementById('runningTasks');
            if (!container) return;
            try {
                const data = await api('/projects');
                const projects = data.projects || [];
                const running = [];
                for (const p of projects) {
                    const lr = p.last_run;
                    if (lr && (lr.status === 'running' || lr.status === 'queued')) {
                        running.push({ projectId: p.id, projectName: p.name, runId: lr.id, status: lr.status });
                    }
                }
                state.runningTasks = running;
                if (running.length === 0) {
                    container.innerHTML = '';
                    return;
                }
                container.innerHTML = `<div class="task-list">${running.map(t => `
                    <div class="task-indicator" title="${escapeHtml(t.status === 'running' ? '运行中' : '排队中')}：${escapeHtml(t.projectName)} — ${escapeHtml(t.runId)}"
                         onclick="navigateTo('run-detail', {id: '${escapeHtml(t.runId)}', projectId: '${escapeHtml(t.projectId)}'})">
                        <span class="status-dot"></span>
                        <span class="task-name">${escapeHtml(t.projectName)}</span>
                    </div>
                `).join('')}</div>`;
            } catch (err) {
                // 静默失败，不打扰用户
                container.innerHTML = '';
            }
        }

        // ==================== Projects 列表页 ====================
        async function renderProjectsPage(container, headerActions) {
            headerActions.innerHTML = '';

            // 骨架屏：API 拉取前先填充表格骨架，避免空白闪烁
            container.innerHTML = `
                <div class="card">
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>名称</th>
                                    <th>最近评测</th>
                                    <th>pass rate</th>
                                    <th>token</th>
                                    <th>趋势</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${skeletonRows(4, 6, ['w-60', 'w-40', 'w-40', 'w-30', 'w-40', 'w-30'])}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            try {
                const data = await api('/projects');
                state.projects = data.projects || [];

                if (state.projects.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📁</div>
                            <div class="empty-state-text">还没有 Project，点击右上角新建——配置一个 Judge + 一个被评测 API 就能跑第一次评测</div>
                            <button class="btn btn-primary" onclick="showCreateProjectModal()">+ 新建 Project</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="card">
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>名称</th>
                                        <th>最近评测</th>
                                        <th>pass rate</th>
                                        <th>token</th>
                                        <th>趋势</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.projects.map(p => `
                                        <tr>
                                            <td><strong>${escapeHtml(p.name)}</strong></td>
                                            <td>
                                                ${p.last_run ? `
                                                    <span class="text-muted">${formatRelativeTime(p.last_run.created_at)}</span><br>
                                                    <span class="mono" style="font-size:11px">${escapeHtml(p.last_run.id)}</span>
                                                ` : '<span class="text-muted">从未评测</span>'}
                                            </td>
                                            <td>
                                                ${p.last_run ? `
                                                    <span class="num" style="color: ${p.last_run.pass_rate >= 0.8 ? 'var(--green)' : p.last_run.pass_rate >= 0.5 ? 'var(--amber)' : 'var(--red)'}">
                                                        ${(p.last_run.pass_rate * 100).toFixed(1)}%
                                                    </span>
                                                ` : '-'}
                                            </td>
                                            <td class="num">${p.last_run ? formatNumber(p.last_run.total_token) : '-'}</td>
                                            <td>${renderSparkline(p.trend || [])}</td>
                                            <td>
                                                ${isProjectReady(p) ? `
                                                    <button class="btn btn-sm btn-secondary" onclick="runProjectEval('${escapeHtml(p.id)}')" ${p.last_run?.status === 'running' || p.last_run?.status === 'queued' ? 'disabled' : ''}>▶ 运行</button>
                                                ` : `
                                                    <button class="btn btn-sm" disabled title="请先配置 Target API 和 Judge">▶ 配置不完整</button>
                                                `}
                                                <button class="btn btn-sm btn-secondary" onclick="navigateTo('project-detail', {id: '${escapeHtml(p.id)}'})">查看</button>
                                                <div class="row-menu-wrap">
                                                    <button class="btn btn-sm btn-secondary" onclick="toggleRowMenu(event, 'menu-${escapeHtml(p.id)}')">⋯</button>
                                                    <div class="row-menu" id="menu-${escapeHtml(p.id)}">
                                                        <button class="row-menu-item" onclick="closeAllRowMenus(); navigateTo('project-detail', {id: '${escapeHtml(p.id)}'})">查看详情</button>
                                                        <button class="row-menu-item danger" onclick="closeAllRowMenus(); showDeleteProjectModal('${escapeHtml(p.id)}')">删除项目</button>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">加载失败: ${escapeHtml(err.message)}</div></div>`;
            }
        }

        function renderSparkline(data) {
            if (!data.length) return '-';
            // B-9: y 轴固定 0–1（pass_rate 为 0-1 小数），禁止 min-max 缩放
            const height = 20;
            const width = 60;
            const points = data.map((d, i) => {
                const x = data.length === 1 ? width / 2 : (i / (data.length - 1)) * width;
                const y = height - d.pass_rate * height;
                return `${x},${y}`;
            }).join(' ');
            return `<svg width="${width}" height="${height}"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
        }

        // B-9: 概览趋势图（双系列：pass_rate 折线 + total_token 浅柱）
        function renderTrendChart(trend) {
            if (!trend || !trend.length) return '<div class="empty-state-text">暂无趋势数据</div>';
            const n = trend.length;
            const width = 440;
            const height = 140;
            const pad = { top: 16, right: 20, bottom: 28, left: 44 };
            const plotW = width - pad.left - pad.right;
            const plotH = height - pad.top - pad.bottom;

            // token 最大值用于柱状图缩放
            const maxToken = Math.max(...trend.map(d => d.total_token || 0), 1);
            const barW = Math.min(plotW / n * 0.5, 20);
            const xStep = n === 1 ? 0 : plotW / (n - 1);
            const xFor = i => n === 1 ? pad.left + plotW / 2 : pad.left + i * xStep;
            // pass_rate y 轴固定 0-1
            const yRateFor = v => pad.top + plotH * (1 - v);
            // token y 轴 0-maxToken
            const yTokenFor = v => pad.top + plotH * (1 - v / maxToken);

            // 网格
            let grid = '';
            for (const v of [0, 0.5, 1.0]) {
                const y = yRateFor(v);
                grid += `<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--border)"/>`;
                grid += `<text x="${pad.left - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--ink-4)">${v.toFixed(1)}</text>`;
            }

            // token 柱
            let bars = '';
            trend.forEach((d, i) => {
                const x = xFor(i) - barW / 2;
                const y = yTokenFor(d.total_token || 0);
                const h = pad.top + plotH - y;
                bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--accent-pale)" rx="2"/>`;
            });

            // pass_rate 折线

            const id = 'dirtyConfirmModal';

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = id;
            modal.innerHTML = `
                <div class="modal">

                        <span class="modal-title">${title}</span>

        // ==================== 采样稳定性卡片 ====================
        async function loadSamplingCard(projectId) {

        function renderSamplingCard(data) {
            // 空态：没有 run
            if (data.total_runs === 0) {
                return `
                    <div class="empty-state" style="padding: 24px 0;">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">跑两次评测后这里会显示采样稳定性</div>
                    </div>
                    <div style="padding: 0 0 8px; color: var(--ink-5); font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px;">
                        基于 case_name 跨 run 对齐，评测集改动可能稀释结果
                    </div>
                `;
            }

            const kValues = data.k_values || [1, 2, 3];
            const atK = data.pass_at_k || [];
            const powK = data.pass_pow_k || [];
            const totalCases = data.total_cases || 0;

            // 检查是否所有 k 的 value 都是 null（数据不足）
            const allNull = atK.every(e => e.value === null) && powK.every(e => e.value === null);
            if (allNull) {
                return `
                    <div class="empty-state" style="padding: 24px 0;">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">已有 ${data.total_runs} 次 run，但采样数不足以计算 pass@k/pass^k（需至少 2 次）</div>
                    </div>
                    <div style="padding: 0 0 8px; color: var(--ink-5); font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px;">
                        基于 case_name 跨 run 对齐，评测集改动可能稀释结果
                    </div>
                `;
            }

            // 渲染 SVG 折线图
            const svg = renderSamplingChart(atK, powK, totalCases);

            // 图例
            const legend = `
                <div style="display: flex; gap: 16px; margin-top: 8px; font-size: 12px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 16px; height: 2px; background: var(--accent); display: inline-block;"></span>
                        <span style="color: var(--ink-3);">pass@k（潜力上界）</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 16px; height: 2px; background: var(--ink-5); display: inline-block; border-bottom: 1px dashed var(--ink-5);"></span>
                        <span style="color: var(--ink-3);">pass^k（稳定下界）</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 12px; height: 12px; background: var(--accent-pale); display: inline-block; border: 1px solid var(--accent-bd);"></span>
                        <span style="color: var(--ink-3);">不确定性区间</span>
                    </div>
                </div>
            `;

            // 低 coverage 提示
            const lowCoverageHints = [];
            for (const entry of atK) {
                if (totalCases > 0 && entry.coverage / totalCases < 0.6) {
                    const needed = entry.k - data.total_runs;
                    if (entry.coverage === 0) {
                        lowCoverageHints.push(`<div style="color: var(--amber);">k=${entry.k}：需至少 ${entry.k} 次 run 才能计算（当前 ${data.total_runs} 次）</div>`);
                    } else {
                        lowCoverageHints.push(`<div style="color: var(--amber);">k=${entry.k}：采样不足（${entry.coverage}/${totalCases} 个 case 满足 n≥${entry.k}）</div>`);
                    }
                }
            }
            const hintsHtml = lowCoverageHints.length > 0
                ? `<div style="margin-top: 8px; font-size: 11px; padding: 8px 10px; background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: var(--radius-sm);">${lowCoverageHints.join('')}</div>`
                : '';

            return `
                ${svg}
                ${legend}
                ${hintsHtml}
                <div style="margin-top: 12px; color: var(--ink-5); font-size: 11px; border-top: 1px solid var(--border); padding-top: 8px;">
                    基于 case_name 跨 run 对齐，评测集改动可能稀释结果 · 共 ${data.total_runs} 次 run · ${totalCases} 个 case
                </div>
            `;
        }

        // 采样稳定性 SVG 折线图
        function renderSamplingChart(atK, powK, totalCases) {
            const width = 480;
            const height = 160;
            const padding = { top: 16, right: 24, bottom: 32, left: 36 };
            const plotW = width - padding.left - padding.right;
            const plotH = height - padding.top - padding.bottom;

            const kValues = atK.map(e => e.k);
            const n = kValues.length;
            if (n === 0) return '';

            // x 映射：k 值 -> x 坐标
            const xFor = (k) => {
                const idx = kValues.indexOf(k);
                if (n === 1) return padding.left + plotW / 2;
                return padding.left + (plotW * idx) / (n - 1);
            };
            // y 映射：[0, 1] -> y 坐标（倒序）
            const yFor = (v) => padding.top + plotH * (1 - v);

            // 网格线（y=0, 0.25, 0.5, 0.75, 1.0）
            let gridHtml = '';
            for (const v of [0, 0.25, 0.5, 0.75, 1.0]) {
                const y = yFor(v);
                gridHtml += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
                gridHtml += `<text x="${padding.left - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--ink-4)">${v.toFixed(2)}</text>`;
            }

            // x 轴标签
            let xLabelsHtml = '';
            for (const k of kValues) {
                const x = xFor(k);
                xLabelsHtml += `<text x="${x}" y="${height - 10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">k=${k}</text>`;
            }

            // 判断点是否低 coverage（标灰）
            const isLowCov = (entry) => totalCases > 0 && (entry.coverage / totalCases) < 0.6;

            // 构造折线路径（跳过 value=null 的点，但这些点不连线）
            const buildPath = (entries, withGap = true) => {
                const pts = [];
                for (const e of entries) {
                    if (e.value === null) {
                        pts.push(null); // gap
                    } else {
                        pts.push({ x: xFor(e.k), y: yFor(e.value), low: isLowCov(e) });
                    }
                }
                let path = '';
                let inSegment = false;
                for (const p of pts) {
                    if (p === null) {
                        inSegment = false;
                    } else {
                        if (!inSegment) {
                            path += `M ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
                            inSegment = true;
                        } else {
                            path += ` L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
                        }
                    }
                }
                return path;
            };

            const atPath = buildPath(atK);
            const powPath = buildPath(powK);

            // 不确定性区域（pass@k 与 pass^k 之间）
            let areaPath = '';
            const atPts = atK.map(e => e.value === null ? null : { x: xFor(e.k), y: yFor(e.value) });
            const powPts = powK.map(e => e.value === null ? null : { x: xFor(e.k), y: yFor(e.value) });
            // 上边界（atK）从左到右
            let upperPts = atPts.filter(p => p !== null);
            let lowerPts = powPts.filter(p => p !== null).slice().reverse();
            if (upperPts.length >= 2 && lowerPts.length >= 2) {
                areaPath = 'M ' + upperPts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
                areaPath += ' L ' + lowerPts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ');
                areaPath += ' Z';
            }

            // 数据点
            let pointsHtml = '';
            for (const e of atK) {
                if (e.value === null) continue;
                const x = xFor(e.k);
                const y = yFor(e.value);
                const color = isLowCov(e) ? 'var(--ink-5)' : 'var(--accent)';
                pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${color}" stroke="white" stroke-width="1.5"/>`;
            }
            for (const e of powK) {
                if (e.value === null) continue;
                const x = xFor(e.k);
                const y = yFor(e.value);
                const color = isLowCov(e) ? 'var(--ink-6)' : 'var(--ink-3)';
                pointsHtml += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" stroke="white" stroke-width="1"/>`;
            }

            return `
                <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="max-width: 100%;">
                    ${gridHtml}
                    ${areaPath ? `<path d="${areaPath}" fill="var(--accent-pale)" fill-opacity="0.5" stroke="none"/>` : ''}
                    ${powPath ? `<path d="${powPath}" fill="none" stroke="var(--ink-5)" stroke-width="1.5" stroke-dasharray="4 3"/>` : ''}
                    ${atPath ? `<path d="${atPath}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : ''}
                    ${pointsHtml}
                    ${xLabelsHtml}
                </svg>
            `;
        }

        function renderEvalsetDetail(evalset, projectId) {

            (cases || []).forEach(c => (c.tags || []).forEach(t => { if (!allTags.includes(t)) allTags.push(t); }));
            state._currentEvalsetAllTags = allTags;
            // 用例预览文本（按 eval_type 取对应字段）
            const previewField = c => {
                if (c.eval_type === 'llm_judge') return c.output_requirement;
                if (c.eval_type === 'contains' || c.eval_type === 'not_contains') return c.eval_params?.substring;
                if (c.eval_type === 'length') {
                    const mn = c.eval_params?.min;
                    const mx = c.eval_params?.max;
                    return `[${mn ?? 0}, ${mx ?? '∞'}]`;
                }
                return c.expected_output;
            };
            // 表格内的 tag chips
            const renderTagsCell = c => {
                const tags = c.tags || [];
                if (!tags.length) return '<span class="text-muted">-</span>';
                return `<div class="tag-cell" style="display:flex;flex-wrap:wrap;gap:2px;">` +

            return `

                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${escapeHtml(evalset.name)}</span>
                            <div class="flex gap-2">
                                <button class="btn btn-sm btn-secondary" onclick="showImportModal('${evalset.id}', '${projectId}')">⤒ 导入</button>
                                <button class="btn btn-sm btn-secondary" onclick="exportEvalSet('${evalset.id}', '${projectId}')">⇩ 导出</button>
                                <button class="btn btn-sm btn-secondary" style="color: var(--red); border-color: var(--red-bd);" onclick="showClearEvalsetModal(state.currentEvalsets.find(e => e.id === '${evalset.id}'), '${projectId}')" ${cases.length === 0 ? 'disabled title="评测集已空"' : ''}>清空评测集</button>
                                <button class="btn btn-sm btn-primary" onclick="showCaseEditorModal('${evalset.id}', '${projectId}', null)">+ 新增用例</button>
                            </div>
                        </div>
                        <div style="padding: 8px 16px; color: var(--ink-4); font-size: 12px;">

                        </div>

                            <button class="btn btn-sm btn-secondary" onclick="batchToggleCases('${evalset.id}', '${projectId}', true)">批量启用</button>
                            <button class="btn btn-sm btn-secondary" onclick="batchToggleCases('${evalset.id}', '${projectId}', false)">批量禁用</button>

                                        <tr style="${c.enabled === false ? 'opacity: 0.5' : ''}">
                                            <td><input type="checkbox" class="batch-case-cb" value="${escapeHtml(c.id)}" onchange="updateBatchOpsBar()"></td>

                                            <td class="truncate mono">${escapeHtml(c.input || '-')}</td>

                            </table>

                    </div>

            `;

        // B-16: 批量操作辅助函数
        function getSelectedCaseIds() {
            return Array.from(document.querySelectorAll('.batch-case-cb:checked')).map(cb => cb.value);
        }

        function updateBatchOpsBar() {
            const bar = document.getElementById('batchOpsBar');
            const countEl = document.getElementById('batchSelectedCount');
            const selected = getSelectedCaseIds();
            if (bar) bar.style.display = selected.length > 0 ? 'flex' : 'none';
            if (countEl) countEl.textContent = '已选 ' + selected.length + ' 条';
            // 联动表头全选状态
            const selectAll = document.getElementById('batchSelectAll');
            const allCbs = document.querySelectorAll('.batch-case-cb');
            if (selectAll && allCbs.length > 0) {
                selectAll.checked = Array.from(allCbs).every(cb => cb.checked);
            }
        }

        function toggleBatchSelectAll() {
            const selectAll = document.getElementById('batchSelectAll');
            if (!selectAll) return;
            document.querySelectorAll('.batch-case-cb').forEach(cb => { cb.checked = selectAll.checked; });
            updateBatchOpsBar();
        }

        async function batchToggleCases(evalsetId, projectId, enable) {
            const ids = getSelectedCaseIds();
            if (ids.length === 0) { showToast('未选中用例', 'warning'); return; }
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = (evalset.cases || []).map(c => ids.includes(c.id) ? { ...c, enabled: enable } : c);
                await api(`/evalsets/${evalsetId}`, { method: 'PUT', body: JSON.stringify({ ...evalset, cases }) });
                showToast('已' + (enable ? '启用' : '禁用') + ' ' + ids.length + ' 条用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        function showBatchDeleteModal(evalsetId, projectId) {
            const ids = getSelectedCaseIds();
            if (ids.length === 0) { showToast('未选中用例', 'warning'); return; }
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'batchDeleteModal';
            modal.innerHTML = `
                <div class="modal" style="max-width: 480px;">
                    <div class="modal-header">
                        <span class="modal-title" style="color: var(--red);">确认批量删除</span>
                        <button class="modal-close" onclick="closeModal('batchDeleteModal')">×</button>
                    </div>
                    <div class="modal-body">
                        <div style="margin-bottom: 12px;">
                            将永久删除选中的 <strong>${ids.length}</strong> 条用例。
                        </div>
                        <div style="background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 6px; font-size: 13px;">
                            删除后无法恢复；历史 run 中这些 case 的结果保留。
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('batchDeleteModal')">取消</button>
                        <button class="btn btn-danger" onclick="confirmBatchDelete('${evalsetId}', '${projectId}')">永久删除</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function confirmBatchDelete(evalsetId, projectId) {
            const ids = getSelectedCaseIds();
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = (evalset.cases || []).filter(c => !ids.includes(c.id));
                await api(`/evalsets/${evalsetId}`, { method: 'PUT', body: JSON.stringify({ ...evalset, cases }) });
                closeModal('batchDeleteModal');
                showToast('已删除 ' + ids.length + ' 条用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        // B-5: 用例新增/编辑弹窗（caseId 为 null = 新增）

                            <label class="form-label">variables（可选，模板 {key} 占位符变量）</label>

                            <label class="form-label">标签 tags（逗号分隔，可混合已有标签）</label>
                            <input type="text" class="form-input" id="ceTags" value="${escapeHtml(tagsStr)}" placeholder="如：regression, smoke" oninput="renderTagsPreview(this.value, 'ceTagsPreview')">
                            <div id="ceTagsPreview" class="tag-chips"></div>
                            <div style="font-size: 11px; color: var(--ink-4); margin-top: 4px;">发起评测时可按标签筛选参与的 case</div>
                        </div>
                        <div class="checks-section collapsed" id="ceChecksSection">

            initCheckRows(c.checks || []);
