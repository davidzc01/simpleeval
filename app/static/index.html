        function updateRunDetailDom(run, evalsetMap) {
            // V-5: 更新表头排序指示器
            const thead = document.querySelector('#caseTableBody')?.closest('table')?.querySelector('thead');
            if (thead) {
                thead.innerHTML = `<tr>
                    <th>状态</th>
                    <th>case 名</th>
                    <th>评测类型</th>
                    <th style="cursor: pointer;" onclick="sortRunDetailBy('score')">得分${sortIndicator('score', state._runDetailSortKey, state._runDetailSortDir)}</th>
                    <th style="cursor: pointer;" onclick="sortRunDetailBy('latency')">延迟${sortIndicator('latency', state._runDetailSortKey, state._runDetailSortDir)}</th>
                    <th style="cursor: pointer;" onclick="sortRunDetailBy('token')">token${sortIndicator('token', state._runDetailSortKey, state._runDetailSortDir)}</th>
                    <th>操作</th>
                </tr>`;
            }
            const totalEnabled = state.currentRunEvalset
                ? (state.currentRunEvalset.cases || []).filter(c => c.enabled).length
                : 0;
            const completed = run.results?.length || 0;
            const failed = run.results?.filter(r => !r.passed && !r.skipped_reason).length || 0;
            const pct = totalEnabled > 0 ? Math.min(100, (completed / totalEnabled) * 100) : (run.status === 'completed' ? 100 : 0);

            const statusRow = document.getElementById('runStatusRow');
            if (statusRow) {
                const triggerBadge = run.trigger === 'scheduled'
                    ? '<span class="tag-chip" style="font-size: 10px; margin-right: 8px;">⏰ 定时触发</span>'
                    : '';
                statusRow.innerHTML = `
                    ${triggerBadge}<span style="margin-right: 12px;">${runStatusBadge(run.status)}</span>
                    ${(run.status === 'running' || run.status === 'queued') ? `
                        <div class="progress-bar" style="display: inline-block; width: 200px; vertical-align: middle;">
                            <div class="progress-fill" style="width: ${pct}%"></div>
                        </div>
                        <span style="margin-left: 8px; color: var(--ink-4); font-size: 12px;">${completed}/${totalEnabled || '?'}</span>
                    ` : ''}
                `;
            }

            const errDiv = document.getElementById('runError');
            if (errDiv) {
                errDiv.innerHTML = run.error
                    ? `<div class="code-block" style="color: var(--red);">Error: ${escapeHtml(run.error)}</div>`
                    : '';
            }

            // T2-4: budget_exceeded 横幅
            const budgetBanner = document.getElementById('runBudgetBanner');
            if (budgetBanner) {
                const s = run.summary;
                if (s && s.budget_exceeded) {
                    const skippedCount = (run.results || []).filter(r => r.skipped_reason === 'budget_exceeded').length;
                    budgetBanner.innerHTML = `
                        <div style="padding: 10px 14px; margin: 12px 0; background: rgba(255, 159, 28, 0.12); border: 1px solid rgba(255, 159, 28, 0.4); border-radius: 6px; color: var(--ink-2); font-size: 13px;">
                            <strong style="color: var(--amber);">⚠ 评测因 token 预算中断</strong>
                            <span style="color: var(--ink-3);"> · 跳过 ${skippedCount} 条 case（预算上限 ${formatNumber(s.total_token + s.judge_token)} token）</span>
                        </div>
                    `;
                } else {
                    budgetBanner.innerHTML = '';
                }
            }

            const metrics = document.getElementById('metricsGrid');
            if (metrics) {
                const s = run.summary;
                // B-18: 全部 case 的 token 都不可得时，token 类指标卡显示「token 不可得」
                const anyMissing = (run.results || []).some(r => r.token_missing);
                const allMissing = anyMissing && (run.results || []).every(r => r.token_missing);
                const tokenVal = !s ? '-' : (allMissing
                    ? `<span style="font-size: 12px; color: var(--ink-4);" title="响应未配置 token 统计路径，或路径未命中">token 不可得</span>`
                    : formatNumber(s.total_token));
                const tppVal = !s ? '-' : (allMissing
                    ? `<span style="font-size: 12px; color: var(--ink-4);" title="token 不可得，完成率无法计算">token 不可得</span>`
                    : s.token_per_pass.toFixed(1) + ' <span style="font-size: 12px; color: var(--ink-4);">个/万token</span>');
                metrics.innerHTML = `
                    <div class="metric-card">
                        <div class="metric-value num">${s ? (s.pass_rate * 100).toFixed(1) + '%' : '-'}</div>
                        <div class="metric-label">pass rate</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value num">${tokenVal}</div>
                        <div class="metric-label">总 token${s && s.judge_token ? ` <span style="font-size: 10px; color: var(--ink-4);" title="被评测消耗 ${formatNumber(s.total_token - s.judge_token)} + Judge 评测自身消耗 ${formatNumber(s.judge_token)}">(含 Judge ${formatNumber(s.judge_token)})</span>` : ''}</div>
                    </div>
                    <div class="metric-card" title="${allMissing ? 'token 不可得，完成率无法计算' : '通过数 / ((target_token + judge_token) / 10000)'}">
                        <div class="metric-value num">${tppVal}</div>
                        <div class="metric-label">每万 token 完成率</div>
                    </div>
                    <div class="metric-card" title="${s && s.concurrency > 1 ? `延迟在 ${s.concurrency} 并发下采集，仅参考（并发会引入噪声）` : 'P50 中位数延迟'}">
                        <div class="metric-value num">${s ? (s.latency_p50 / 1000).toFixed(1) + 's' : '-'}</div>
                        <div class="metric-label">P50 延迟${s && s.concurrency > 1 ? ` <span style="font-size: 10px; color: var(--amber);">[${s.concurrency} 并发]</span>` : ''}</div>
                    </div>
                    <div class="metric-card" title="${s && s.concurrency > 1 ? `延迟在 ${s.concurrency} 并发下采集，仅参考（并发会引入噪声）` : 'P95 长尾延迟'}">
                        <div class="metric-value num">${s ? (s.latency_p95 / 1000).toFixed(1) + 's' : '-'}</div>
                        <div class="metric-label">P95 延迟${s && s.concurrency > 1 ? ` <span style="font-size: 10px; color: var(--amber);">[${s.concurrency} 并发]</span>` : ''}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value num" style="color: ${failed > 0 ? 'var(--red)' : 'inherit'}">${failed}</div>
                        <div class="metric-label">失败</div>
                    </div>
                `;
            }

            const tbody = document.getElementById('caseTableBody');
            if (tbody) {
                // V-5: 排序（轮询时保持用户已选排序）
                let caseResults = run.results || [];
                if (state._runDetailSortKey && state._runDetailSortDir) {
                    caseResults = applySort(caseResults, state._runDetailSortKey, state._runDetailSortDir, (key, r) => {
                        if (key === 'score') return r.score ?? 0;
                        if (key === 'latency') return r.latency_ms ?? 0;
                        if (key === 'token') return r.token_used ?? 0;
                        return 0;
                    });
                }
                tbody.innerHTML = caseResults.map((r, i) => {
                    const cs = evalsetMap[r.case_name] || {};
                    const evalType = cs.eval_type || '-';
                    return `
                        <tr>
                            <td>
                                ${r.skipped_reason ? `
                                    <span class="status-badge status-disabled"><span class="status-dot"></span>跳过</span>
                                ` : r.passed ? `
                                    <span class="status-badge status-passed"><span class="status-dot"></span>通过</span>
                                ` : `
                                    <span class="status-badge status-failed"><span class="status-dot"></span>失败</span>
                                `}
                            </td>
                            <td>${escapeHtml(r.case_name)}</td>
                            <td><span class="tag tag-${evalType}">${escapeHtml(evalType)}</span></td>
                            <td class="num">${(r.score ?? 0).toFixed(1)}</td>
                            <td class="num">${((r.latency_ms || 0) / 1000).toFixed(1)}s</td>
                            <td class="num">${r.token_missing
                                ? `<span style="font-size: 11px; color: var(--ink-4);" title="响应未配置 token 统计路径，或路径未命中">token 不可得</span>`
                                : r.token_used}</td>
                            <td>
                                <button class="btn btn-sm btn-secondary" onclick="showRunCaseDetail(${i})">查看</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // 静默轮询：指数退避，弹窗打开/页面隐藏时暂停
        let runPollTimer = null;
        let runPollDelay = 2000;
        const RUN_POLL_MAX_DELAY = 10000;

        function startRunPolling(params) {
            stopRunPolling();
            runPollDelay = 2000;
            document.removeEventListener('visibilitychange', onVisibilityChange);
            document.addEventListener('visibilitychange', onVisibilityChange);
            scheduleRunPoll(params);
        }

        function stopRunPolling() {
            if (runPollTimer) { clearTimeout(runPollTimer); runPollTimer = null; }
        }

        function onVisibilityChange() {
            const params = state.currentRunParams;
            if (!params) return;
            if (document.hidden) {
                stopRunPolling();
            } else {
                // 恢复时立即补拉
                pollRunOnce(params);
            }
        }

        function scheduleRunPoll(params) {
            stopRunPolling();
            runPollTimer = setTimeout(() => pollRunOnce(params), runPollDelay);
        }

        async function pollRunOnce(params) {
            // 终止条件：run 已结束 / 已离开 run 详情页
            if (!state.currentRunParams || state.currentRunParams.id !== params.id) return;
            const status = state.currentRun?.status;
            if (status === 'completed' || status === 'failed') return;

            // 弹窗打开时暂停轮询，但仍排程下一轮（让用户关闭弹窗后继续）
            const modal = document.getElementById('caseModal');
            if (modal && !modal.classList.contains('hidden')) {
                scheduleRunPoll(params);
                return;
            }
            if (document.hidden) return;

            try {
                const run = await api(`/runs/${params.id}?project_id=${params.projectId}`);
                state.currentRun = run;
                let evalsetMap = {};
                if (state.currentRunEvalset) {
                    (state.currentRunEvalset.cases || []).forEach(c => { evalsetMap[c.case_name] = c; });
                }
                updateRunDetailDom(run, evalsetMap);
                // 指数退避
                runPollDelay = Math.min(RUN_POLL_MAX_DELAY, runPollDelay * 1.5);
                if (run.status === 'running' || run.status === 'queued') {
                    scheduleRunPoll(params);
                }
            } catch (err) {
                // 网络错误时降速重试
                runPollDelay = Math.min(RUN_POLL_MAX_DELAY, runPollDelay * 1.5);
                scheduleRunPoll(params);
            }
        }

        // P-1: 统一规格——Case 对比视图（run 详情「查看」）与统计弹窗「详情」共用渲染函数
        // 规格基准：三栏对比（INPUT/EXPECTED/ACTUAL，超长截断+展开）+ 判定行 + 多验证列表 + Judge 信息
        function renderCaseRunDetailBody(hh, judge) {
            // 兼容字段：run.results[i] 与 history 项字段差异统一
            const actualOutput = hh.actual_output || hh.actual || '';
            const vars = hh.variables || {};
            const checks = hh.check_results || [];
            const inputText = hh.input || hh.case_name || '';
            const expectedRaw = hh.expected_output || hh.output_requirement || '';

            // Input 行（主 input + variables）
            const inputRows = [];
            inputRows.push({ name: 'input', value: inputText, isMain: true });
            for (const [k, v] of Object.entries(vars)) {
                inputRows.push({ name: k, value: typeof v === 'string' ? v : JSON.stringify(v), isMain: false });
            }

            // Validation 合成：check_results 为空时从主验证字段回退
            let displayChecks = checks;
            if (displayChecks.length === 0 && hh.eval_type) {
                const mainType = hh.eval_type;
                let fallbackExpected;
                if (mainType === 'llm_judge') {
                    fallbackExpected = hh.output_requirement || hh.expected_output || '';
                } else if (mainType === 'contains' || mainType === 'not_contains') {
                    fallbackExpected = (hh.eval_params || {}).substring || '';
                } else if (mainType === 'length') {
                    const ep = hh.eval_params || {};
                    const parts = [];
                    if (ep.min != null) parts.push('min=' + ep.min);
                    if (ep.max != null) parts.push('max=' + ep.max);
                    fallbackExpected = parts.join(', ');
                } else {
                    fallbackExpected = hh.expected_output || '';
                }
                displayChecks = [{
                    field: 'output', eval_type: mainType, expected: fallbackExpected,
                    passed: !!hh.passed, score: hh.passed ? 1.0 : 0.0,
                    judge_raw_response: null, synthesized: true,
                }];
            }
            const hasLlmChecks = displayChecks.some(c => c.eval_type === 'llm_judge');
            const hasJudge = judge && (judge.model || judge.api_type);

            // 三栏对比（超长截断 + 展开）
            const truncate = (s, n) => (s && s.length > n) ? s.slice(0, n) + '…' : (s || '');
            const renderColumn = (header, content, opts = {}) => {
                const max = opts.max || 200;
                const expanded = opts.expanded || false;
                const id = opts.id || ('col_' + header + '_' + Math.random().toString(36).slice(2, 8));
                const text = content || '';
                const tooLong = text.length > max;
                return `
                    <div class="comparison-column">
                        <div class="comparison-header">${header}</div>
                        <div class="comparison-content" id="${id}" style="${expanded ? '' : (tooLong ? 'max-height: 120px; overflow: hidden;' : '')}">
                            <pre style="margin:0; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 11px;">${escapeHtml(text)}</pre>
                        </div>
                        ${tooLong ? `<div style="margin-top: 4px;"><span style="color: var(--blue); cursor: pointer; font-size: 11px; text-decoration: underline;" onclick="var el=document.getElementById('${id}'); el.style.maxHeight = el.style.maxHeight === 'none' ? '120px' : 'none'; this.textContent = el.style.maxHeight === 'none' ? '收起' : '展开全部'">${expanded ? '收起' : '展开全部'}</span></div>` : ''}
                    </div>
                `;
            };

            const inputCol = renderColumn('INPUT', inputRows.map(r => `[${r.isMain ? '主' : r.name}] ${r.value}`).join('\n'), { max: 300 });
            const expectedCol = renderColumn('EXPECTED', expectedRaw || (displayChecks[0] && displayChecks[0].expected) || '-', { max: 300 });
            const actualCol = renderColumn('ACTUAL OUTPUT', actualOutput, { max: 300 });

            // 判定行
            const statusBadge = hh.passed
                ? '<span class="status-badge status-passed"><span class="status-dot"></span>通过</span>'
                : (hh.skipped_reason ? '<span class="status-badge status-disabled"><span class="status-dot"></span>跳过: ' + escapeHtml(hh.skipped_reason) + '</span>' : '<span class="status-badge status-failed"><span class="status-dot"></span>失败</span>');
            const judgeTokenLine = hh.judge_token ? `<span style="margin-left: 16px; color: var(--ink-4);" title="LLM Judge 自身消耗">Judge token: ${hh.judge_token}</span>` : '';

            // Validation 表格（期望/判据：缩略+点击展开完整内容）
            const validationRows = displayChecks.map((c, idx) => {
                const fld = c.field || 'output';
                const typeLabel = c.eval_type || 'exact';
                const expectedFull = c.expected || '—';
                const EXP_TRUNC = 60;
                const expShort = expectedFull.length > EXP_TRUNC ? expectedFull.slice(0, EXP_TRUNC) + '…' : expectedFull;
                const expId = `vexp_${Math.random().toString(36).slice(2, 9)}_${idx}`;
                let resultDisplay;
                if (c.judge_raw_response) {
                    resultDisplay = c.judge_raw_response.length > 80 ? c.judge_raw_response.slice(0, 80) + '…' : c.judge_raw_response;
                } else {
                    resultDisplay = c.passed ? '✓ 通过' : '✗ 失败';
                }
                const synthTag = c.synthesized ? `<span style="color: var(--ink-5); font-size: 10px;">（历史回退）</span>` : '';
                const expCell = expectedFull.length > EXP_TRUNC ? `
                    <span id="${expId}_s">${escapeHtml(expShort)}<span style="color: var(--blue); cursor: pointer; margin-left: 4px; text-decoration: underline;" onclick="document.getElementById('${expId}_s').style.display='none';document.getElementById('${expId}_l').style.display='block';">展开</span></span>
                    <div id="${expId}_l" style="display: none; margin-top: 2px; padding: 4px 6px; background: var(--bg-2); border-radius: 3px; white-space: pre-wrap; line-height: 1.4; max-height: 200px; overflow: auto;">
                        ${escapeHtml(expectedFull)}
                        <div style="margin-top: 4px;"><span style="color: var(--blue); cursor: pointer; text-decoration: underline;" onclick="document.getElementById('${expId}_l').style.display='none';document.getElementById('${expId}_s').style.display='inline';">收起</span></div>
                    </div>` : escapeHtml(expectedFull);
                return `
                    <tr>
                        <td style="padding: 4px 6px; font-family: monospace; font-size: 11px;">${escapeHtml(fld)}${synthTag}</td>
                        <td style="padding: 4px 6px;"><span class="tag tag-${escapeHtml(c.eval_type || 'exact')}">${escapeHtml(typeLabel)}</span></td>
                        <td style="padding: 4px 6px; font-family: monospace; font-size: 11px; max-width: 320px;">${expCell}</td>
                        <td style="padding: 4px 6px; font-family: monospace; font-size: 11px; ${c.passed ? 'color: var(--green);' : 'color: var(--red);'}" title="${escapeHtml(resultDisplay)}">${escapeHtml(resultDisplay)}</td>
                        <td style="padding: 4px 6px; font-size: 11px; text-align: right;">${c.score != null ? Number(c.score).toFixed(2) : '—'}</td>
                    </tr>
                `;
            }).join('');

            // llm_judge 原始响应下钻
            const llmDrillBlocks = displayChecks.filter(c => c.eval_type === 'llm_judge' && c.judge_raw_response).map((c, i) => {
                const rawId = `llmRaw_${hh.run_id || 'x'}_${i}`;
                return `
                    <div style="margin-top: 6px;">
                        <span style="color: var(--blue); cursor: pointer; text-decoration: underline; font-size: 11px;" onclick="var d=document.getElementById('${rawId}'); d.style.display = d.style.display === 'none' ? 'block' : 'none'">▾ Judge 原始响应（${escapeHtml(c.field || 'output')}）</span>
                        <div id="${rawId}" style="display: none; margin-top: 4px; padding: 6px 8px; background: var(--bg-2); border-radius: 4px; font-family: monospace; font-size: 11px; white-space: pre-wrap; max-height: 240px; overflow: auto;">${escapeHtml(c.judge_raw_response)}</div>
                    </div>
                `;
            }).join('');

            // Judge 信息块（提示词摘要：给全，允许缩略→点击展开）
            // judge 来源有两种：来自 project.judge_config（带 prompt_template 全文），或来自 aggregate.judge_summary（带 prompt_summary+prompt_full）
            const judgePromptFull = (judge && (judge.prompt_template != null ? judge.prompt_template : judge.prompt_full)) || '';
            const judgePromptShort = judgePromptFull ? (judgePromptFull.length > 80 ? judgePromptFull.slice(0, 80) + '…' : judgePromptFull) : '';
            const judgeHintId = `jt_${Math.random().toString(36).slice(2, 9)}`;
            const judgeBlock = hasLlmChecks && hasJudge ? `
                <div style="margin-top: 12px; padding: 8px 12px; background: var(--light-bg); border-radius: 6px;">
                    <div style="font-size: 11px; color: var(--ink-3); margin-bottom: 4px; font-weight: 600;">Judge 模型</div>
                    <div style="font-size: 11px; color: var(--ink-2);">
                        模型：<code>${escapeHtml(judge.model || '—')}</code> · API 类型：${escapeHtml(judge.api_type || '—')}
                    </div>
                    ${judgePromptShort ? `
                    <div style="font-size: 10px; color: var(--ink-4); margin-top: 6px;">
                        <span style="color: var(--ink-3);">提示词：</span>
                        <span id="${judgeHintId}_short">${escapeHtml(judgePromptShort)}${judgePromptFull.length > 80 ? `<span style="color: var(--blue); cursor: pointer; margin-left: 4px; text-decoration: underline;" onclick="document.getElementById('${judgeHintId}_short').style.display='none';document.getElementById('${judgeHintId}_full').style.display='block';">展开</span>` : ''}</span>
                        <div id="${judgeHintId}_full" style="display: none; margin-top: 4px; padding: 6px 8px; background: var(--bg-2); border-radius: 4px; font-family: monospace; white-space: pre-wrap; line-height: 1.45; max-height: 260px; overflow: auto;">
                            ${escapeHtml(judgePromptFull)}
                            ${judgePromptFull.length > 80 ? `<div style="margin-top: 6px;"><span style="color: var(--blue); cursor: pointer; text-decoration: underline;" onclick="document.getElementById('${judgeHintId}_full').style.display='none';document.getElementById('${judgeHintId}_short').style.display='inline';">收起</span></div>` : ''}
                        </div>
                    </div>` : ''}
                </div>
            ` : '';

            // 头部判定行（仅保留状态/得分/版本——冗余的延迟/token/judge token 已在 modal 顶部展示）
            const headerLine = `
                <div style="display: flex; gap: 16px; margin-bottom: 12px; font-size: 11px; align-items: center; flex-wrap: wrap;">
                    ${statusBadge}
                    <span style="color: var(--ink-4);">得分: ${hh.score != null ? Number(hh.score).toFixed(2) : '-'}</span>
                    ${hh.version_name ? `<span style="color: var(--ink-4);">${escapeHtml(hh.version_name)}</span>` : ''}
                </div>
            `;

            return `
                ${headerLine}
                <div class="comparison-view">${inputCol}${actualCol}</div>
                <div class="form-group" style="margin-top: 16px;">
                    <label class="form-label">全部 Validation（${displayChecks.length} 项，${displayChecks.filter(c => c.passed).length}/${displayChecks.length} 通过）</label>
                    <table style="font-size: 12px; border-collapse: collapse; width: 100%;">
                        <thead><tr style="text-align: left; color: var(--ink-5); border-bottom: 1px solid var(--border);">
                            <th style="padding: 3px 6px;">字段</th>
                            <th style="padding: 3px 6px;">类型</th>
                            <th style="padding: 3px 6px;">期望 / 判据</th>
                            <th style="padding: 3px 6px;">结果</th>
                            <th style="padding: 3px 6px; text-align: right;">得分</th>
                        </tr></thead>
                        <tbody>${validationRows || `<tr><td colspan="5" style="padding: 6px; color: var(--ink-4); text-align: center;">无验证记录</td></tr>`}</tbody>
                    </table>
                    ${llmDrillBlocks}
                </div>
                ${judgeBlock}
            `;
        }

        function showRunCaseDetail(index) {
            const run = state.currentRun;
            if (!run || !run.results || !run.results[index]) return;
            const result = run.results[index];
            // join 评测集拿 input / expected_output
            const evalsetMap = {};
            if (state.currentRunEvalset) {
                (state.currentRunEvalset.cases || []).forEach(c => { evalsetMap[c.case_name] = c; });
            }
            const cs = evalsetMap[result.case_name] || {};
            // 统一字段：合并 result + cs 供 renderCaseRunDetailBody 使用
            const hh = Object.assign({}, result, {
                input: cs.input || result.case_name,
                expected_output: cs.expected_output || result.expected_output,
                output_requirement: cs.output_requirement || result.output_requirement,
                variables: cs.variables || result.variables || {},
                eval_type: result.eval_type || cs.eval_type,
                eval_params: result.eval_params || cs.eval_params,
                version_name: run.version_name || '',
            });
            const judge = state.currentProject?.judge_config || null;

            document.getElementById('caseDetailContent').innerHTML = renderCaseRunDetailBody(hh, judge);
            document.getElementById('caseModal').classList.remove('hidden');
        }

        function closeCaseDetail() {

        // P-8: pass@k / pass^k 双线图（k=1..3，夹缝阴影=不确定性）
        function renderPassDualLineChart(n, c) {
            const _passAtK = (n, c, k) => {
                if (n < k || n === 0) return null;
                let r = 1;
                for (let i = 0; i < k; i++) r *= (n - c - i) / (n - i);
                return 1 - r;
            };
            const _passPowK = (n, c, k) => {
                if (n < k || n === 0) return null;
                let r = 1;
                for (let i = 0; i < k; i++) r *= (c - i) / (n - i);
                return r;
            };
            const ks = [1, 2, 3];
            const atVals = ks.map(k => _passAtK(n, c, k));
            const powVals = ks.map(k => _passPowK(n, c, k));
            const w = 240, h = 100, pad = 24;
            const stepX = (w - pad * 2) / (ks.length - 1);
            const xOf = i => pad + i * stepX;
            const yOf = v => h - pad - (v != null ? v : 0) * (h - pad * 2);
            const atPts = ks.map((k, i) => `${xOf(i)},${yOf(atVals[i])}`).join(' ');
            const powPts = ks.map((k, i) => `${xOf(i)},${yOf(powVals[i])}`).join(' ');
            // 夹缝阴影
            const shadePath = ks.map((k, i) => `${xOf(i)},${yOf(atVals[i])}`).join(' ') +
                ' ' + ks.slice().reverse().map((k, ri) => { const i = ks.length - 1 - ri; return `${xOf(i)},${yOf(powVals[i])}`; }).join(' ');
            return `
                <svg width="${w}" height="${h + 16}" style="display: block; overflow: visible; max-width: 100%;">
                    <polygon points="${shadePath}" fill="rgba(245,158,11,0.12)" />
                    <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--border)" />
                    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h - pad}" stroke="var(--border)" />
                    <text x="${pad - 4}" y="${pad + 4}" font-size="9" fill="var(--ink-4)" text-anchor="end">100%</text>
                    <text x="${pad - 4}" y="${h - pad}" font-size="9" fill="var(--ink-4)" text-anchor="end">0%</text>
                    <polyline points="${atPts}" fill="none" stroke="var(--accent)" stroke-width="1.5" />
                    <polyline points="${powPts}" fill="none" stroke="var(--amber, #b45309)" stroke-width="1.5" stroke-dasharray="3,2" />
                    ${ks.map((k, i) => `
                        <circle cx="${xOf(i)}" cy="${yOf(atVals[i])}" r="3" fill="var(--accent)" />
                        <circle cx="${xOf(i)}" cy="${yOf(powVals[i])}" r="3" fill="var(--amber, #b45309)" />
                        <text x="${xOf(i)}" y="${h - pad + 12}" font-size="9" fill="var(--ink-4)" text-anchor="middle">k=${k}</text>
                    `).join('')}
                </svg>
                <div style="font-size: 10px; color: var(--ink-4); margin-top: 2px;">
                    <span style="color: var(--accent);">●</span> pass@k（潜力）
                    <span style="color: var(--amber, #b45309); margin-left: 12px;">|--</span> pass^k（稳定）
                </div>
            `;
        }

        // O-4: 统计 tab 内容加载（复用原 case history 渲染逻辑，写入目标容器）
        async function loadCaseStatsInto(targetElId, evalsetId, projectId, caseId) {
            const target = document.getElementById(targetElId);
            if (!target) return;
            target.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--ink-4);">加载中...</div>`;

            let data;
            try {
                data = await api(`/evalsets/${evalsetId}/cases/${caseId}/history?project_id=${projectId}`);
            } catch (err) {
                target.innerHTML = `<div style="color: var(--red); padding: 16px;">加载失败：${escapeHtml(err.message || String(err))}</div>`;
                return;
            }

            const { history = [], aggregate = {} } = data;
            const fmtPct = (v) => (v == null || isNaN(v)) ? '-' : (v * 100).toFixed(0) + '%';
            const fmtNum = (v, d = 2) => (v == null || isNaN(v)) ? '-' : Number(v).toFixed(d);
            const fmtMs = (v) => (v == null || v === 0) ? '-' : (v / 1000).toFixed(2) + 's';
            const fmtToken = (v) => (v == null || v === 0) ? '-' : Number(v).toLocaleString();

            const judge = aggregate.judge_summary || null;

            // 趋势小图：用 SVG 画 pass/fail 时序
            const w = Math.max(120, history.length * 14);
            const h = 36;
            const dots = history.map((hh, i) => {
                const x = 8 + (history.length === 1 ? w / 2 - 8 : i * ((w - 16) / (history.length - 1)));
                const color = hh.skipped_reason ? 'var(--ink-4)' : (hh.passed ? 'var(--green)' : 'var(--red)');
                return `<circle cx="${x}" cy="${h / 2}" r="4" fill="${color}" title="${escapeHtml(hh.run_id)}：${hh.skipped_reason ? '跳过' : (hh.passed ? '通过' : '失败')}"/>`;
            }).join('');

            // W-5: 历史明细表（下钻弹窗看完整详情）
            const rowsHtml = history.length === 0
                ? `<tr><td colspan="7" style="text-align: center; color: var(--ink-4); padding: 16px;">暂无历史 run 记录</td></tr>`
                : history.map((hh, hhIdx) => {
                    const ts = hh.created_at ? new Date(hh.created_at).toLocaleString('zh-CN', { hour12: false }) : '-';
                    const status = hh.skipped_reason
                        ? `<span class="status-badge status-disabled"><span class="status-dot"></span>跳过</span>`
                        : (hh.passed
                            ? `<span class="status-badge status-passed"><span class="status-dot"></span>通过</span>`
                            : `<span class="status-badge status-failed"><span class="status-dot"></span>失败</span>`);
                    const targetTok = hh.token_used || 0;
                    const tokCell = fmtToken(targetTok);
                    const checks = hh.check_results || [];
                    const passCount = checks.filter(c => c.passed).length;
                    // Type 只显示类型标签，不带模型名
                    const typeCell = `<span class="tag tag-${escapeHtml(hh.eval_type)}">${escapeHtml(hh.eval_type)}</span>`;
                    const versionCell = escapeHtml(hh.version_name || '—');
                    // 用 data-* 属性传数据：先 JSON 序列化，再 HTML 转义写入属性
                    const hhJson = escapeHtml(JSON.stringify(hh));
                    const judgeJson = escapeHtml(JSON.stringify(judge));
                    return `
                        <tr>
                            <td>${status}</td>
                            <td style="font-size: 11px; color: var(--ink-4);">${ts}</td>
                            <td style="text-align: right;">${fmtMs(hh.latency_ms)}</td>
                            <td style="text-align: right;" title="运行消耗 token（不含 judge）">${tokCell}</td>
                            <td>${typeCell}</td>
                            <td style="font-size: 11px;">${checks.length > 0 ? `${passCount}/${checks.length} 通过` : '—'}</td>
                            <td style="font-size: 11px;">
                                <button class="btn btn-sm btn-secondary" data-hh="${hhJson}" data-judge="${judgeJson}" onclick="showCaseRunDetailModal(JSON.parse(this.dataset.hh), JSON.parse(this.dataset.judge))">详情</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            target.innerHTML = `
                ${history.length === 0 ? `<div style="text-align: center; padding: 24px; color: var(--ink-4);">该 case 在已完成 run 中暂无记录</div>` : ''}
                ${history.length > 0 && aggregate.n > 0 ? `
                <div style="margin-bottom: 12px;">
                    <div style="font-size: 11px; color: var(--ink-3); margin-bottom: 4px;">pass@k / pass^k（k=1..3，夹缝=不确定性）</div>
                    ${renderPassDualLineChart(aggregate.n, aggregate.c)}
                </div>
                <div style="font-size: 11px; color: var(--ink-4); margin-bottom: 12px; display: flex; gap: 16px; flex-wrap: wrap;">
                    <span>n=${aggregate.n ?? 0}</span>
                    <span>c=${aggregate.c ?? 0}</span>
                    <span>pass rate ${fmtPct(aggregate.pass_rate)}</span>
                    <span>P50 ${fmtMs(aggregate.latency_p50)}</span>
                    <span>P95 ${fmtMs(aggregate.latency_p95)}</span>
                    <span>token ${fmtToken(aggregate.total_token)}</span>
                    <span>${aggregate.token_per_pass ? (aggregate.token_per_pass).toFixed(1) + '/万tok' : '-'}</span>
                </div>
                <div style="margin-bottom: 12px;">
                    <div style="font-size: 11px; color: var(--ink-3); margin-bottom: 2px;">单 case 趋势（最近 ${history.length} 次）</div>
                    <svg width="${w}" height="${h}" style="display: block; overflow: visible;">
                        ${dots}
                    </svg>
                    <div style="font-size: 10px; color: var(--ink-4); margin-top: 2px;">
                        <span style="color: var(--green);">●</span> 通过
                        <span style="color: var(--red); margin-left: 12px;">●</span> 失败
                        <span style="color: var(--ink-4); margin-left: 12px;">●</span> 跳过
                    </div>
                </div>
                ` : ''}
                ${history.length > 0 ? `
                <div style="overflow-x: auto;">
                    <table class="table" style="font-size: 12px;">
                        <thead>
                            <tr>
                                <th>状态</th>
                                <th>时间</th>
                                <th style="text-align: right;">耗时</th>
                                <th style="text-align: right;">token</th>
                                <th>Type</th>
                                <th>验证</th>
                                <th>详情</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
                ` : ''}
            `;
        }

        // O-3/W-5/P-1: Case 历史 run 详情下钻弹窗（复用 renderCaseRunDetailBody，规格与 run 详情「查看」一致）
        function showCaseRunDetailModal(hh, judge) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'caseRunDetailModal';
            modal.innerHTML = `
                <div class="modal" style="max-width: 760px; max-height: 85vh; overflow: auto;">
                    <div class="modal-header">
                        <span class="modal-title">Run 详情 · ${escapeHtml(hh.run_id || '')}</span>
                        <button class="modal-close" onclick="closeModal('caseRunDetailModal')">×</button>
                    </div>
                    <div class="modal-body">
                        <div style="display: flex; gap: 16px; margin-bottom: 8px; font-size: 11px; color: var(--ink-4);">
                            <span>${escapeHtml(hh.created_at ? new Date(hh.created_at).toLocaleString('zh-CN', { hour12: false }) : '')}</span>
                            <span>耗时 ${((hh.latency_ms || 0) / 1000).toFixed(2)}s</span>
                            <span>token ${hh.token_used || 0}${hh.judge_token ? ` · judge ${hh.judge_token}` : ''}</span>
                            ${hh.version_name ? `<span>${escapeHtml(hh.version_name)}</span>` : ''}
                        </div>
                        ${renderCaseRunDetailBody(hh, judge)}
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('caseRunDetailModal')">关闭</button>
                    </div>
                </div>
            `;

        // P-3: 下载评测集导入模版 CSV（表头 + 示例行）
        function downloadEvalsetTemplate() {
            const headers = ['case_name', 'input', 'expected_output', 'output_requirement', 'eval_type', 'eval_params', 'variables', 'tags', 'enabled'];
            // 示例行：覆盖 exact/contains/llm_judge 三种典型场景，全部合法可导入（导入前请删除）
            const exampleRows = [
                ['示例-精确匹配（导入前请删除本行）', '你好', '你好', '', 'exact', '{}', '', '["smoke"]', 'true'],
                ['示例-包含判断（导入前请删除本行）', '介绍产品', '', '回答需提及免费', 'contains', '{"substring":"免费"}', '', '["smoke","regression"]', 'true'],
                ['示例-LLM判定（导入前请删除本行）', '复杂问题', '', '回答需覆盖三点', 'llm_judge', '{}', '{"source":"doc1"}', '["llm"]', 'false'],
            ];
            // CSV 转义：含 , " \n 的字段用双引号包裹，内部 " 用 "" 转义
            const escapeCsv = v => {
                const s = String(v);
                return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
            };
            const csv = [headers, ...exampleRows].map(row => row.map(escapeCsv).join(',')).join('\n');
            // 加 BOM 让 Excel 正确识别 UTF-8
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'simpleeval-evalset-template.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已下载模版 CSV（含 3 行示例，导入前请删除示例行）');
        }

        let importData = { cases: [], errors: [], total: 0 };

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;
            parseFile(file);
        }

        function parseFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const content = e.target.result;
                    if (file.name.endsWith('.json')) {
                        importData = validateImportData(JSON.parse(content));
                    } else if (file.name.endsWith('.csv')) {
                        importData = validateImportData(parseCSVContent(content));
                    } else {
                        throw new Error('不支持的文件格式');
                    }
                    // P2-8: 保留原始内容，确认时传给后端 import 端点
                    importData.rawContent = content;
                    importData.format = file.name.endsWith('.json') ? 'json' : 'csv';
                    showImportPreview();
                } catch (err) {
                    showToast('文件解析失败: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function parseCSVContent(content) {
            const lines = content.replace(/^\ufeff/, '').split('\n').filter(l => l.trim());
            if (lines.length < 2) throw new Error('CSV 文件内容为空或格式错误');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] || '');
                rows.push(obj);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            return values;
        }

        function validateImportData(rawCases) {
            if (!Array.isArray(rawCases)) {
                throw new Error('数据格式错误：需要数组');
            }
            const cases = [];
            const errors = [];
            const validTypes = ['exact', 'contains', 'not_contains', 'length', 'llm_judge'];
            rawCases.forEach((item, index) => {
                const rowNum = index + 1;
                const caseErrors = [];
                if (!item.case_name) caseErrors.push('case_name 必填');
                if (!item.input) caseErrors.push('input 必填');
                if (!item.eval_type) caseErrors.push('eval_type 必填');
                if (item.eval_type && !validTypes.includes(item.eval_type)) {
                    caseErrors.push('eval_type 无效: ' + item.eval_type);
                }
                // B-13: 解析 variables（CSV 列为 JSON 字符串；JSON 文件导入直接是对象）
                let variables = null;
                if (item.variables) {
                    if (typeof item.variables === 'string' && item.variables.trim()) {
                        try { variables = JSON.parse(item.variables); }
                        catch (e) { caseErrors.push('variables 不是合法 JSON'); }
                    } else if (typeof item.variables === 'object') {
                        variables = item.variables;
                    }
                }
                // T1-2: 解析 tags（CSV JSON 字符串数组 / 逗号或分号分隔字符串 / JSON 数组）
                let tags = [];
                if (item.tags !== undefined && item.tags !== null && item.tags !== '') {
                    if (Array.isArray(item.tags)) {
                        tags = item.tags.map(String);
                    } else if (typeof item.tags === 'string') {
                        const s = item.tags.trim();
                        if (s.startsWith('[')) {
                            try { tags = JSON.parse(s).map(String); }
                            catch (e) { caseErrors.push('tags 不是合法 JSON 数组'); }
                        } else {
                            tags = s.split(/[,，;；]/).map(t => t.trim()).filter(Boolean);
                        }
                    }
                }
                if (caseErrors.length > 0) {
                    errors.push({ row: rowNum, errors: caseErrors });
                } else {
                    cases.push({
                        id: item.id || 'import-' + Date.now() + '-' + rowNum,
                        case_name: item.case_name,
                        input: item.input || '',
                        expected_output: item.expected_output || null,
                        output_requirement: item.output_requirement || null,
                        eval_type: item.eval_type || 'exact',
                        eval_params: typeof item.eval_params === 'object' ? item.eval_params : {},
                        variables: variables,
                        tags: tags,
                        enabled: item.enabled !== false
                    });
                }
            });
            return { cases, errors, total: rawCases.length };
        }

        function showImportPreview() {
            const previewDiv = document.getElementById('filePreview');
            const optionsDiv = document.getElementById('importOptions');
            const summaryDiv = document.getElementById('importSummary');
            const confirmBtn = document.getElementById('confirmImportBtn');
            if (!previewDiv) return;

            previewDiv.style.display = 'block';
            if (importData.errors.length > 0) {
                previewDiv.innerHTML =
                    '<div style="background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 6px;">' +
                    '<div style="font-weight: 600; margin-bottom: 8px;">格式错误 (' + importData.errors.length + ' 条)</div>' +
                    importData.errors.slice(0, 5).map(e => '<div style="margin: 4px 0;">行 ' + e.row + ': ' + e.errors.join(', ') + '</div>').join('') +
                    (importData.errors.length > 5 ? '<div style="margin-top: 4px;">...还有 ' + (importData.errors.length - 5) + ' 条错误</div>' : '') +
                    '</div>';
                optionsDiv.style.display = 'none';
                if (confirmBtn) confirmBtn.disabled = true;
            } else {
                previewDiv.innerHTML =
                    '<div style="padding: 12px; background: var(--green-bg); border-radius: 6px;">' +
                    '<span style="color: var(--green);">✓</span> 验证通过，共 ' + importData.cases.length + ' 条用例</div>';
                optionsDiv.style.display = 'block';
                if (confirmBtn) confirmBtn.disabled = false;
            }
            summaryDiv.innerHTML = '总计: ' + importData.total + ' 条，成功: ' + importData.cases.length + '，失败: ' + importData.errors.length;
        }

        // B-12: 逐条表单——按 eval_type 切换字段组
        function toggleManualEvalFields() {
            const t = document.getElementById('manualEvalType')?.value;
            if (!t) return;
            const show = id => { const el = document.getElementById(id); if (el) el.style.display = ''; };
            const hide = id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };
            // exact / llm_judge → 各自的字段；contains / not_contains → substring；length → min/max
            hide('manualExactGroup'); hide('manualContainsGroup'); hide('manualLengthGroup'); hide('manualLlmGroup');
            if (t === 'exact') show('manualExactGroup');
            else if (t === 'contains' || t === 'not_contains') show('manualContainsGroup');
            else if (t === 'length') show('manualLengthGroup');
            else if (t === 'llm_judge') show('manualLlmGroup');
        }

        // B-12: 从表单收集一条 case 加入待导入列表
        function addManualCaseToList() {
            const name = document.getElementById('manualCaseName').value.trim();
            const input = document.getElementById('manualInput').value;
            const evalType = document.getElementById('manualEvalType').value;
            if (!name) { showToast('case_name 必填', 'warning'); return; }
            if (!input.trim()) { showToast('input 必填', 'warning'); return; }
            const caseObj = { case_name: name, input, eval_type: evalType, eval_params: {}, enabled: true };
            if (evalType === 'exact') {
                caseObj.expected_output = document.getElementById('manualExpectedOutput').value;
            } else if (evalType === 'contains' || evalType === 'not_contains') {
                caseObj.eval_params.substring = document.getElementById('manualSubstring').value;
            } else if (evalType === 'length') {
                const min = document.getElementById('manualLenMin').value;
                const max = document.getElementById('manualLenMax').value;
                if (min) caseObj.eval_params.min = parseInt(min, 10);
                if (max) caseObj.eval_params.max = parseInt(max, 10);
            } else if (evalType === 'llm_judge') {
                caseObj.output_requirement = document.getElementById('manualOutputRequirement').value;
            }
            // B-13: 收集 variables kv 行
            const vars = collectKvRows('manualVariablesList');
            if (vars) caseObj.variables = vars;
            // T1-2: 收集 tags
            const tags = parseTagsInput(document.getElementById('manualTags').value);
            if (tags.length > 0) caseObj.tags = tags;
            // 加入待导入列表
            if (!Array.isArray(importData.cases)) importData.cases = [];
            importData.cases.push(caseObj);
            importData.total = importData.cases.length;
            importData.errors = [];
            renderManualCaseList();
            // 清空表单（保留 eval_type 选择）
            document.getElementById('manualCaseName').value = '';
            document.getElementById('manualInput').value = '';
            document.getElementById('manualExpectedOutput').value = '';
            document.getElementById('manualSubstring').value = '';
            document.getElementById('manualLenMin').value = '';
            document.getElementById('manualLenMax').value = '';
            document.getElementById('manualOutputRequirement').value = '';
            document.getElementById('manualTags').value = '';
            renderTagsPreview('', 'manualTagsPreview');
            // 重置变量行（保留一条空行）
            const mvList = document.getElementById('manualVariablesList');
            if (mvList) mvList.innerHTML = kvRowHTML('', '');
            document.getElementById('manualCaseName').focus();
        }

        // B-12: 渲染待导入列表（可删除）
        function renderManualCaseList() {
            const listDiv = document.getElementById('manualCaseList');
            const previewDiv = document.getElementById('manualPreview');
            if (!listDiv) return;
            if (!importData.cases || importData.cases.length === 0) {
                listDiv.innerHTML = '';
                if (previewDiv) previewDiv.innerHTML = '';
                const optsDiv = document.getElementById('importOptions');
                if (optsDiv) optsDiv.style.display = 'none';
                const confirmBtn = document.getElementById('confirmImportBtn');
                if (confirmBtn) confirmBtn.disabled = true;
                return;
            }
            listDiv.innerHTML = '<div style="font-size: 12px; color: var(--ink-4); margin-bottom: 8px;">待导入列表（' + importData.cases.length + ' 条，点击 × 删除）</div>' +
                importData.cases.map((c, i) => {
                    const tagsHtml = (c.tags && c.tags.length)
                        ? ' <span style="margin-left: 6px;">' + c.tags.map(t => '<span class="tag-chip" style="font-size:10px;padding:1px 6px;">' + escapeHtml(t) + '</span>').join('') + '</span>'
                        : '';
                    return '<div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--gray-bg); border-radius: 4px; margin-bottom: 4px;">' +
                        '<span style="flex: 1; font-size: 13px;"><strong>' + escapeHtml(c.case_name) + '</strong> <span style="color: var(--ink-4); font-size: 11px;">[' + c.eval_type + ']</span>' + tagsHtml + '</span>' +
                        '<button class="btn btn-sm btn-danger" onclick="removeManualCase(' + i + ')" title="删除">×</button>' +
                    '</div>';
                }).join('');
            // 显示导入选项 + 启用确认按钮
            const optsDiv = document.getElementById('importOptions');
            if (optsDiv) optsDiv.style.display = 'block';
            const confirmBtn = document.getElementById('confirmImportBtn');
            if (confirmBtn) confirmBtn.disabled = false;
            if (previewDiv) previewDiv.innerHTML = '<div style="color: var(--green);">✓ 待导入 ' + importData.cases.length + ' 条用例</div>';
        }

        function removeManualCase(idx) {
            if (!importData.cases) return;
            importData.cases.splice(idx, 1);
            importData.total = importData.cases.length;
            renderManualCaseList();
        }

        async function confirmImport(evalsetId, projectId) {
            if (importData.cases.length === 0) {
                showToast('没有可导入的数据', 'warning');
                return;
            }
            // B-12: 表单模式无 rawContent → 序列化 cases 成 JSON 作为 rawContent
            if (!importData.rawContent) {
                importData.rawContent = JSON.stringify(importData.cases);
                importData.format = 'json';
            }
            const mode = document.querySelector('input[name="importMode"]:checked').value;
            const progressDiv = document.getElementById('importProgress');
            const confirmBtn = document.getElementById('confirmImportBtn');
            progressDiv.style.display = 'block';
            progressDiv.innerHTML = '<div style="color: var(--ink-3);">导入中...</div>';
            confirmBtn.disabled = true;
            try {
                // P2-8: 走后端 import 端点（merge/replace + 行级错误兜底）
                const formData = new FormData();
                formData.append('file_content', importData.rawContent);
                formData.append('mode', mode);
                const resp = await fetch(`/api/evalsets/${evalsetId}/import?project_id=${projectId}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await resp.json();
                if (!resp.ok) {
                    // 后端行级错误（422 + errors 数组）
                    const errs = result?.detail?.errors || [];
                    if (errs.length > 0) {
                        progressDiv.innerHTML = '<div style="color: var(--red);">后端校验失败 (' + errs.length + ' 条):</div>' +
                            errs.slice(0, 5).map(e => '<div style="font-size: 12px; margin-top: 4px;">行 ' + e.row + ': ' + escapeHtml(e.error) + '</div>').join('');
                    } else {
                        throw new Error(result?.detail?.error || result?.detail || '导入失败');
                    }
                    confirmBtn.disabled = false;
                    return;
                }
                progressDiv.innerHTML = '<div style="color: var(--green);">✓ 导入完成（' + result.imported + ' 条，模式: ' + result.mode + '）</div>';
                showToast('成功导入 ' + result.imported + ' 条用例', 'success');
                // 重置导入状态，避免下次打开残留
                importData = { cases: [], errors: [], total: 0 };
                switchTab('evalsets');
                setTimeout(() => closeModal('importModal'), 800);
            } catch (err) {
                progressDiv.innerHTML = '<div style="color: var(--red);">导入失败: ' + escapeHtml(err.message) + '</div>';
                confirmBtn.disabled = false;
            }
        }

        // 拖拽：用事件委托，因为模态框是动态创建的
        document.addEventListener('dragover', e => {
            const dz = document.getElementById('dropZone');
            if (dz && dz.contains(e.target)) { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; }
        });
        document.addEventListener('dragleave', e => {
            const dz = document.getElementById('dropZone');
            if (dz) dz.style.borderColor = '';
        });
        document.addEventListener('drop', e => {
            const dz = document.getElementById('dropZone');
            if (dz && dz.contains(e.target)) {
                e.preventDefault();
                dz.style.borderColor = '';
                const file = e.dataTransfer.files[0];
                if (file) parseFile(file);
            }
        });

                // B-6: custom 模式不要求 model
                const tc = proj?.target_config;
                const isTargetReady = tc?.base_url && (tc.api_type === 'custom' ? true : !!tc.model);

                if (evalsets.length === 0) {
                    body.innerHTML = `
                        <div class="empty-state" style="padding: 24px 0;">
                            <div class="empty-state-icon">📋</div>
                            <div class="empty-state-text">评测集为空，请先导入用例</div>
                            <button class="btn btn-secondary" onclick="closeModal('runModal'); switchTab('evalsets')">前往评测集</button>
                        </div>
                    `;
                    return;
                }

                const hasLlmCases = evalsets.some(e => e.cases.some(c => c.enabled && c.eval_type === 'llm_judge'));
                const warnJudge = hasLlmCases && !isJudgeReady;
                const warnTarget = !isTargetReady;

                // T1-2: 收集全部 tag（去重，保留顺序），供筛选 chips 渲染
                const allTags = [];
                evalsets.forEach(es => (es.cases || []).forEach(c => (c.tags || []).forEach(t => { if (!allTags.includes(t)) allTags.push(t); })));

                // T1-6: dirty 检测——若配置页有未保存改动，发起评测弹窗提示
                const dirtyNow = state._configDirty;

                // T3-1: 取项目最大并发作为 concurrency 默认与上限
                const maxConc = parseInt(proj?.max_concurrency ?? 1, 10) || 1;

                body.innerHTML = `
                    ${dirtyNow ? `
                        <div class="dirty-bar">
                            <span>⚠ 配置页有未保存的更改，评测将使用已保存的旧配置</span>
                            <a onclick="closeModal('runModal'); switchTab('config')">去保存</a>
                        </div>
                    ` : ''}
                    <div class="form-group">
                        <label class="form-label">选择评测集</label>
                        <select class="form-input" id="runEvalsetSelect" onchange="updateRunEvalsetInfo()">
                            ${evalsets.map(e => {
                                const enabledN = (e.cases || []).filter(c => c.enabled).length;
                                return `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)}（启用 ${enabledN} / 共 ${(e.cases || []).length}）</option>`;
                            }).join('')}
                        </select>
                    </div>
                    <div id="runEvalsetInfo" style="margin-top: 12px;"></div>
                    ${allTags.length > 0 ? `
                        <div class="tag-filter-bar">
                            <div style="font-size: 12px; color: var(--ink-3); margin-bottom: 6px;">按标签筛选（不选 = 全部参与）</div>
                            <div id="runTagChips" style="display: flex; flex-wrap: wrap; gap: 6px;">
                                ${allTags.map(t => `<span class="tag-chip tag-chip-toggle off" data-tag="${escapeHtml(t)}" onclick="toggleRunTagChip(this)">${escapeHtml(t)}<span class="tag-chip-x">✓</span></span>`).join('')}
                            </div>
                            <div class="tag-filter-mode">
                                组合：
                                <label><input type="radio" name="runTagMode" value="any" checked> 含任一</label>
                                <label><input type="radio" name="runTagMode" value="all"> 含全部</label>
                            </div>
                        </div>
                    ` : ''}
                    <div class="form-group" style="display: flex; gap: 12px; margin-top: 12px;">
                        <div style="flex: 1;">
                            <label class="form-label">采样次数 k（每 case 跑几次）</label>
                            <input type="number" class="form-input mono" id="runSamples" min="1" max="20" value="1" onchange="updateRunEvalsetInfo()">
                            <div style="font-size: 11px; color: var(--ink-4); margin-top: 4px;">k=1 = 单次执行（默认）</div>
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">并发数（≤ 项目最大 ${escapeHtml(String(maxConc))}）</label>
                            <input type="number" class="form-input mono" id="runConcurrency" min="1" max="${escapeHtml(String(maxConc))}" value="${escapeHtml(String(maxConc))}" ${maxConc <= 1 ? 'disabled' : ''} onchange="updateRunEvalsetInfo()">
                            <div style="font-size: 11px; color: var(--ink-4); margin-top: 4px;">${maxConc <= 1 ? '项目最大并发=1，串行执行' : '留空 = 串行；填值 = 并发（含延迟噪声）'}</div>
                        </div>
                    </div>
                    ${(warnTarget || warnJudge) ? `
                        <div style="margin-top: 12px; padding: 10px 12px; background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: var(--radius-md); color: var(--amber); font-size: 12px;">
                            ${warnTarget ? '<div>⚠ Target API 未配置完整，发起后所有 case 将失败</div>' : ''}
                            ${warnJudge ? '<div>⚠ 检测到 llm_judge 类型 case 但 Judge API 未配置，将自动跳过</div>' : ''}
                        </div>
                    ` : ''}
                `;
                updateRunEvalsetInfo();
                const confirmBtn = document.getElementById('confirmRunBtn');
                if (confirmBtn) confirmBtn.disabled = false;
            } catch (err) {
                body.innerHTML = `<div style="color: var(--red);">加载失败: ${escapeHtml(err.message)}</div>`;
            }
        }

        function updateRunEvalsetInfo() {
            const select = document.getElementById('runEvalsetSelect');
            const info = document.getElementById('runEvalsetInfo');
            if (!select || !info || !state.currentEvalsets) return;
            const evalset = state.currentEvalsets.find(e => e.id === select.value);
            if (!evalset) return;
            // T1-2: 若有筛选 tag，按 tag 过滤后展示
            const selectedTags = Array.from(document.querySelectorAll('#runTagChips .tag-chip-toggle:not(.off)'))
                .map(el => el.dataset.tag);
            const tagMode = document.querySelector('input[name="runTagMode"]:checked')?.value || 'any';
            let enabledCases = (evalset.cases || []).filter(c => c.enabled);
            if (selectedTags.length > 0) {
                enabledCases = enabledCases.filter(c => {
                    const ct = c.tags || [];
                    return tagMode === 'all'
                        ? selectedTags.every(t => ct.includes(t))
                        : selectedTags.some(t => ct.includes(t));
                });
            }
            // T3-1: 采样次数 k 与并发数（用于"将运行 N×k 次调用"提示）
            const samples = Math.max(1, parseInt(document.getElementById('runSamples')?.value || '1', 10) || 1);
            const byType = {};
            enabledCases.forEach(c => { byType[c.eval_type] = (byType[c.eval_type] || 0) + 1; });
            const typeBreakdown = Object.entries(byType).map(([t, n]) => `<span class="tag tag-${t}" style="margin-right: 4px;">${escapeHtml(t)} ×${n}</span>`).join('');
            const totalCalls = enabledCases.length * samples;
            info.innerHTML = `
                <div style="color: var(--ink-3); font-size: 12px;">将运行 <b style="color: var(--ink-1);">${enabledCases.length}</b> 条${selectedTags.length > 0 ? '（按标签筛选后）' : '启用'}用例${samples > 1 ? ` × 采样 <b>${samples}</b> 次 = <b style="color: var(--ink-1);">${totalCalls}</b> 次调用` : ''}</div>
                <div style="margin-top: 6px;">${typeBreakdown || '<span style="color: var(--red);">无启用用例</span>'}</div>
            `;
            const confirmBtn = document.getElementById('confirmRunBtn');
            if (confirmBtn) confirmBtn.disabled = enabledCases.length === 0;
        }

        // T1-2: tag chip 选中/取消切换
        function toggleRunTagChip(el) {
