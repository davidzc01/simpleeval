        function switchImportTab(tab) {
            const modal = document.getElementById('importModal');
            if (!modal) return;
            modal.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
            modal.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('importFileTab').style.display = tab === 'file' ? 'block' : 'none';
            document.getElementById('importManualTab').style.display = tab === 'manual' ? 'block' : 'none';
        }

        let importData = { cases: [], errors: [], total: 0 };

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;
            parseFile(file);
        }

        function parseFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const content = e.target.result;
                    if (file.name.endsWith('.json')) {
                        importData = validateImportData(JSON.parse(content));
                    } else if (file.name.endsWith('.csv')) {
                        importData = validateImportData(parseCSVContent(content));
                    } else {
                        throw new Error('不支持的文件格式');
                    }
                    // P2-8: 保留原始内容，确认时传给后端 import 端点
                    importData.rawContent = content;
                    importData.format = file.name.endsWith('.json') ? 'json' : 'csv';
                    showImportPreview();
                } catch (err) {
                    showToast('文件解析失败: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function parseCSVContent(content) {
            const lines = content.replace(/^\ufeff/, '').split('\n').filter(l => l.trim());
            if (lines.length < 2) throw new Error('CSV 文件内容为空或格式错误');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] || '');
                rows.push(obj);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            return values;
        }

        function validateImportData(rawCases) {
            if (!Array.isArray(rawCases)) {
                throw new Error('数据格式错误：需要数组');
            }
            const cases = [];
            const errors = [];
            const validTypes = ['exact', 'contains', 'not_contains', 'length', 'llm_judge'];
            rawCases.forEach((item, index) => {
                const rowNum = index + 1;
                const caseErrors = [];
                if (!item.case_name) caseErrors.push('case_name 必填');
                if (!item.input) caseErrors.push('input 必填');
                if (!item.eval_type) caseErrors.push('eval_type 必填');
                if (item.eval_type && !validTypes.includes(item.eval_type)) {
                    caseErrors.push('eval_type 无效: ' + item.eval_type);
                }
                if (caseErrors.length > 0) {
                    errors.push({ row: rowNum, errors: caseErrors });
                } else {
                    cases.push({
                        id: item.id || 'import-' + Date.now() + '-' + rowNum,
                        case_name: item.case_name,
                        input: item.input || '',
                        expected_output: item.expected_output || null,
                        output_requirement: item.output_requirement || null,
                        eval_type: item.eval_type || 'exact',
                        eval_params: typeof item.eval_params === 'object' ? item.eval_params : {},
                        enabled: item.enabled !== false
                    });
                }
            });
            return { cases, errors, total: rawCases.length };
        }

        function showImportPreview() {
            const previewDiv = document.getElementById('filePreview');
            const optionsDiv = document.getElementById('importOptions');
            const summaryDiv = document.getElementById('importSummary');
            const confirmBtn = document.getElementById('confirmImportBtn');
            if (!previewDiv) return;

            previewDiv.style.display = 'block';
            if (importData.errors.length > 0) {
                previewDiv.innerHTML =
                    '<div style="background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 6px;">' +
                    '<div style="font-weight: 600; margin-bottom: 8px;">格式错误 (' + importData.errors.length + ' 条)</div>' +
                    importData.errors.slice(0, 5).map(e => '<div style="margin: 4px 0;">行 ' + e.row + ': ' + e.errors.join(', ') + '</div>').join('') +
                    (importData.errors.length > 5 ? '<div style="margin-top: 4px;">...还有 ' + (importData.errors.length - 5) + ' 条错误</div>' : '') +
                    '</div>';
                optionsDiv.style.display = 'none';
                if (confirmBtn) confirmBtn.disabled = true;
            } else {
                previewDiv.innerHTML =
                    '<div style="padding: 12px; background: var(--green-bg); border-radius: 6px;">' +
                    '<span style="color: var(--green);">✓</span> 验证通过，共 ' + importData.cases.length + ' 条用例</div>';
                optionsDiv.style.display = 'block';
                if (confirmBtn) confirmBtn.disabled = false;
            }
            summaryDiv.innerHTML = '总计: ' + importData.total + ' 条，成功: ' + importData.cases.length + '，失败: ' + importData.errors.length;
        }

        function validateManualInput() {
            const input = document.getElementById('manualImportData').value;
            const previewDiv = document.getElementById('manualPreview');
            if (!input.trim()) {
                showToast('请输入数据', 'warning');
                return;
            }
            try {
                const data = JSON.parse(input);
                importData = validateImportData(data);
                // P2-8: 保留原始内容（手动输入总是 JSON 数组）
                importData.rawContent = input;
                importData.format = 'json';
                showImportPreview();
                previewDiv.innerHTML = importData.errors.length > 0
                    ? '<div style="color: var(--red);">验证失败: ' + importData.errors.length + ' 条错误</div>'
                    : '<div style="color: var(--green);">✓ 验证通过: ' + importData.cases.length + ' 条用例</div>';
                if (importData.errors.length > 0) {
                    previewDiv.innerHTML += importData.errors.slice(0, 3).map(e =>
                        '<div style="font-size: 12px; color: var(--ink-3); margin-top: 4px;">行' + e.row + ': ' + e.errors.join(', ') + '</div>'
                    ).join('');
                }
            } catch (err) {
                previewDiv.innerHTML = '<div style="color: var(--red);">JSON 解析失败: ' + err.message + '</div>';
            }
        }

        async function confirmImport(evalsetId, projectId) {
            if (importData.cases.length === 0) {
                showToast('没有可导入的数据', 'warning');
                return;
            }
            if (!importData.rawContent) {
                showToast('请先选择文件或输入数据', 'warning');
                return;
            }
            const mode = document.querySelector('input[name="importMode"]:checked').value;
            const progressDiv = document.getElementById('importProgress');
            const confirmBtn = document.getElementById('confirmImportBtn');
            progressDiv.style.display = 'block';
            progressDiv.innerHTML = '<div style="color: var(--ink-3);">导入中...</div>';
            confirmBtn.disabled = true;
            try {
                // P2-8: 走后端 import 端点（merge/replace + 行级错误兜底）
                const formData = new FormData();
                formData.append('file_content', importData.rawContent);
                formData.append('mode', mode);
                const resp = await fetch(`/api/evalsets/${evalsetId}/import?project_id=${projectId}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await resp.json();
                if (!resp.ok) {
                    // 后端行级错误（422 + errors 数组）
                    const errs = result?.detail?.errors || [];
                    if (errs.length > 0) {
                        progressDiv.innerHTML = '<div style="color: var(--red);">后端校验失败 (' + errs.length + ' 条):</div>' +
                            errs.slice(0, 5).map(e => '<div style="font-size: 12px; margin-top: 4px;">行 ' + e.row + ': ' + escapeHtml(e.error) + '</div>').join('');
                    } else {
                        throw new Error(result?.detail?.error || result?.detail || '导入失败');
                    }
                    confirmBtn.disabled = false;
                    return;
                }
                progressDiv.innerHTML = '<div style="color: var(--green);">✓ 导入完成（' + result.imported + ' 条，模式: ' + result.mode + '）</div>';
                showToast('成功导入 ' + result.imported + ' 条用例', 'success');
                switchTab('evalsets');
                setTimeout(() => closeModal('importModal'), 800);
            } catch (err) {
                progressDiv.innerHTML = '<div style="color: var(--red);">导入失败: ' + escapeHtml(err.message) + '</div>';
                confirmBtn.disabled = false;
            }
        }

        // 拖拽：用事件委托，因为模态框是动态创建的
        document.addEventListener('dragover', e => {
            const dz = document.getElementById('dropZone');
            if (dz && dz.contains(e.target)) { e.preventDefault(); dz.style.borderColor = 'var(--accent)'; }
        });
        document.addEventListener('dragleave', e => {
            const dz = document.getElementById('dropZone');
            if (dz) dz.style.borderColor = '';
        });
        document.addEventListener('drop', e => {
            const dz = document.getElementById('dropZone');
            if (dz && dz.contains(e.target)) {
                e.preventDefault();
                dz.style.borderColor = '';
                const file = e.dataTransfer.files[0];
                if (file) parseFile(file);
            }
        });

        async function runProjectEval(projectId) {
            // 列表页快捷运行：跳到详情页并打开发起评测弹窗
            // 详情页 renderProjectDetailPage 会设置 state.currentProject，showRunModal 依赖它
            navigateTo('project-detail', { id: projectId, openRunModal: true });
        }

        async function showRunModal(projectId) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'runModal';
            modal.innerHTML = `
                <div class="modal">
                    <div class="modal-header">
                        <span class="modal-title">发起评测</span>
                        <button class="modal-close" onclick="closeModal('runModal')">×</button>
                    </div>
                    <div class="modal-body">
                        <div id="runModalBody"><div style="color: var(--ink-4);">加载中...</div></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('runModal')">取消</button>
                        <button class="btn btn-primary" id="confirmRunBtn" onclick="confirmRunEval('${projectId}')" disabled>发起评测</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const body = document.getElementById('runModalBody');
            try {
                const data = await api(`/projects/${projectId}/evalsets`);
                const evalsets = data.evalsets || [];
                state.currentEvalsets = evalsets;
                const proj = state.currentProject;
                const isJudgeReady = !!(proj?.judge_config?.base_url && proj?.judge_config?.model);
                // B-6: custom 模式不要求 model
                const tc = proj?.target_config;
                const isTargetReady = tc?.base_url && (tc.api_type === 'custom' ? true : !!tc.model);

                if (evalsets.length === 0) {
                    body.innerHTML = `
                        <div class="empty-state" style="padding: 24px 0;">
                            <div class="empty-state-icon">📋</div>
                            <div class="empty-state-text">还没有评测集，请先创建并导入用例</div>
                            <button class="btn btn-secondary" onclick="closeModal('runModal'); switchTab('evalsets')">前往评测集</button>
                        </div>
                    `;
                    return;
                }

                const hasLlmCases = evalsets.some(e => e.cases.some(c => c.enabled && c.eval_type === 'llm_judge'));
                const warnJudge = hasLlmCases && !isJudgeReady;
                const warnTarget = !isTargetReady;

                body.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">选择评测集</label>
                        <select class="form-input" id="runEvalsetSelect" onchange="updateRunEvalsetInfo()">
                            ${evalsets.map(e => {
                                const enabledN = (e.cases || []).filter(c => c.enabled).length;
                                return `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)}（启用 ${enabledN} / 共 ${(e.cases || []).length}）</option>`;
                            }).join('')}
                        </select>
                    </div>
                    <div id="runEvalsetInfo" style="margin-top: 12px;"></div>
                    ${(warnTarget || warnJudge) ? `
                        <div style="margin-top: 12px; padding: 10px 12px; background: var(--amber-bg); border: 1px solid var(--amber-bd); border-radius: var(--radius-md); color: var(--amber); font-size: 12px;">
                            ${warnTarget ? '<div>⚠ Target API 未配置完整，发起后所有 case 将失败</div>' : ''}
                            ${warnJudge ? '<div>⚠ 检测到 llm_judge 类型 case 但 Judge API 未配置，将自动跳过</div>' : ''}
                        </div>
                    ` : ''}
                `;
                updateRunEvalsetInfo();
                const confirmBtn = document.getElementById('confirmRunBtn');
                if (confirmBtn) confirmBtn.disabled = false;
            } catch (err) {
                body.innerHTML = `<div style="color: var(--red);">加载失败: ${escapeHtml(err.message)}</div>`;
            }
        }

        function updateRunEvalsetInfo() {
            const select = document.getElementById('runEvalsetSelect');
            const info = document.getElementById('runEvalsetInfo');
            if (!select || !info || !state.currentEvalsets) return;
            const evalset = state.currentEvalsets.find(e => e.id === select.value);
            if (!evalset) return;
            const enabledCases = (evalset.cases || []).filter(c => c.enabled);
            const byType = {};
            enabledCases.forEach(c => { byType[c.eval_type] = (byType[c.eval_type] || 0) + 1; });
            const typeBreakdown = Object.entries(byType).map(([t, n]) => `<span class="tag tag-${t}" style="margin-right: 4px;">${escapeHtml(t)} ×${n}</span>`).join('');
            info.innerHTML = `
                <div style="color: var(--ink-3); font-size: 12px;">将运行 <b style="color: var(--ink-1);">${enabledCases.length}</b> 条启用用例</div>
                <div style="margin-top: 6px;">${typeBreakdown || '<span style="color: var(--red);">无启用用例</span>'}</div>
            `;
            const confirmBtn = document.getElementById('confirmRunBtn');
            if (confirmBtn) confirmBtn.disabled = enabledCases.length === 0;
        }

        async function confirmRunEval(projectId) {
            const select = document.getElementById('runEvalsetSelect');
            if (!select) return;
            const evalsetId = select.value;
            const confirmBtn = document.getElementById('confirmRunBtn');
            if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = '发起中...'; }
            try {
                const run = await api('/runs', {
                    method: 'POST',
                    body: JSON.stringify({ project_id: projectId, evalset_id: evalsetId })
                });
                closeModal('runModal');
                showToast('评测已开始');
                navigateTo('run-detail', { id: run.run_id, projectId });
            } catch (err) {
                if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.textContent = '发起评测'; }
            }
        }

        async function testTargetConfig(projectId) {
            const resultDiv = document.getElementById('targetTestResult');
            resultDiv.innerHTML = '<span class="text-muted">测试中...</span>';

            try {
                const res = await api(`/test/target?project_id=${encodeURIComponent(projectId)}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        base_url: document.getElementById('targetBaseUrl').value,
                        api_key: readSecret('targetApiKey') || '__UNCHANGED__',
                        model: document.getElementById('targetModel').value,
                        request_template: document.getElementById('targetTemplate').value,
                        auth: collectAuth(),
                        response_mapping: [],
                        response_parsing: collectResponseParsing()
                    })
                });

                if (res.ok) {
                    resultDiv.innerHTML = `<span style="color: var(--green);">✓ ${res.latency_ms}ms · ${res.token_used} tokens</span>`;
                } else {
                    resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(res.error?.message || '失败')}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(err.message)}</span>`;
            }
        }

        async function testParsingConfig() {
            const resultDiv = document.getElementById('parsingTestResult');
            const sample = document.getElementById('parsingSample').value.trim();
            if (!sample) {
                resultDiv.innerHTML = '<span style="color: var(--red);">请填入样例响应</span>';
                return;
            }
            resultDiv.innerHTML = '<span class="text-muted">测试中...</span>';
            try {
                const res = await api('/test/parsing', {
                    method: 'POST',
                    body: JSON.stringify({
                        response_parsing: collectResponseParsing(),
                        sample_response: sample
                    })
                });
                if (res.ok) {
                    resultDiv.innerHTML = `
                        <div style="background: var(--green-bg); border: 1px solid var(--green-bd); padding: 10px 12px; border-radius: var(--radius-md);">
                            <div style="color: var(--green); margin-bottom: 6px;">✓ output_found=${res.output_found} · token=${res.token_used}${res.token_missing ? ' (缺失)' : ''}</div>
                            <div class="code-block" style="margin-top: 6px;">${escapeHtml(res.output)}</div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(res.error?.message || '失败')}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(err.message)}</span>`;
            }
        }

        async function testJudgeConfig(projectId) {
            const resultDiv = document.getElementById('judgeTestResult');
            resultDiv.innerHTML = '<span class="text-muted">测试中...</span>';

            try {
                const res = await api(`/test/judge?project_id=${encodeURIComponent(projectId)}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        base_url: document.getElementById('judgeBaseUrl').value,
                        api_key: readSecret('judgeApiKey') || '__UNCHANGED__',
                        model: document.getElementById('judgeModel').value,
                        prompt_template: document.getElementById('judgePrompt').value,
                        input: '测试输入',
                        output_requirement: '测试要求',
                        actual_output: '测试输出'
                    })
                });

                if (res.ok) {
                    resultDiv.innerHTML = `<span style="color: var(--green);">✓ 得分: ${res.score} · ${res.passed ? '通过' : '不通过'}</span>`;
                } else {
                    resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(res.error?.message || '失败')}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(err.message)}</span>`;
            }
        }

        async function saveProjectConfig(projectId) {
            const config = {
                id: projectId,
                name: state.currentProject.name,
                task_shape: state.currentProject.task_shape,
                judge_config: {
                    base_url: document.getElementById('judgeBaseUrl').value,
                    api_key: readSecret('judgeApiKey') || '__UNCHANGED__',
                    model: document.getElementById('judgeModel').value,
                    prompt_template: document.getElementById('judgePrompt').value
                },
                target_config: {
                    api_type: document.getElementById('targetApiType').value,
                    base_url: document.getElementById('targetBaseUrl').value,
                    api_key: readSecret('targetApiKey') || '__UNCHANGED__',
                    model: document.getElementById('targetModel').value || null,
                    request_template: document.getElementById('targetTemplate').value,
                    auth: collectAuth(),
                    response_mapping: [],
                    response_parsing: collectResponseParsing()
                },
                token_budget: collectTokenBudget()
            };

            try {
                const updated = await api(`/projects/${projectId}`, {
                    method: 'PUT',
                    body: JSON.stringify(config)
                });
                // 更新本地缓存，让后续操作看到最新掩码状态
                state.currentProject = updated;
                showToast('保存成功');
                // 重新渲染配置页，把掩码状态刷新（用户改过的字段恢复为 masked 占位）
                switchTab('config');
            } catch (err) {}
        }

        async function toggleCaseEnabled(evalsetId, projectId, caseId, enabled) {
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = evalset.cases || [];
                const caseIndex = cases.findIndex(c => c.id === caseId);
                if (caseIndex >= 0) {
                    cases[caseIndex].enabled = enabled;
                    await api(`/evalsets/${evalsetId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ ...evalset, cases })
                    });
                    showToast(enabled ? '已启用' : '已禁用');
                    switchTab('evalsets');
                }
            } catch (err) {}
        }

        async function exportEvalSet(evalsetId, projectId) {
            try {
                const data = await api(`/evalsets/${evalsetId}/export?project_id=${projectId}`);
                downloadCSV(data.content, data.filename);
            } catch (err) {}
        }

        async function exportRun(runId, projectId) {
            try {
                const data = await api(`/runs/${runId}/export?project_id=${projectId}`);
                downloadCSV(data.content, data.filename);
            } catch (err) {}
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function closeModal(id) {
            document.getElementById(id)?.remove();
        }

        // ==================== 工具函数 ====================
        function formatRelativeTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString.replace('Z', '+00:00'));
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return Math.floor(diff / 86400) + ' 天前';
        }

        function formatNumber(num) {
            if (!num && num !== 0) return '-';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 优先从 hash 恢复，没有 hash 默认回列表
            const parsed = parseHash(location.hash);
            if (parsed) {
                runNavigation(parsed.page, parsed.params || {});
            } else {
                navigateTo('projects');
            }
            // 启动运行中任务胶囊轮询
            loadRunningTasks();
            setInterval(loadRunningTasks, 5000);
        });

        // 暴露给 window，方便 onclick 内联调用
        window.navigateTo = navigateTo;
        window.runNavigation = runNavigation;
    </script>
