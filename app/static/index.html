        // T1-2: 逗号分隔 → chips 预览
        function renderTagsPreview(str, targetId) {
            const el = document.getElementById(targetId);
            if (!el) return;
            const tags = (str || '').split(/[,，]/).map(s => s.trim()).filter(Boolean);
            el.innerHTML = tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('') || '<span style="font-size: 11px; color: var(--ink-4);">无</span>';
        }
        function parseTagsInput(str) {
            return (str || '').split(/[,，]/).map(s => s.trim()).filter(Boolean);
        }

        // T1-5: checks 列表编辑器
        const CHECK_EVAL_TYPES = [
            { value: 'exact', label: 'exact（精确匹配）' },
            { value: 'contains', label: 'contains（包含子串）' },
            { value: 'not_contains', label: 'not_contains（不包含子串）' },
            { value: 'length', label: 'length（长度范围）' },
            { value: 'llm_judge', label: 'llm_judge（LLM 评判）' }
        ];
        function checkRowHTML(chk) {
            chk = chk || { name: '', field: '', eval_type: 'exact', expected: '', eval_params: {} };
            const epSubstr = chk.eval_params?.substring || '';
            const epMin = chk.eval_params?.min ?? '';
            const epMax = chk.eval_params?.max ?? '';
            const expectedVisible = chk.eval_type === 'exact' || chk.eval_type === 'llm_judge';
            const containsVisible = chk.eval_type === 'contains' || chk.eval_type === 'not_contains';
            const lengthVisible = chk.eval_type === 'length';
            return `
                <div class="check-row" data-eval-type="${escapeHtml(chk.eval_type)}">
                    <input type="text" class="form-input chk-name" value="${escapeHtml(chk.name || '')}" placeholder="check 名称">
                    <input type="text" class="form-input chk-field" value="${escapeHtml(chk.field || '')}" placeholder="字段（如 result / a.b.c）">
                    <select class="form-input chk-type" onchange="updateCheckRowVisibility(this)">
                        ${CHECK_EVAL_TYPES.map(t => `<option value="${t.value}" ${chk.eval_type === t.value ? 'selected' : ''}>${escapeHtml(t.label)}</option>`).join('')}
                    </select>
                    <div class="chk-params">
                        <input type="text" class="form-input chk-expected" value="${escapeHtml(chk.expected || '')}" placeholder="expected（${chk.eval_type === 'llm_judge' ? '评判要求' : '期望值'}）"
                               style="${expectedVisible ? '' : 'display:none;'}">
                        <input type="text" class="form-input chk-substr" value="${escapeHtml(epSubstr)}" placeholder="substring 子串"
                               style="${containsVisible ? '' : 'display:none;'}">
                        <div class="chk-length" style="display: ${lengthVisible ? 'flex' : 'none'}; gap: 4px;">
                            <input type="number" class="form-input chk-len-min" value="${epMin}" placeholder="min" style="width: 50%;">
                            <input type="number" class="form-input chk-len-max" value="${epMax}" placeholder="max" style="width: 50%;">
                        </div>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="this.closest('.check-row').remove()" title="删除">×</button>
                </div>
            `;
        }
        function initCheckRows(checks) {
            const list = document.getElementById('ceChecksList');
            if (!list) return;
            list.innerHTML = '';
            if (!checks || checks.length === 0) {
                list.innerHTML = '<div style="font-size:11px;color:var(--ink-4);">无 check，case 通过只看主 eval_type</div>';
            } else {
                checks.forEach(c => list.insertAdjacentHTML('beforeend', checkRowHTML(c)));
            }
        }
        function addCheckRow() {
            const list = document.getElementById('ceChecksList');
            if (!list) return;
            // 移除"无 check"占位
            const placeholder = list.querySelector('div[style*="无 check"]');
            if (placeholder) placeholder.remove();
            list.insertAdjacentHTML('beforeend', checkRowHTML(null));
        }
        function updateCheckRowVisibility(sel) {
            const row = sel.closest('.check-row');
            if (!row) return;
            const t = sel.value;
            row.dataset.evalType = t;
            const expected = row.querySelector('.chk-expected');
            const substr = row.querySelector('.chk-substr');
            const lenWrap = row.querySelector('.chk-length');
            if (expected) expected.style.display = (t === 'exact' || t === 'llm_judge') ? '' : 'none';
            if (substr) substr.style.display = (t === 'contains' || t === 'not_contains') ? '' : 'none';
            if (lenWrap) lenWrap.style.display = (t === 'length') ? 'flex' : 'none';
        }
        function collectChecks() {
            const list = document.getElementById('ceChecksList');
            if (!list) return null;
            const rows = list.querySelectorAll('.check-row');
            if (rows.length === 0) return null;
            const checks = [];
            rows.forEach(r => {
                const name = r.querySelector('.chk-name')?.value.trim();
                if (!name) return; // 跳过无 name 的行
                const type = r.querySelector('.chk-type')?.value;
                const field = r.querySelector('.chk-field')?.value.trim() || '';
                const expected = r.querySelector('.chk-expected')?.value || null;
                const evalParams = {};
                if (type === 'contains' || type === 'not_contains') {
                    const s = r.querySelector('.chk-substr')?.value;
                    if (s !== null) evalParams.substring = s;
                } else if (type === 'length') {
                    const mn = r.querySelector('.chk-len-min')?.value;
                    const mx = r.querySelector('.chk-len-max')?.value;
                    if (mn !== '') evalParams.min = parseInt(mn, 10);
                    if (mx !== '') evalParams.max = parseInt(mx, 10);
                }
                checks.push({ name, field, eval_type: type, expected, eval_params: evalParams });
            });
            return checks.length ? checks : null;
        }

        // B-13: 变量 kv 行编辑器（case 编辑器 + 导入表单共用）
        function kvRowHTML(k, v) {
            return `
                <div class="kv-row">
                    <input type="text" class="form-input mono kv-key" value="${escapeHtml(k || '')}" placeholder="键名">
                    <input type="text" class="form-input mono kv-val" value="${escapeHtml(v ?? '')}" placeholder="值">
                    <button class="btn btn-sm btn-danger kv-del" onclick="removeKvRow(this)" title="删除">×</button>
                </div>
            `;
        }

        function initCaseVarRows(variables) {
            const list = document.getElementById('ceVariablesList');
            if (!list) return;
            list.innerHTML = '';
            const vars = variables && typeof variables === 'object' ? variables : {};
            const entries = Object.keys(vars);
            if (entries.length === 0) {
                list.insertAdjacentHTML('beforeend', kvRowHTML('', ''));
            } else {
                entries.forEach(key => list.insertAdjacentHTML('beforeend', kvRowHTML(key, vars[key])));
            }
        }

        function addCaseVarRow() {
            const list = document.getElementById('ceVariablesList');
            if (!list) return;
            list.insertAdjacentHTML('beforeend', kvRowHTML('', ''));
        }

        function removeKvRow(btn) {
            const row = btn.closest('.kv-row');
            if (row) row.remove();
        }

        // B-13: 从 kv 行收集成 dict（空键跳过；全空返回 null）
        function collectKvRows(listId) {
            const list = document.getElementById(listId);
            if (!list) return null;
            const rows = list.querySelectorAll('.kv-row');
            const result = {};
            let any = false;
            rows.forEach(r => {
                const k = r.querySelector('.kv-key')?.value.trim();
                const v = r.querySelector('.kv-val')?.value;
                if (k) { result[k] = v; any = true; }
            });
            return any ? result : null;
        }

        function toggleCaseEditorFields() {
            const type = document.getElementById('ceEvalType')?.value;
            if (!type) return;
            const setDisplay = (id, show) => {
                const el = document.getElementById(id);
                if (el) el.style.display = show ? '' : 'none';
            };
            setDisplay('ceExactGroup', type === 'exact');
            setDisplay('ceContainsGroup', type === 'contains' || type === 'not_contains');
            setDisplay('ceLengthGroup', type === 'length');
            setDisplay('ceJudgeGroup', type === 'llm_judge');
        }

        async function saveCaseFromEditor(evalsetId, projectId, caseId) {
            const caseName = document.getElementById('ceCaseName').value.trim();
            const input = document.getElementById('ceInput').value;
            if (!caseName) { showToast('请填写 case_name', 'error'); return; }
            if (!input) { showToast('请填写 input', 'error'); return; }

            const evalType = document.getElementById('ceEvalType').value;
            const taskShape = document.getElementById('ceTaskShape').value.trim() || null;
            let expectedOutput = null, outputRequirement = null, evalParams = {};

            if (evalType === 'exact') {
                expectedOutput = document.getElementById('ceExpectedOutput').value;
            } else if (evalType === 'contains' || evalType === 'not_contains') {
                evalParams.substring = document.getElementById('ceSubstring').value;
            } else if (evalType === 'length') {
                const minV = document.getElementById('ceLengthMin').value;
                const maxV = document.getElementById('ceLengthMax').value;
                if (minV !== '') evalParams.min = parseInt(minV, 10);
                if (maxV !== '') evalParams.max = parseInt(maxV, 10);
            } else if (evalType === 'llm_judge') {
                outputRequirement = document.getElementById('ceOutputRequirement').value;
            }

            // T1-2: tags + T1-5: checks
            const tags = parseTagsInput(document.getElementById('ceTags').value);
            const checks = collectChecks();

            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = evalset.cases || [];
                const idx = cases.findIndex(c => c.id === caseId);
                const newCase = {
                    id: caseId,
                    case_name: caseName,
                    input,
                    expected_output: expectedOutput,
                    output_requirement: outputRequirement,
                    eval_type: evalType,
                    eval_params: evalParams,
                    task_shape: taskShape,
                    variables: collectKvRows('ceVariablesList'),
                    tags: tags,
                    checks: checks,
                    enabled: idx >= 0 ? cases[idx].enabled : true
                };
                if (idx >= 0) {
                    cases[idx] = newCase;
                } else {
                    cases.push(newCase);
                }
                await api(`/evalsets/${evalsetId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ ...evalset, cases })
                });
                closeModal('caseEditorModal');
                showToast(idx >= 0 ? '已更新用例' : '已新增用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        // B-5: 用例硬删除（红色入口 + 二次确认 + 影响说明）
        function showDeleteCaseModal(evalsetId, projectId, caseId) {
            // 从 state.currentEvalsets 查 case_name，避免在 HTML 属性里拼接用户输入（XSS 风险）
            const evalset = (state.currentEvalsets || []).find(e => e.id === evalsetId);
            const c = evalset?.cases?.find(x => x.id === caseId);
            const caseName = c?.case_name || caseId;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'deleteCaseModal';
            modal.innerHTML = `
                <div class="modal" style="max-width: 480px;">
                    <div class="modal-header">
                        <span class="modal-title" style="color: var(--red);">确认删除用例</span>
                        <button class="modal-close" onclick="closeModal('deleteCaseModal')">×</button>
                    </div>
                    <div class="modal-body">
                        <div style="margin-bottom: 12px;">

                        <div style="background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 6px; font-size: 13px;">

                    </div>
                    <div class="modal-footer">

        }

        async function confirmDeleteCase(evalsetId, projectId, caseId) {
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = (evalset.cases || []).filter(c => c.id !== caseId);
                await api(`/evalsets/${evalsetId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ ...evalset, cases })
                });
                closeModal('deleteCaseModal');
                showToast('已删除用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        // T1-6: 绑定配置页字段的 change/input 事件 → markConfigDirtyIfChanged
        // 绑定到 #tabContent 容器，依赖事件冒泡；过滤只在 config tab 上生效
        let _configDirtyBound = false;
        function bindConfigDirtyListeners() {
            if (_configDirtyBound) return;
            const container = document.getElementById('tabContent');
            if (!container) return;
            container.addEventListener('input', (e) => {
                if (!isInConfigTab()) return;
                const t = e.target;
                if (!t || !t.closest) return;
                // 只关心表单字段
                if (!t.matches('input, textarea, select')) return;
                markConfigDirtyIfChanged();
            });
            container.addEventListener('change', (e) => {
                if (!isInConfigTab()) return;
                const t = e.target;
                if (!t || !t.closest) return;
                if (!t.matches('input, textarea, select')) return;
                markConfigDirtyIfChanged();
            });
            _configDirtyBound = true;
        }
        function isInConfigTab() {
            const tab = document.querySelector('.tab[data-tab="config"]');
            return !!tab && tab.classList.contains('active');
        }

            const mode = document.getElementById('targetApiType')?.value;

            const modelRequired = document.getElementById('modelRequired');
            const templateHint = document.getElementById('templateHint');
            if (!mode) return;
            if (mode === 'custom') {
                // custom: model 可选，request_template 必填
                if (modelRequired) modelRequired.style.display = 'none';
                if (templateHint) templateHint.textContent = '（必填，JSON 格式，不注入 model/messages）';
                if (modelGroup) modelGroup.querySelector('label').firstChild.textContent = 'model（可选） ';
            } else {
                // openai_compatible: model 必填
                if (modelRequired) modelRequired.style.display = '';
                if (templateHint) templateHint.textContent = '（留空 {input} = 默认 OpenAI 格式）';
                if (modelGroup) modelGroup.querySelector('label').firstChild.textContent = 'model ';
            }
        }

        function renderAuthFields(projectId) {
            const container = document.getElementById('authFields');
            if (!container) return;
            const type = document.getElementById('authType').value;
            const auth = state._auth || { type: 'none' };
            // 切换类型时保留同名字段，其它清空
            const isMasked = v => v && typeof v === 'object' && v.masked === true;
            const MASK_PLACEHOLDER = '••••••••';
            const secretInput = (id, value) => {
                const masked = isMasked(value);
                const val = masked ? MASK_PLACEHOLDER : escapeHtml(value || '');
                return `<input type="password" class="form-input mono" value="${val}" id="${id}" data-masked="${masked ? 'true' : 'false'}" oninput="this.dataset.masked='false'">`;
            };

            let html = '';
            if (type === 'bearer') {
                html = `
                    <div class="form-group">
                        <label class="form-label">bearer_token</label>
                        ${secretInput('authBearerToken', auth.bearer_token)}
                    </div>
                `;
            } else if (type === 'api_key') {
                html = `
                    <div class="form-group">
                        <label class="form-label">header 名</label>
                        <input type="text" class="form-input mono" value="${escapeHtml(auth.api_key_header || 'X-API-Key')}" id="authApiKeyHeader">
                    </div>
                    <div class="form-group">
                        <label class="form-label">api_key 值</label>
                        ${secretInput('authApiKeyValue', auth.api_key_value)}
                    </div>
                `;
            } else if (type === 'cookie') {
                const cookies = Array.isArray(auth.cookies) ? auth.cookies : [];
                html = `
                    <div class="form-group">
                        <label class="form-label">Cookies（每行一个 name=value）</label>
                        <textarea class="form-input mono" id="authCookies" placeholder="session=abc">${escapeHtml(cookies.map(c => `${c.name}=${isMasked(c.value) ? '••••••••' : (c.value || '')}`).join('\n'))}</textarea>
                        <div style="margin-top: 4px; font-size: 11px; color: var(--ink-4);">掩码值将自动用 __UNCHANGED__ 保留</div>
                    </div>
                `;
            } else if (type === 'headers') {
                const headers = Array.isArray(auth.headers) ? auth.headers : [];
                html = `
                    <div class="form-group">
                        <label class="form-label">自定义 Headers（每行 name: value）</label>
                        <textarea class="form-input mono" id="authHeaders" placeholder="X-Env: test">${escapeHtml(headers.map(h => `${h.name}: ${h.value || ''}`).join('\n'))}</textarea>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // 工具：从带 data-masked 的输入读取值，掩码时返回哨兵
        function readSecret(id) {
            const el = document.getElementById(id);
            if (!el) return '';
            if (el.dataset.masked === 'true') return '__UNCHANGED__';
            return el.value;
        }

        function collectAuth() {
            const type = document.getElementById('authType').value;
            const auth = { type, bearer_token: null, api_key_header: 'X-API-Key', api_key_value: null, cookies: [], headers: [] };
            if (type === 'bearer') {
                auth.bearer_token = readSecret('authBearerToken') || null;
            } else if (type === 'api_key') {
                auth.api_key_header = document.getElementById('authApiKeyHeader')?.value || 'X-API-Key';
                auth.api_key_value = readSecret('authApiKeyValue') || null;
            } else if (type === 'cookie') {
                const lines = (document.getElementById('authCookies')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
                auth.cookies = lines.map((line, i) => {
                    const idx = line.indexOf('=');
                    const name = idx >= 0 ? line.slice(0, idx).trim() : line;
                    const value = idx >= 0 ? line.slice(idx + 1).trim() : '';
                    // 用户没改掩码占位 → 哨兵
                    const oldValue = (state._auth?.cookies || [])[i]?.value;
                    const wasMasked = oldValue && typeof oldValue === 'object' && oldValue.masked === true;
                    return { name, value: wasMasked && value === '••••••••' ? '__UNCHANGED__' : value };
                });
            } else if (type === 'headers') {
                const lines = (document.getElementById('authHeaders')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
                auth.headers = lines.map(line => {
                    const idx = line.indexOf(':');
                    return { name: idx >= 0 ? line.slice(0, idx).trim() : line, value: idx >= 0 ? line.slice(idx + 1).trim() : '' };
                });
            }
            return auth;
        }

        // B-7: 响应解析行编辑器 + JSON 树点选
        // 当前激活的路径目标：'output_paths' | 'token_paths' | 'token_fields' | null
        // 用户点 input 聚焦时设值，点 JSON 树节点时按此目标填入

            // 填充 token_paths / token_fields
            fillRpList('token_paths', hasPaths ? rp.token_paths : []);

        function fillRpList(target, values) {
            const listId = RP_LIST_IDS[target];

        function addRpPathRow(target, value = '') {

        function toggleRpTokenMode() {

        // ============== JSON 树渲染 + 点选生成路径 ==============

        function parseSampleToTree() {
            const sample = document.getElementById('parsingSample')?.value.trim();
            const treeDiv = document.getElementById('jsonTree');
            const container = document.getElementById('jsonTreeContainer');
            if (!sample) { showToast('请先粘贴样例响应', 'warning'); return; }
            let data;
            try {
                data = JSON.parse(sample);
            } catch (e) {
                showToast('JSON 解析失败: ' + e.message, 'error');
                container.style.display = 'none';
                return;
            }
            state._rpSample = sample;
            treeDiv.innerHTML = renderJsonTree(data, '$');
            container.style.display = 'block';
            // 事件委托：点击 [data-path] 节点 → 生成路径；点击 [data-toggle] → 折叠
            treeDiv.onclick = e => {
                const toggler = e.target.closest('[data-toggle]');
                if (toggler) {
                    const children = toggler.nextElementSibling;
                    if (children && children.classList.contains('jt-children')) {
                        children.classList.toggle('jt-hidden');
                        toggler.classList.toggle('jt-collapsed');
                    }
                    return;
                }
                const node = e.target.closest('[data-path]');
                if (node) pickJsonPath(node.dataset.path);
            };
        }

        // 递归渲染 JSON 节点。path 是当前节点的 JSONPath
        function renderJsonTree(node, path) {
            if (node === null) {
                return `<span class="jt-leaf jt-null" data-path="${escapeHtml(path)}">null</span>`;
            }
            if (typeof node !== 'object') {
                const type = typeof node;
                const cls = type === 'string' ? 'jt-string' : (type === 'boolean' ? 'jt-boolean' : 'jt-number');
                const display = type === 'string' ? `"${escapeHtml(node)}"` : escapeHtml(String(node));
                return `<span class="jt-leaf ${cls}" data-path="${escapeHtml(path)}">${display}</span>`;
            }
            const isArray = Array.isArray(node);
            const entries = isArray
                ? node.map((v, i) => [i, v])
                : Object.entries(node);
            if (entries.length === 0) {
                return `<span class="jt-bracket">${isArray ? '[]' : '{}'}</span>`;
            }
            const children = entries.map(([k, v]) => {
                let childPath;
                if (isArray) {
                    childPath = `${path}[${k}]`;
                } else if (/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(String(k))) {
                    childPath = `${path}.${k}`;
                } else {
                    childPath = `${path}['${String(k).replace(/'/g, "\\'")}']`;
                }
                const preview = (v === null || typeof v !== 'object')
                    ? ''
                    : ` <span class="jt-preview">${escapeHtml(Array.isArray(v) ? `[${v.length} 项]` : `{${Object.keys(v).length} 键}`)}</span>`;
                return `<div class="jt-row">
                    <span class="jt-key" data-path="${escapeHtml(childPath)}">${escapeHtml(String(k))}:</span>
                    ${renderJsonTree(v, childPath)}
                    ${preview}
                </div>`;
            }).join('');
            const open = isArray ? '[' : '{';
            const close = isArray ? ']' : '}';
            return `<span class="jt-bracket" data-toggle="1" data-path="${escapeHtml(path)}">${open}</span>
                <div class="jt-children">${children}</div>
                <span class="jt-bracket">${close}</span>`;
        }

        function pickJsonPath(path) {
            const target = state._rpActiveTarget;
            if (!target) {
                showToast('请先点击上方的路径输入框选中目标', 'warning');
                return;
            }
            // token_fields 目标：把 $.a.b 转成末段字段名（用户可手改）
            let value = path;
            if (target === 'token_fields') {
                const m = path.match(/\.([A-Za-z_$][A-Za-z0-9_$]*)$/);
                if (m) value = m[1];
                else if (path !== '$') value = path.replace(/^\$\.?|^\$/, '').replace(/^\['/, '').replace(/'\]$/, '');
            }
            // 优先填当前聚焦的 input
            const active = document.activeElement;
            if (active && active.classList && active.classList.contains('rp-path-input') && active.closest('#' + RP_LIST_IDS[target])) {
                active.value = value;
                active.focus();
                return;
            }
            // 找第一个空 input 填入
            const list = document.getElementById(RP_LIST_IDS[target]);
            if (!list) return;
            const inputs = Array.from(list.querySelectorAll('.rp-path-input'));
            const empty = inputs.find(i => !i.value.trim());
            if (empty) {
                empty.value = value;
                empty.focus();
                return;
            }
            // 没空 input → 新增一行
            addRpPathRow(target, value);
            const last = list.querySelector('.rp-path-row:last-child .rp-path-input');
            if (last) last.focus();
        }

        function collectResponseParsing() {
            const readList = target => {
                const listId = RP_LIST_IDS[target];
                const list = document.getElementById(listId);
                if (!list) return [];
                return Array.from(list.querySelectorAll('.rp-path-input'))
                    .map(i => i.value.trim()).filter(Boolean);
            };
            const scopeRaw = document.getElementById('rpTokenScope')?.value.trim();
            let tokenScope = null;
            if (scopeRaw) {
                try { tokenScope = JSON.parse(scopeRaw); }
                catch (e) { /* 留空，save 时由后端兜底；test 时单独报错 */ }
            }
            const mode = document.querySelector('input[name="rpTokenMode"]:checked')?.value || 'none';
            const unpackEl = document.getElementById('rpOutputUnpackJson');
            const fieldEl = document.getElementById('rpOutputField');
            return {
                output_paths: readList('output_paths'),
                token_paths: mode === 'paths' ? readList('token_paths') : [],
                token_fields: mode === 'fields' ? readList('token_fields') : [],
                token_scope: tokenScope,
                output_unpack_json: unpackEl ? unpackEl.checked : false,
                output_field: (fieldEl && fieldEl.value.trim()) ? fieldEl.value.trim() : null
            };
        }

        // P2-6: 收集 token_budget（limit 留空 = null = 不限预算）
        function collectTokenBudget() {
            const limitEl = document.getElementById('budgetLimit');
            const warnEl = document.getElementById('budgetWarnOnly');
            if (!limitEl) return state.currentProject?.token_budget || null;
            const raw = limitEl.value.trim();

            const limit = parseInt(raw, 10);
            if (isNaN(limit) || limit < 0) return null;
            return {
                limit,
                warn_only: warnEl ? warnEl.checked : true
            };
        }

        function updateRunDetailDom(run, evalsetMap) {

            const completed = run.results?.length || 0;
            const failed = run.results?.filter(r => !r.passed && !r.skipped_reason).length || 0;
            const pct = totalEnabled > 0 ? Math.min(100, (completed / totalEnabled) * 100) : (run.status === 'completed' ? 100 : 0);

            const statusRow = document.getElementById('runStatusRow');
            if (statusRow) {
                statusRow.innerHTML = `
                    <span class="status-badge status-${run.status}" style="margin-right: 12px;">
                        <span class="status-dot"></span>${run.status}
                    </span>
                    ${(run.status === 'running' || run.status === 'queued') ? `
                        <div class="progress-bar" style="display: inline-block; width: 200px; vertical-align: middle;">
                            <div class="progress-fill" style="width: ${pct}%"></div>

        // 静默轮询：指数退避，弹窗打开/页面隐藏时暂停
        let runPollTimer = null;
        let runPollDelay = 2000;
        const RUN_POLL_MAX_DELAY = 10000;

        function startRunPolling(params) {
            stopRunPolling();
            runPollDelay = 2000;
            document.removeEventListener('visibilitychange', onVisibilityChange);
            document.addEventListener('visibilitychange', onVisibilityChange);
            scheduleRunPoll(params);
        }

        function stopRunPolling() {
            if (runPollTimer) { clearTimeout(runPollTimer); runPollTimer = null; }
        }

        function onVisibilityChange() {
            const params = state.currentRunParams;
            if (!params) return;
            if (document.hidden) {
                stopRunPolling();
            } else {
                // 恢复时立即补拉
                pollRunOnce(params);
            }
        }

        function scheduleRunPoll(params) {
            stopRunPolling();
            runPollTimer = setTimeout(() => pollRunOnce(params), runPollDelay);
        }

        async function pollRunOnce(params) {
            // 终止条件：run 已结束 / 已离开 run 详情页
            if (!state.currentRunParams || state.currentRunParams.id !== params.id) return;
            const status = state.currentRun?.status;
            if (status === 'completed' || status === 'failed') return;

            // 弹窗打开时暂停轮询，但仍排程下一轮（让用户关闭弹窗后继续）
            const modal = document.getElementById('caseModal');
            if (modal && !modal.classList.contains('hidden')) {
                scheduleRunPoll(params);
                return;
            }
            if (document.hidden) return;

            try {
                const run = await api(`/runs/${params.id}?project_id=${params.projectId}`);
                state.currentRun = run;
                let evalsetMap = {};
                if (state.currentRunEvalset) {
                    (state.currentRunEvalset.cases || []).forEach(c => { evalsetMap[c.case_name] = c; });
                }
                updateRunDetailDom(run, evalsetMap);
                // 指数退避
                runPollDelay = Math.min(RUN_POLL_MAX_DELAY, runPollDelay * 1.5);
                if (run.status === 'running' || run.status === 'queued') {
                    scheduleRunPoll(params);
                }
            } catch (err) {
                // 网络错误时降速重试
                runPollDelay = Math.min(RUN_POLL_MAX_DELAY, runPollDelay * 1.5);
                scheduleRunPoll(params);
            }
        }

        let importData = { cases: [], errors: [], total: 0 };

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;
            parseFile(file);
        }

        function parseFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const content = e.target.result;
                    if (file.name.endsWith('.json')) {
                        importData = validateImportData(JSON.parse(content));
                    } else if (file.name.endsWith('.csv')) {
                        importData = validateImportData(parseCSVContent(content));
                    } else {
                        throw new Error('不支持的文件格式');
                    }
                    // P2-8: 保留原始内容，确认时传给后端 import 端点
                    importData.rawContent = content;
                    importData.format = file.name.endsWith('.json') ? 'json' : 'csv';
                    showImportPreview();
                } catch (err) {
                    showToast('文件解析失败: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function parseCSVContent(content) {
            const lines = content.replace(/^\ufeff/, '').split('\n').filter(l => l.trim());
            if (lines.length < 2) throw new Error('CSV 文件内容为空或格式错误');
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] || '');
                rows.push(obj);
            }
            return rows;
        }

        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current.trim());
            return values;
        }

        function validateImportData(rawCases) {
            if (!Array.isArray(rawCases)) {
                throw new Error('数据格式错误：需要数组');
            }
            const cases = [];
            const errors = [];
            const validTypes = ['exact', 'contains', 'not_contains', 'length', 'llm_judge'];
            rawCases.forEach((item, index) => {
                const rowNum = index + 1;
                const caseErrors = [];
                if (!item.case_name) caseErrors.push('case_name 必填');
                if (!item.input) caseErrors.push('input 必填');
                if (!item.eval_type) caseErrors.push('eval_type 必填');
                if (item.eval_type && !validTypes.includes(item.eval_type)) {
                    caseErrors.push('eval_type 无效: ' + item.eval_type);
                }
                // B-13: 解析 variables（CSV 列为 JSON 字符串；JSON 文件导入直接是对象）
                let variables = null;
                if (item.variables) {
                    if (typeof item.variables === 'string' && item.variables.trim()) {
                        try { variables = JSON.parse(item.variables); }
                        catch (e) { caseErrors.push('variables 不是合法 JSON'); }
                    } else if (typeof item.variables === 'object') {
                        variables = item.variables;
                    }
                }
                // T1-2: 解析 tags（CSV JSON 字符串数组 / 逗号或分号分隔字符串 / JSON 数组）
                let tags = [];
                if (item.tags !== undefined && item.tags !== null && item.tags !== '') {
                    if (Array.isArray(item.tags)) {
                        tags = item.tags.map(String);
                    } else if (typeof item.tags === 'string') {
                        const s = item.tags.trim();
                        if (s.startsWith('[')) {
                            try { tags = JSON.parse(s).map(String); }
                            catch (e) { caseErrors.push('tags 不是合法 JSON 数组'); }
                        } else {
                            tags = s.split(/[,，;；]/).map(t => t.trim()).filter(Boolean);
                        }
                    }
                }
                if (caseErrors.length > 0) {
                    errors.push({ row: rowNum, errors: caseErrors });
                } else {
                    cases.push({
                        id: item.id || 'import-' + Date.now() + '-' + rowNum,
                        case_name: item.case_name,
                        input: item.input || '',
                        expected_output: item.expected_output || null,
                        output_requirement: item.output_requirement || null,
                        eval_type: item.eval_type || 'exact',
                        eval_params: typeof item.eval_params === 'object' ? item.eval_params : {},
                        variables: variables,
                        tags: tags,
                        enabled: item.enabled !== false
                    });
                }
            });
            return { cases, errors, total: rawCases.length };
        }

        // B-12: 逐条表单——按 eval_type 切换字段组
        function toggleManualEvalFields() {
            const t = document.getElementById('manualEvalType')?.value;
            if (!t) return;
            const show = id => { const el = document.getElementById(id); if (el) el.style.display = ''; };
            const hide = id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; };
            // exact / llm_judge → 各自的字段；contains / not_contains → substring；length → min/max
            hide('manualExactGroup'); hide('manualContainsGroup'); hide('manualLengthGroup'); hide('manualLlmGroup');
            if (t === 'exact') show('manualExactGroup');
            else if (t === 'contains' || t === 'not_contains') show('manualContainsGroup');
            else if (t === 'length') show('manualLengthGroup');
            else if (t === 'llm_judge') show('manualLlmGroup');
        }

        // B-12: 从表单收集一条 case 加入待导入列表
        function addManualCaseToList() {
            const name = document.getElementById('manualCaseName').value.trim();
            const input = document.getElementById('manualInput').value;
            const evalType = document.getElementById('manualEvalType').value;
            if (!name) { showToast('case_name 必填', 'warning'); return; }
            if (!input.trim()) { showToast('input 必填', 'warning'); return; }
            const caseObj = { case_name: name, input, eval_type: evalType, eval_params: {}, enabled: true };
            if (evalType === 'exact') {
                caseObj.expected_output = document.getElementById('manualExpectedOutput').value;
            } else if (evalType === 'contains' || evalType === 'not_contains') {
                caseObj.eval_params.substring = document.getElementById('manualSubstring').value;
            } else if (evalType === 'length') {
                const min = document.getElementById('manualLenMin').value;
                const max = document.getElementById('manualLenMax').value;
                if (min) caseObj.eval_params.min = parseInt(min, 10);
                if (max) caseObj.eval_params.max = parseInt(max, 10);
            } else if (evalType === 'llm_judge') {
                caseObj.output_requirement = document.getElementById('manualOutputRequirement').value;
            }
            // B-13: 收集 variables kv 行
            const vars = collectKvRows('manualVariablesList');
            if (vars) caseObj.variables = vars;
            // T1-2: 收集 tags
            const tags = parseTagsInput(document.getElementById('manualTags').value);
            if (tags.length > 0) caseObj.tags = tags;
            // 加入待导入列表
            if (!Array.isArray(importData.cases)) importData.cases = [];
            importData.cases.push(caseObj);
            importData.total = importData.cases.length;
            importData.errors = [];
            renderManualCaseList();
            // 清空表单（保留 eval_type 选择）
            document.getElementById('manualCaseName').value = '';
            document.getElementById('manualInput').value = '';
            document.getElementById('manualExpectedOutput').value = '';
            document.getElementById('manualSubstring').value = '';
            document.getElementById('manualLenMin').value = '';
            document.getElementById('manualLenMax').value = '';
            document.getElementById('manualOutputRequirement').value = '';
            document.getElementById('manualTags').value = '';
            renderTagsPreview('', 'manualTagsPreview');
            // 重置变量行（保留一条空行）
            const mvList = document.getElementById('manualVariablesList');
            if (mvList) mvList.innerHTML = kvRowHTML('', '');
            document.getElementById('manualCaseName').focus();
        }

        function removeManualCase(idx) {
            if (!importData.cases) return;

        async function confirmImport(evalsetId, projectId) {
            if (importData.cases.length === 0) {
                showToast('没有可导入的数据', 'warning');
                return;
            }
            // B-12: 表单模式无 rawContent → 序列化 cases 成 JSON 作为 rawContent
            if (!importData.rawContent) {
                importData.rawContent = JSON.stringify(importData.cases);
                importData.format = 'json';
            }
            const mode = document.querySelector('input[name="importMode"]:checked').value;
            const progressDiv = document.getElementById('importProgress');
            const confirmBtn = document.getElementById('confirmImportBtn');
            progressDiv.style.display = 'block';
            progressDiv.innerHTML = '<div style="color: var(--ink-3);">导入中...</div>';
            confirmBtn.disabled = true;
            try {
                // P2-8: 走后端 import 端点（merge/replace + 行级错误兜底）
                const formData = new FormData();
                formData.append('file_content', importData.rawContent);
                formData.append('mode', mode);
                const resp = await fetch(`/api/evalsets/${evalsetId}/import?project_id=${projectId}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await resp.json();
                if (!resp.ok) {
                    // 后端行级错误（422 + errors 数组）
                    const errs = result?.detail?.errors || [];
                    if (errs.length > 0) {
                        progressDiv.innerHTML = '<div style="color: var(--red);">后端校验失败 (' + errs.length + ' 条):</div>' +
                            errs.slice(0, 5).map(e => '<div style="font-size: 12px; margin-top: 4px;">行 ' + e.row + ': ' + escapeHtml(e.error) + '</div>').join('');
                    } else {
                        throw new Error(result?.detail?.error || result?.detail || '导入失败');
                    }
                    confirmBtn.disabled = false;
                    return;
                }
                progressDiv.innerHTML = '<div style="color: var(--green);">✓ 导入完成（' + result.imported + ' 条，模式: ' + result.mode + '）</div>';
                showToast('成功导入 ' + result.imported + ' 条用例', 'success');
                // 重置导入状态，避免下次打开残留
                importData = { cases: [], errors: [], total: 0 };
                switchTab('evalsets');
                setTimeout(() => closeModal('importModal'), 800);
            } catch (err) {
                progressDiv.innerHTML = '<div style="color: var(--red);">导入失败: ' + escapeHtml(err.message) + '</div>';
                confirmBtn.disabled = false;
            }
        }

        function updateRunEvalsetInfo() {
            const select = document.getElementById('runEvalsetSelect');

            if (selectedTags.length > 0) {
                enabledCases = enabledCases.filter(c => {
                    const ct = c.tags || [];
                    return tagMode === 'all'
                        ? selectedTags.every(t => ct.includes(t))
                        : selectedTags.some(t => ct.includes(t));
                });
            }
            const byType = {};
            enabledCases.forEach(c => { byType[c.eval_type] = (byType[c.eval_type] || 0) + 1; });
            const typeBreakdown = Object.entries(byType).map(([t, n]) => `<span class="tag tag-${t}" style="margin-right: 4px;">${escapeHtml(t)} ×${n}</span>`).join('');
            info.innerHTML = `
                <div style="color: var(--ink-3); font-size: 12px;">将运行 <b style="color: var(--ink-1);">${enabledCases.length}</b> 条${selectedTags.length > 0 ? '（按标签筛选后）' : '启用'}用例</div>
                <div style="margin-top: 6px;">${typeBreakdown || '<span style="color: var(--red);">无启用用例</span>'}</div>
            `;
            const confirmBtn = document.getElementById('confirmRunBtn');
            if (confirmBtn) confirmBtn.disabled = enabledCases.length === 0;
        }

                if (res.ok) {
                    resultDiv.innerHTML = `
                        <div style="background: var(--green-bg); border: 1px solid var(--green-bd); padding: 10px 12px; border-radius: var(--radius-md);">
                            <div style="color: var(--green); margin-bottom: 6px;">✓ output_found=${res.output_found} · token=${res.token_used}${res.token_missing ? ' (缺失)' : ''}</div>
                            <div class="code-block" style="margin-top: 6px;">${escapeHtml(res.output)}</div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(res.error?.message || '失败')}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(err.message)}</span>`;
            }
        }

        // T1-3: Judge API 模式切换
        function toggleJudgeApiMode() {
            const mode = document.getElementById('judgeApiType')?.value;
            if (!mode) return;
            const showCustom = mode === 'custom';
            const setDisplay = (id, show) => {
                const el = document.getElementById(id);
                if (el) el.style.display = show ? '' : 'none';
            };
            // openai_compatible: model 必填；custom: model 可选，request_template 必填
            setDisplay('judgeRequestTemplateGroup', showCustom);
            setDisplay('judgeAuthGroup', showCustom);
            setDisplay('judgeResponseParsingGroup', showCustom);
            const modelRequired = document.getElementById('judgeModelRequired');
            if (modelRequired) modelRequired.style.display = showCustom ? 'none' : '';
        }

        // T1-3: 收集 Judge 配置（auth + response_parsing 从 JSON 文本框解析）
        function collectJudgeConfigExtras() {
            const mode = document.getElementById('judgeApiType')?.value || 'openai_compatible';
            const result = { api_type: mode, auth: { type: 'none' }, response_parsing: null, request_template: null };
            if (mode !== 'custom') return result;
            const tplEl = document.getElementById('judgeRequestTemplate');
            result.request_template = tplEl ? tplEl.value : null;
            // auth JSON
            const authEl = document.getElementById('judgeAuthJson');
            if (authEl && authEl.value.trim()) {
                try {
                    result.auth = JSON.parse(authEl.value);
                } catch (e) {
                    throw new Error('Judge auth 不是合法 JSON: ' + e.message);
                }
            }
            // response_parsing JSON
            const rpEl = document.getElementById('judgeResponseParsingJson');
            if (rpEl && rpEl.value.trim()) {
                try {
                    result.response_parsing = JSON.parse(rpEl.value);
                } catch (e) {
                    throw new Error('Judge response_parsing 不是合法 JSON: ' + e.message);
                }
            }
            return result;
        }

        async function testJudgeConfig(projectId) {
            const resultDiv = document.getElementById('judgeTestResult');
            resultDiv.innerHTML = '<span class="text-muted">测试中...</span>';

            let extras;
            try {
                extras = collectJudgeConfigExtras();
            } catch (e) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(e.message)}</span>`;
                return;
            }

            try {
                const res = await api(`/test/judge?project_id=${encodeURIComponent(projectId)}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        base_url: document.getElementById('judgeBaseUrl').value,
                        api_key: readSecret('judgeApiKey') || '__UNCHANGED__',
                        model: document.getElementById('judgeModel').value,
                        prompt_template: document.getElementById('judgePrompt').value,
                        input: '测试输入',
                        output_requirement: '测试要求',
                        actual_output: '测试输出',
                        api_type: extras.api_type,
                        request_template: extras.request_template,
                        auth: extras.auth,
                        response_parsing: extras.response_parsing
                    })
                });

                if (res.ok) {
                    resultDiv.innerHTML = `<span style="color: var(--green);">✓ 得分: ${res.score} · ${res.passed ? '通过' : '不通过'}${res.token_used ? ' · ' + res.token_used + ' tokens' : ''}</span>`;
                } else {
                    resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(res.error?.message || '失败')}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(err.message)}</span>`;
            }
        }

        async function saveProjectConfig(projectId) {
            // T1-3: 收集 Judge 双模式字段（可能抛出 JSON 解析错误）
            let judgeExtras;
            try {
                judgeExtras = collectJudgeConfigExtras();
            } catch (e) {
                showToast(e.message, 'error');
                return;
            }
            const config = {
                id: projectId,
                name: state.currentProject.name,
                task_shape: state.currentProject.task_shape,
                judge_config: {
                    api_type: judgeExtras.api_type,
                    base_url: document.getElementById('judgeBaseUrl').value,
                    api_key: readSecret('judgeApiKey') || '__UNCHANGED__',
                    model: document.getElementById('judgeModel').value || null,
                    request_template: judgeExtras.request_template,
                    auth: judgeExtras.auth,
                    response_parsing: judgeExtras.response_parsing,
                    prompt_template: document.getElementById('judgePrompt').value
                },
                target_config: {
                    api_type: document.getElementById('targetApiType').value,
                    base_url: document.getElementById('targetBaseUrl').value,
                    api_key: readSecret('targetApiKey') || '__UNCHANGED__',
                    model: document.getElementById('targetModel').value || null,
                    request_template: document.getElementById('targetTemplate').value,
                    auth: collectAuth(),
                    response_mapping: [],
                    response_parsing: collectResponseParsing()
                },
                token_budget: collectTokenBudget()
            };

            try {
                const updated = await api(`/projects/${projectId}`, {
                    method: 'PUT',
                    body: JSON.stringify(config)
                });
                // 更新本地缓存，让后续操作看到最新掩码状态
                state.currentProject = updated;
                // T1-6: 保存后清除 dirty 标记
                state._configDirty = false;
                state._configSnapshot = JSON.stringify(collectConfigSnapshot());
                showToast('保存成功');
                // 重新渲染配置页，把掩码状态刷新（用户改过的字段恢复为 masked 占位）
                switchTab('config');
            } catch (err) {}
        }

        // T1-6: 收集当前配置页可序列化字段（用于 dirty 比对）
        function collectConfigSnapshot() {
            // 跳过 secret 字段（masked 状态用户没改 → __UNCHANGED__，不会触发 dirty）
            let judgeExtras = null;
            try { judgeExtras = collectJudgeConfigExtras(); } catch (e) { judgeExtras = { _parseError: e.message }; }
            return {
                target_api_type: document.getElementById('targetApiType')?.value,
                target_base_url: document.getElementById('targetBaseUrl')?.value,
                target_api_key: readSecret('targetApiKey'),
                target_model: document.getElementById('targetModel')?.value,
                target_template: document.getElementById('targetTemplate')?.value,
                target_auth: collectAuth(),
                target_rp: collectResponseParsing(),
                judge_api_type: document.getElementById('judgeApiType')?.value,
                judge_base_url: document.getElementById('judgeBaseUrl')?.value,
                judge_api_key: readSecret('judgeApiKey'),
                judge_model: document.getElementById('judgeModel')?.value,
                judge_template: document.getElementById('judgeRequestTemplate')?.value,
                judge_auth_json: document.getElementById('judgeAuthJson')?.value,
                judge_rp_json: document.getElementById('judgeResponseParsingJson')?.value,
                judge_prompt: document.getElementById('judgePrompt')?.value,
                budget_limit: document.getElementById('budgetLimit')?.value,
                budget_warn_only: document.getElementById('budgetWarnOnly')?.checked,
                _judgeExtras: judgeExtras
            };
        }

        // T1-6: 比较当前快照与初始快照，返回 dirty 状态
        function isConfigDirty() {
            if (!state._configSnapshot) return false;
            const current = JSON.stringify(collectConfigSnapshot());
            return current !== state._configSnapshot;
        }

        // T1-6: 触发 dirty 检测更新（配置页字段 change 事件回调）
        function markConfigDirtyIfChanged() {
            if (state._suppressDirtyCheck) return;
            const dirty = isConfigDirty();
            state._configDirty = dirty;
            // 配置 tab 标签上加/移除 dirty 圆点
            const configTab = document.querySelector('.tab[data-tab="config"]');
            if (configTab) {
                const existingDot = configTab.querySelector('.dirty-tab-dot');
                if (dirty && !existingDot) {
                    configTab.insertAdjacentHTML('beforeend', '<span class="dirty-tab-dot"></span>');
                } else if (!dirty && existingDot) {
                    existingDot.remove();
                }
            }
        }

        async function toggleCaseEnabled(evalsetId, projectId, caseId, enabled) {
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = evalset.cases || [];
                const caseIndex = cases.findIndex(c => c.id === caseId);
                if (caseIndex >= 0) {
                    cases[caseIndex].enabled = enabled;
                    await api(`/evalsets/${evalsetId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ ...evalset, cases })
                    });
                    showToast(enabled ? '已启用' : '已禁用');
                    switchTab('evalsets');
                }
            } catch (err) {}
        }

        async function exportEvalSet(evalsetId, projectId) {
            try {
                const data = await api(`/evalsets/${evalsetId}/export?project_id=${projectId}`);
                downloadCSV(data.content, data.filename);
            } catch (err) {}
        }

        async function exportRun(runId, projectId) {
            try {
                const data = await api(`/runs/${runId}/export?project_id=${projectId}`);
                downloadCSV(data.content, data.filename);
            } catch (err) {}
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function closeModal(id) {
            document.getElementById(id)?.remove();
        }

        // ==================== 工具函数 ====================
        function formatRelativeTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString.replace('Z', '+00:00'));
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return Math.floor(diff / 86400) + ' 天前';
        }

        function formatNumber(num) {
            if (!num && num !== 0) return '-';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 优先从 hash 恢复，没有 hash 默认回列表
            const parsed = parseHash(location.hash);
            if (parsed) {
                runNavigation(parsed.page, parsed.params || {});
            } else {
                navigateTo('projects');
            }
            // 启动运行中任务胶囊轮询
            loadRunningTasks();
            setInterval(loadRunningTasks, 5000);
        });

        // 暴露给 window，方便 onclick 内联调用
        window.navigateTo = navigateTo;
        window.runNavigation = runNavigation;
    </script>
</body>
