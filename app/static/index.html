                                                <span class="status-badge ${c.enabled ? 'status-passed' : 'status-disabled'}">
                                                    <span class="status-dot"></span>
                                                    ${c.enabled ? '启用' : '禁用'}
                                                </span>
                                            </td>
                                            <td style="text-align: center; color: ${n > 0 ? 'var(--ink-2)' : 'var(--ink-4)'};">${n || '-'}</td>
                                            <td style="text-align: center; color: ${sc && sc.n > 0 ? 'var(--ink-2)' : 'var(--ink-4)'};">${pr}</td>
                                            <td style="text-align: center; color: ${sc && sc.pass_pow_3 !== null ? (sc.pass_pow_3 < 0.5 ? 'var(--red)' : 'var(--green)') : 'var(--ink-4)'};">${p3}</td>
                                            <td style="white-space: nowrap;">
                                                <button class="btn btn-sm btn-secondary" onclick="toggleCaseEnabled('${evalset.id}', '${projectId}', '${c.id}', ${!c.enabled})" title="${c.enabled ? '禁用' : '启用'}">
                                                    ${c.enabled ? '禁用' : '启用'}
                                                </button>
                                                <button class="btn btn-sm btn-secondary" onclick="showCaseEditorModal('${evalset.id}', '${projectId}', '${c.id}')" title="详情（编辑 + 统计）">详情</button>
                                                <button class="btn btn-sm btn-danger" onclick="showDeleteCaseModal('${evalset.id}', '${projectId}', '${c.id}')" title="永久删除">删除</button>
                                            </td>
                                        </tr>
                                    `}).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // B-16: 批量操作辅助函数
        function getSelectedCaseIds() {
            return Array.from(document.querySelectorAll('.batch-case-cb:checked')).map(cb => cb.value);
        }

        // P-2: 评测集 tab 标签过滤（OR 语义，从缓存重新渲染，不重新拉数据）
        function toggleEvalsetTagFilter(el) {
            const tag = el.dataset.tag;
            if (!state._evalsetTagFilter) state._evalsetTagFilter = [];
            const filter = state._evalsetTagFilter;
            const idx = filter.indexOf(tag);
            if (idx >= 0) filter.splice(idx, 1);
            else filter.push(tag);
            _rerenderEvalsetDetail();
        }
        function clearEvalsetTagFilter() {
            state._evalsetTagFilter = [];
            _rerenderEvalsetDetail();
        }
        // P-2: 类型筛选（多选 chips）
        function toggleEvalsetTypeFilter(el) {
            const t = el.dataset.type;
            if (!state._evalsetTypeFilter) state._evalsetTypeFilter = [];
            const filter = state._evalsetTypeFilter;
            const idx = filter.indexOf(t);
            if (idx >= 0) filter.splice(idx, 1);
            else filter.push(t);
            _rerenderEvalsetDetail();
        }
        // P-2: 状态筛选（下拉）
        function setEvalsetStatusFilter(val) {
            state._evalsetStatusFilter = val || 'all';
            _rerenderEvalsetDetail();
        }
        // P-2: 一键重置全部筛选（搜索词 + 类型 + 标签 + 状态）
        function resetAllEvalsetFilters() {
            state._evalsetKeyword = '';
            state._evalsetTagFilter = [];
            state._evalsetTypeFilter = [];
            state._evalsetStatusFilter = 'all';
            _rerenderEvalsetDetail();
        }
        // U-6: 关键词搜索（debounce 200ms）
        let _evalsetKeywordTimer = null;
        function onEvalsetKeywordInput(val) {
            state._evalsetKeyword = val;
            clearTimeout(_evalsetKeywordTimer);
            _evalsetKeywordTimer = setTimeout(() => _rerenderEvalsetDetail(), 200);
        }
        function clearEvalsetKeyword() {
            state._evalsetKeyword = '';
            _rerenderEvalsetDetail();
        }
        function _rerenderEvalsetDetail() {
            if (!state.currentEvalsets || !state.currentEvalsets[0]) return;
            // 优先从 evalset.project_id 取（不依赖 state.currentProject 是否已加载）
            const es = state.currentEvalsets[0];
            const projectId = es.project_id || (state.currentProject ? state.currentProject.id : null);
            if (!projectId) return;
            const detail = document.getElementById('evalsetDetail');
            if (detail) detail.outerHTML = renderEvalsetDetail(es, projectId);
        }

        // T2-1: 异步加载 case 级采样数据 → 存 state → 重渲染表格（数据填充 + 排序）
        async function loadEvalsetSampling(evalsetId, projectId) {
            try {
                const resp = await fetch(`/api/evalsets/${evalsetId}/sampling?project_id=${projectId}`);
                if (!resp.ok) return;
                state._evalsetSampling = await resp.json();
                _rerenderEvalsetDetail();
            } catch (e) { /* 静默失败，采样数据非关键 */ }
        }

        // T2-1: 表头点击排序（n / pass rate / pass^3，切换升降序）
        function sortEvalsetBy(key) {
            // V-2: 三态排序（升序 → 降序 → 默认）
            if (state._evalsetSortKey === key) {
                if (state._evalsetSortDir === 'asc') state._evalsetSortDir = 'desc';
                else if (state._evalsetSortDir === 'desc') { state._evalsetSortDir = null; state._evalsetSortKey = null; }
                else state._evalsetSortDir = 'asc';
            } else {
                state._evalsetSortKey = key;
                state._evalsetSortDir = 'asc';
            }
            _rerenderEvalsetDetail();
        }

        // V-2: 历史列表三态排序
        function sortHistoryBy(key) {
            if (state._historySortKey === key) {
                if (state._historySortDir === 'asc') state._historySortDir = 'desc';
                else if (state._historySortDir === 'desc') { state._historySortDir = null; state._historySortKey = null; }
                else state._historySortDir = 'asc';
            } else {
                state._historySortKey = key;
                state._historySortDir = 'asc';
            }
            renderHistoryTab(document.getElementById('tab-content'), state.currentProject?.id);
        }

        // V-5: run 详情 case 结果三态排序
        function sortRunDetailBy(key) {
            if (state._runDetailSortKey === key) {
                if (state._runDetailSortDir === 'asc') state._runDetailSortDir = 'desc';
                else if (state._runDetailSortDir === 'desc') { state._runDetailSortDir = null; state._runDetailSortKey = null; }
                else state._runDetailSortDir = 'asc';
            } else {
                state._runDetailSortKey = key;
                state._runDetailSortDir = 'asc';
            }
            // 重新渲染表头 + 数据（保持排序状态）
            if (state.currentRun && state.currentRunParams) {
                let evalsetMap = {};
                if (state.currentRunEvalset) {
                    (state.currentRunEvalset.cases || []).forEach(c => { evalsetMap[c.case_name] = c; });
                }
                updateRunDetailDom(state.currentRun, evalsetMap);
            }
        }

        function updateBatchOpsBar() {
            const bar = document.getElementById('batchOpsBar');
            const countEl = document.getElementById('batchSelectedCount');
            const selected = getSelectedCaseIds();
            if (bar) bar.style.display = selected.length > 0 ? 'flex' : 'none';
            if (countEl) countEl.textContent = '已选 ' + selected.length + ' 条';
            // 联动表头全选状态
            const selectAll = document.getElementById('batchSelectAll');
            const allCbs = document.querySelectorAll('.batch-case-cb');
            if (selectAll && allCbs.length > 0) {
                selectAll.checked = Array.from(allCbs).every(cb => cb.checked);
            }
        }

        function toggleBatchSelectAll() {
            const selectAll = document.getElementById('batchSelectAll');
            if (!selectAll) return;
            document.querySelectorAll('.batch-case-cb').forEach(cb => { cb.checked = selectAll.checked; });
            updateBatchOpsBar();
        }

        async function batchToggleCases(evalsetId, projectId, enable) {
            const ids = getSelectedCaseIds();
            if (ids.length === 0) { showToast('未选中用例', 'warning'); return; }
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = (evalset.cases || []).map(c => ids.includes(c.id) ? { ...c, enabled: enable } : c);
                await api(`/evalsets/${evalsetId}`, { method: 'PUT', body: JSON.stringify({ ...evalset, cases }) });
                showToast('已' + (enable ? '启用' : '禁用') + ' ' + ids.length + ' 条用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        function showBatchDeleteModal(evalsetId, projectId) {
            const ids = getSelectedCaseIds();
            if (ids.length === 0) { showToast('未选中用例', 'warning'); return; }
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'batchDeleteModal';
            modal.innerHTML = `
                <div class="modal" style="max-width: 480px;">
                    <div class="modal-header">
                        <span class="modal-title" style="color: var(--red);">确认批量删除</span>
                        <button class="modal-close" onclick="closeModal('batchDeleteModal')">×</button>
                    </div>
                    <div class="modal-body">
                        <div style="margin-bottom: 12px;">
                            将永久删除选中的 <strong>${ids.length}</strong> 条用例。
                        </div>
                        <div style="background: var(--red-bg); color: var(--red); padding: 12px; border-radius: 6px; font-size: 13px;">
                            删除后无法恢复；历史 run 中这些 case 的结果保留。
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('batchDeleteModal')">取消</button>
                        <button class="btn btn-danger" onclick="confirmBatchDelete('${evalsetId}', '${projectId}')">永久删除</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function confirmBatchDelete(evalsetId, projectId) {
            const ids = getSelectedCaseIds();
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = (evalset.cases || []).filter(c => !ids.includes(c.id));
                await api(`/evalsets/${evalsetId}`, { method: 'PUT', body: JSON.stringify({ ...evalset, cases }) });
                closeModal('batchDeleteModal');
                showToast('已删除 ' + ids.length + ' 条用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        // B-5: 用例新增/编辑弹窗（caseId 为 null = 新增）
        function showCaseEditorModal(evalsetId, projectId, caseId) {
            const evalset = (state.currentEvalsets || []).find(e => e.id === evalsetId);
            const existing = caseId ? evalset?.cases?.find(c => c.id === caseId) : null;
            const isNew = !existing;
            // 默认值（新增用例）
            const c = existing || {
                id: 'case-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                case_name: '',
                input: '',
                expected_output: '',
                output_requirement: '',
                eval_type: 'exact',
                eval_params: {},
                task_shape: '',
                enabled: true,
                tags: [],
                checks: []
            };
            const params = c.eval_params || {};
            const substringVal = params.substring || '';
            const minVal = params.min ?? '';
            const maxVal = params.max ?? '';
            const tagsStr = Array.isArray(c.tags) ? c.tags.join(', ') : '';

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'caseEditorModal';
            modal.innerHTML = `
                <div class="modal" style="max-width: 760px;">
                    <div class="modal-header">
                        <span class="modal-title">${isNew ? '新增用例' : '用例详情'}</span>
                        <button class="modal-close" onclick="closeModal('caseEditorModal')">×</button>
                    </div>
                    <div class="modal-body">
                        <div id="ceTabBar" style="display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px;">
                            <button class="btn btn-sm" id="ceTabDetailBtn" style="border: none; background: var(--accent); color: white; border-radius: 4px 4px 0 0;" onclick="switchCaseEditorTab('detail')">详情</button>
                            <button class="btn btn-sm" id="ceTabStatsBtn" style="border: none; background: transparent; color: var(--ink-4); border-radius: 4px 4px 0 0; ${isNew ? 'display: none;' : ''}" onclick="switchCaseEditorTab('stats')">统计</button>
                        </div>
                        <div id="ceDetailTab">
                        <div class="form-group">
                            <label class="form-label">case_name <span style="color: var(--red);">*</span></label>
                            <input type="text" class="form-input mono" id="ceCaseName" value="${escapeHtml(c.case_name || '')}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">标签 tags（chips：点 × 删除；点 + 添加标签选已有或输入新建）</label>
                            <div id="ceTagsChips" class="tag-chips" style="display: flex; gap: 4px; flex-wrap: wrap; min-height: 28px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card-bg);"></div>
                            <div id="ceTagsAddPopover" style="display: none; margin-top: 4px; padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-2);">
                                <input type="text" class="form-input" id="ceTagsAddInput" placeholder="输入新标签名回车添加，或从下方列表选择" oninput="filterGlobalTagsForEditorAdd(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); addTagFromEditorInput();}">
                                <div id="ceTagsAddList" style="margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap;"></div>
                            </div>
                            <button class="btn btn-sm btn-secondary" style="margin-top: 4px;" onclick="toggleEditorTagsAddPopover()">+ 添加标签</button>
                            <div style="font-size: 11px; color: var(--ink-4); margin-top: 4px;">标签全局唯一：新建标签自动进入全局标签库；发起评测时可按标签筛选参与的 case</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Input 区域 <span style="color: var(--red);">*</span>（行编辑器：变量名 + 输入值）</label>
                            <div id="ceInputRows" class="kv-list"></div>
                            <button class="btn btn-sm btn-secondary" onclick="addInputVarRow()">+ 添加变量</button>
                            <div style="font-size: 11px; color: var(--ink-4); margin-top: 4px;">首行固定为 <code>input</code>（保留字）；后续行变量名任意，模板里用 {key} 引用</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Validation 区域（统一主输出 + 字段验证，全部通过才算通过）</label>
                            <div style="font-size: 11px; color: var(--ink-4); margin-bottom: 6px;">
                                field 默认 <code>output</code>（保留字 = 主输出）；填其他字段名（如 result / a.b.c）= 多字段验证；exact 填 expected，contains/not_contains 填子串，length 填 min/max，llm_judge 填评判标准。
                            </div>
                            <div class="checks-list" id="ceValidationsList"></div>
                            <button class="btn btn-sm btn-secondary" onclick="addValidationRow()">+ 添加 validation</button>
                        </div>
                        </div>
                        <div id="ceStatsTab" style="display: none; min-height: 200px;"></div>
                    </div>
                    <div class="modal-footer" id="ceModalFooter">
                        <button class="btn btn-secondary" onclick="closeModal('caseEditorModal')">取消</button>
                        <button class="btn btn-primary" onclick="saveCaseFromEditor('${evalsetId}', '${projectId}', '${c.id}')">${isNew ? '新增' : '保存'}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            // O-4: 存当前编辑上下文供统计 tab 加载用
            state.ceContext = { evalsetId, projectId, caseId, isNew };
            // W-6: 统一 input 行编辑器（首行 input 固定 + 后续 variables）
            initInputRows(c.input || '', c.variables);
            // O-2: 标签 chips 交互（当前已打标签 + 全局标签库选/新建）
            state.editorTags = Array.isArray(c.tags) ? c.tags.slice() : [];
            renderEditorTagsChips();
            window._allExistingTags = [];
            loadGlobalTagsForEditor();
            // W-6: 以 validations 为主结构；旧字段 (eval_type/expected/checks) 降级为回填源
            const validationsForEdit = synthesizeValidationsFromCase(c);
            initValidationRows(validationsForEdit);
        }

        // O-4: 合并弹窗双 tab 切换（详情/统计）
        function switchCaseEditorTab(tab) {
            const detailTab = document.getElementById('ceDetailTab');
            const statsTab = document.getElementById('ceStatsTab');
            const detailBtn = document.getElementById('ceTabDetailBtn');
            const statsBtn = document.getElementById('ceTabStatsBtn');
            const footer = document.getElementById('ceModalFooter');
            if (!detailTab || !statsTab) return;
            if (tab === 'detail') {
                detailTab.style.display = '';
                statsTab.style.display = 'none';
                if (detailBtn) { detailBtn.style.background = 'var(--accent)'; detailBtn.style.color = 'white'; }
                if (statsBtn) { statsBtn.style.background = 'transparent'; statsBtn.style.color = 'var(--ink-4)'; }
                if (footer) footer.style.display = '';
            } else if (tab === 'stats') {
                detailTab.style.display = 'none';
                statsTab.style.display = '';
                if (detailBtn) { detailBtn.style.background = 'transparent'; detailBtn.style.color = 'var(--ink-4)'; }
                if (statsBtn) { statsBtn.style.background = 'var(--accent)'; statsBtn.style.color = 'white'; }
                // 统计 tab 无保存按钮（只读）
                if (footer) footer.style.display = 'none';
                // 首次激活时加载 case history
                const ctx = state.ceContext;
                if (ctx && !ctx.isNew && !statsTab.dataset.loaded) {
                    statsTab.dataset.loaded = '1';
                    loadCaseStatsInto('ceStatsTab', ctx.evalsetId, ctx.projectId, ctx.caseId);
                }
            }
        }

        // O-2: 标签 chips 渲染（当前已打标签，每个 chip 可点 × 删除）
        function renderEditorTagsChips() {
            const el = document.getElementById('ceTagsChips');
            if (!el) return;
            const tags = state.editorTags || [];
            if (tags.length === 0) {
                el.innerHTML = '<span style="font-size: 11px; color: var(--ink-5); padding: 4px;">暂无标签</span>';
                return;
            }
            el.innerHTML = tags.map(t => `
                <span class="tag-chip" style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--light-bg); border: 1px solid var(--border); border-radius: 999px; font-size: 12px;">
                    ${escapeHtml(t)}
                    <span style="cursor: pointer; color: var(--ink-5); font-size: 14px; line-height: 1;" data-tag="${escapeHtml(t)}" onclick="removeTagFromEditor(this.dataset.tag)">×</span>
                </span>
            `).join('');
        }

        function addTagToEditor(tag) {
            tag = (tag || '').trim();
            if (!tag) return;
            if (!state.editorTags) state.editorTags = [];
            if (state.editorTags.includes(tag)) return;
            state.editorTags.push(tag);
            renderEditorTagsChips();
        }

        function removeTagFromEditor(tag) {
            if (!state.editorTags) return;
            state.editorTags = state.editorTags.filter(t => t !== tag);
            renderEditorTagsChips();
        }

        function toggleEditorTagsAddPopover() {
            const pop = document.getElementById('ceTagsAddPopover');
            if (!pop) return;
            const willShow = pop.style.display === 'none';
            pop.style.display = willShow ? 'block' : 'none';
            if (willShow) {
                const inp = document.getElementById('ceTagsAddInput');
                if (inp) { inp.value = ''; inp.focus(); }
                filterGlobalTagsForEditorAdd('');
            }
        }

        // O-2: 加载全局标签库（标签全局唯一，从 /tags API 取）
        async function loadGlobalTagsForEditor() {
            try {
                const data = await api('/tags');
                window._allExistingTags = (data.tags || []).map(t => t.name || '').filter(Boolean);
                filterGlobalTagsForEditorAdd('');
            } catch (err) {
                window._allExistingTags = [];
            }
        }

        function filterGlobalTagsForEditorAdd(query) {
            const listEl = document.getElementById('ceTagsAddList');
            if (!listEl || !window._allExistingTags) return;
            const q = (query || '').trim().toLowerCase();
            const selected = new Set(state.editorTags || []);
            // 已选标签不在列表重复出现；按输入过滤
            const matched = window._allExistingTags
                .filter(t => !selected.has(t))
                .filter(t => !q || t.toLowerCase().includes(q));
            if (matched.length === 0) {
                listEl.innerHTML = '<span style="font-size: 11px; color: var(--ink-5);">无匹配已有标签（在上方输入框输入新名回车创建）</span>';
            } else {
                listEl.innerHTML = matched.map(t => `<button class="tag-chip" style="cursor: pointer; padding: 2px 8px; background: var(--light-bg); border: 1px solid var(--border); border-radius: 999px; font-size: 12px;" data-tag="${escapeHtml(t)}" onclick="addTagToEditor(this.dataset.tag); filterGlobalTagsForEditorAdd(document.getElementById('ceTagsAddInput').value)">${escapeHtml(t)}</button>`).join('');
            }
        }

        function addTagFromEditorInput() {
            const inp = document.getElementById('ceTagsAddInput');
            if (!inp) return;
            const val = inp.value.trim();
            if (!val) return;
            addTagToEditor(val);
            inp.value = '';
            filterGlobalTagsForEditorAdd('');
        }

        // T1-2: 逗号分隔 → chips 预览
        function renderTagsPreview(str, targetId) {
            const el = document.getElementById(targetId);
            if (!el) return;
            const tags = (str || '').split(/[,，]/).map(s => s.trim()).filter(Boolean);
            el.innerHTML = tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('') || '<span style="font-size: 11px; color: var(--ink-4);">无</span>';
        }
        function parseTagsInput(str) {
            return (str || '').split(/[,，]/).map(s => s.trim()).filter(Boolean);
        }

        // T1-5: checks 列表编辑器
        const CHECK_EVAL_TYPES = [
            { value: 'exact', label: 'exact（精确匹配）' },
            { value: 'contains', label: 'contains（包含子串）' },
            { value: 'not_contains', label: 'not_contains（不包含子串）' },
            { value: 'length', label: 'length（长度范围）' },
            { value: 'llm_judge', label: 'llm_judge（LLM 评判）' }
        ];
        function checkRowHTML(chk) {
            chk = chk || { name: '', field: '', eval_type: 'exact', expected: '', eval_params: {} };
            const epSubstr = chk.eval_params?.substring || '';
            const epMin = chk.eval_params?.min ?? '';
            const epMax = chk.eval_params?.max ?? '';
            const expectedVisible = chk.eval_type === 'exact' || chk.eval_type === 'llm_judge';
            const containsVisible = chk.eval_type === 'contains' || chk.eval_type === 'not_contains';
            const lengthVisible = chk.eval_type === 'length';
            return `
                <div class="check-row" data-eval-type="${escapeHtml(chk.eval_type)}">
                    <input type="text" class="form-input chk-name" value="${escapeHtml(chk.name || '')}" placeholder="check 名称">
                    <input type="text" class="form-input chk-field" value="${escapeHtml(chk.field || '')}" placeholder="字段（如 result / a.b.c）">
                    <select class="form-input chk-type" onchange="updateCheckRowVisibility(this)">
                        ${CHECK_EVAL_TYPES.map(t => `<option value="${t.value}" ${chk.eval_type === t.value ? 'selected' : ''}>${escapeHtml(t.label)}</option>`).join('')}
                    </select>
                    <div class="chk-params">

                               style="${expectedVisible ? '' : 'display:none;'}">
                        <input type="text" class="form-input chk-substr" value="${escapeHtml(epSubstr)}" placeholder="substring 子串"

                        <div class="chk-length" style="display: ${lengthVisible ? 'flex' : 'none'}; gap: 4px;">
                            <input type="number" class="form-input chk-len-min" value="${epMin}" placeholder="min" style="width: 50%;">

        function initCheckRows(checks) {

            } else {

        function addCheckRow() {
            const list = document.getElementById('ceChecksList');
            if (!list) return;
            // 移除"无 check"占位
            const placeholder = list.querySelector('div[style*="无 check"]');
            if (placeholder) placeholder.remove();
            list.insertAdjacentHTML('beforeend', checkRowHTML(null));

        function updateCheckRowVisibility(sel) {
            const row = sel.closest('.check-row');
            if (!row) return;
            const t = sel.value;
            row.dataset.evalType = t;
            const expected = row.querySelector('.chk-expected');
            const substr = row.querySelector('.chk-substr');
            const lenWrap = row.querySelector('.chk-length');
            if (expected) expected.style.display = (t === 'exact' || t === 'llm_judge') ? '' : 'none';
            if (substr) substr.style.display = (t === 'contains' || t === 'not_contains') ? '' : 'none';
            if (lenWrap) lenWrap.style.display = (t === 'length') ? 'flex' : 'none';
        }
        function collectChecks() {
            const list = document.getElementById('ceChecksList');
            if (!list) return null;
            const rows = list.querySelectorAll('.check-row');
            if (rows.length === 0) return null;
            const checks = [];
            rows.forEach(r => {
                const name = r.querySelector('.chk-name')?.value.trim();
                if (!name) return; // 跳过无 name 的行
                const type = r.querySelector('.chk-type')?.value;
                const field = r.querySelector('.chk-field')?.value.trim() || '';
                const expected = r.querySelector('.chk-expected')?.value || null;
                const evalParams = {};
                if (type === 'contains' || type === 'not_contains') {
                    const s = r.querySelector('.chk-substr')?.value;
                    if (s !== null) evalParams.substring = s;
                } else if (type === 'length') {
                    const mn = r.querySelector('.chk-len-min')?.value;
                    const mx = r.querySelector('.chk-len-max')?.value;
                    if (mn !== '') evalParams.min = parseInt(mn, 10);
                    if (mx !== '') evalParams.max = parseInt(mx, 10);
                }
                checks.push({ name, field, eval_type: type, expected, eval_params: evalParams });
            });
            return checks.length ? checks : null;
        }

        // U-10: validations 列表编辑器（input 组与验证组对称化的新结构）
        // 与 checks 的关键差异：llm_judge 用 output_requirement（与 expected 平级），不再复用 expected
        function validationRowHTML(v) {
            v = v || { name: '', field: '', eval_type: 'exact', expected: '', output_requirement: '', eval_params: {} };
            // W-6 补充：field 默认回填 `output` 保留字（与 input 组首行 `input` 对称）；旧数据 field 空也回填
            const fieldVal = v.field || 'output';
            const epSubstr = v.eval_params?.substring || '';
            const epMin = v.eval_params?.min ?? '';
            const epMax = v.eval_params?.max ?? '';
            const expectedVisible = v.eval_type === 'exact';
            const containsVisible = v.eval_type === 'contains' || v.eval_type === 'not_contains';
            const lengthVisible = v.eval_type === 'length';
            const judgeVisible = v.eval_type === 'llm_judge';
            return `
                <div class="check-row val-row" data-eval-type="${escapeHtml(v.eval_type)}">
                    <input type="text" class="form-input val-field" value="${escapeHtml(fieldVal)}" placeholder="字段（output = 主输出；如 result / a.b.c）">
                    <select class="form-input val-type" onchange="updateValidationRowVisibility(this)">
                        ${CHECK_EVAL_TYPES.map(t => `<option value="${t.value}" ${v.eval_type === t.value ? 'selected' : ''}>${escapeHtml(t.label)}</option>`).join('')}
                    </select>
                    <div class="chk-params">
                        <input type="text" class="form-input val-expected" value="${escapeHtml(v.expected || '')}" placeholder="expected（期望值）"
                               style="${expectedVisible ? '' : 'display:none;'}">
                        <input type="text" class="form-input val-output-requirement" value="${escapeHtml(v.output_requirement || '')}" placeholder="output_requirement（评判标准）"
                               style="${judgeVisible ? '' : 'display:none;'}">
                        <input type="text" class="form-input val-substr" value="${escapeHtml(epSubstr)}" placeholder="substring 子串"
                               style="${containsVisible ? '' : 'display:none;'}">
                        <div class="chk-length val-length" style="display: ${lengthVisible ? 'flex' : 'none'}; gap: 4px;">
                            <input type="number" class="form-input val-len-min" value="${epMin}" placeholder="min" style="width: 50%;">
                            <input type="number" class="form-input val-len-max" value="${epMax}" placeholder="max" style="width: 50%;">
                        </div>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="this.closest('.val-row').remove()" title="删除">×</button>
                </div>
            `;
        }
        function initValidationRows(validations) {
            const list = document.getElementById('ceValidationsList');
            if (!list) return;
            list.innerHTML = '';
            if (!validations || validations.length === 0) {
                list.innerHTML = '<div style="font-size:11px;color:var(--ink-4);">无 validation，保存时由上方旧字段合成主验证 + checks</div>';
            } else {
                validations.forEach(v => list.insertAdjacentHTML('beforeend', validationRowHTML(v)));
            }
        }
        function addValidationRow() {
            const list = document.getElementById('ceValidationsList');
            if (!list) return;
            const placeholder = list.querySelector('div[style*="无 validation"]');
            if (placeholder) placeholder.remove();
            list.insertAdjacentHTML('beforeend', validationRowHTML(null));
        }
        function updateValidationRowVisibility(sel) {
            const row = sel.closest('.val-row');
            if (!row) return;
            const t = sel.value;
            row.dataset.evalType = t;
            const expected = row.querySelector('.val-expected');
            const outputReq = row.querySelector('.val-output-requirement');
            const substr = row.querySelector('.val-substr');
            const lenWrap = row.querySelector('.val-length');
            // 仅 exact 用 expected；contains/not_contains 用 substring；length 用 min/max；llm_judge 用 output_requirement
            if (expected) expected.style.display = (t === 'exact') ? '' : 'none';
            if (outputReq) outputReq.style.display = (t === 'llm_judge') ? '' : 'none';
            if (substr) substr.style.display = (t === 'contains' || t === 'not_contains') ? '' : 'none';
            if (lenWrap) lenWrap.style.display = (t === 'length') ? 'flex' : 'none';
        }
        function collectValidations() {
            const list = document.getElementById('ceValidationsList');
            if (!list) return null;
            const rows = list.querySelectorAll('.val-row');
            if (rows.length === 0) return null;
            const validations = [];
            rows.forEach((r, i) => {
                // O-1: validation 不再有名称字段（仅 field/type/expected/判据）
                const type = r.querySelector('.val-type')?.value;
                const field = r.querySelector('.val-field')?.value.trim() || '';
                // 仅 exact 用 expected；其余类型用各自的 eval_params / output_requirement
                let expected = null;
                if (type === 'exact') {
                    expected = r.querySelector('.val-expected')?.value || null;
                }
                const outputReq = r.querySelector('.val-output-requirement')?.value || null;
                const evalParams = {};
                if (type === 'contains' || type === 'not_contains') {
                    const s = r.querySelector('.val-substr')?.value;
                    if (s !== null && s !== '') evalParams.substring = s;
                } else if (type === 'length') {
                    const mn = r.querySelector('.val-len-min')?.value;
                    const mx = r.querySelector('.val-len-max')?.value;
                    if (mn !== '') evalParams.min = parseInt(mn, 10);
                    if (mx !== '') evalParams.max = parseInt(mx, 10);
                }
                // 跳过完全空的行（无 field/expected/output_requirement/eval_params）
                const hasEvalParams = Object.keys(evalParams).length > 0;
                if (!field && !expected && !outputReq && !hasEvalParams) return;
                validations.push({ field, eval_type: type, expected, output_requirement: outputReq, eval_params: evalParams });
            });
            return validations.length ? validations : null;
        }

        // W-6: 从 case 现有字段合成 validations 列表（编辑时统一回填源）
        // 优先级：c.validations（有则原样用） → 旧 eval_type/expected 主校验 + checks 展开
        function synthesizeValidationsFromCase(c) {
            c = c || {};
            if (Array.isArray(c.validations) && c.validations.length > 0) {
                return c.validations.slice();
            }
            const vals = [];
            // 主验证：旧 eval_type + expected / output_requirement / eval_params
            const ep = c.eval_params || {};
            const mainType = c.eval_type || 'exact';
            const main = {
                field: 'output', eval_type: mainType,
                expected: null, output_requirement: null, eval_params: {},
            };
            if (mainType === 'exact') main.expected = c.expected_output || '';
            else if (mainType === 'contains' || mainType === 'not_contains') {
                if (ep.substring) main.eval_params.substring = ep.substring;
            } else if (mainType === 'length') {
                main.eval_params = {};
                if (ep.min !== undefined && ep.min !== null) main.eval_params.min = ep.min;
                if (ep.max !== undefined && ep.max !== null) main.eval_params.max = ep.max;
            } else if (mainType === 'llm_judge') {
                main.output_requirement = c.output_requirement || '';
            }
            vals.push(main);
            // checks 展开为后续 validations（llm_judge 的 expected 转成 output_requirement）
            // W-6 补充：空 field 回填为 `output` 保留字（与主验证对称，向后兼容）
            // O-1: validation 不再有名称字段
            (c.checks || []).forEach(chk => {
                const v = {
                    field: chk.field || 'output', eval_type: chk.eval_type || 'exact',
                    expected: null, output_requirement: null, eval_params: {},
                };
                const cep = chk.eval_params || {};
                if (chk.eval_type === 'llm_judge') {
                    v.output_requirement = chk.expected || '';
                } else {
                    if (chk.eval_type === 'exact') {
                        v.expected = chk.expected || '';
                    }
                    if (chk.eval_type === 'contains' || chk.eval_type === 'not_contains') {
                        if (cep.substring) v.eval_params.substring = cep.substring;
                    } else if (chk.eval_type === 'length') {
                        if (cep.min !== undefined && cep.min !== null) v.eval_params.min = cep.min;
                        if (cep.max !== undefined && cep.max !== null) v.eval_params.max = cep.max;
                    }
                }
                vals.push(v);
            });
            return vals;
        }

        // B-13: 变量 kv 行编辑器（case 编辑器 + 导入表单共用）
        function kvRowHTML(k, v) {
            return `
                <div class="kv-row">
                    <input type="text" class="form-input mono kv-key" value="${escapeHtml(k || '')}" placeholder="键名">

        // W-6: 从行编辑器收集 input + variables
        function collectInputAndVars() {
            const list = document.getElementById('ceInputRows');
            if (!list) return { input: '', variables: null };
            const rows = list.querySelectorAll('.kv-row');
            let input = '';
            const vars = {};
            let anyVar = false;

                if (i === 0) {

                } else {

        // B-13: 从 kv 行收集成 dict（空键跳过；全空返回 null）
        function collectKvRows(listId) {

            const rows = list.querySelectorAll('.kv-row');

        function toggleCaseEditorFields() {
            const type = document.getElementById('ceEvalType')?.value;
            if (!type) return;
            const setDisplay = (id, show) => {
                const el = document.getElementById(id);
                if (el) el.style.display = show ? '' : 'none';
            };
            setDisplay('ceExactGroup', type === 'exact');
            setDisplay('ceContainsGroup', type === 'contains' || type === 'not_contains');
            setDisplay('ceLengthGroup', type === 'length');
            setDisplay('ceJudgeGroup', type === 'llm_judge');
        }

        async function saveCaseFromEditor(evalsetId, projectId, caseId) {
            const caseName = document.getElementById('ceCaseName').value.trim();
            // W-6: 从统一行编辑器收集 input + variables
            const { input, variables } = collectInputAndVars();
            if (!caseName) { showToast('请填写 case_name', 'error'); return; }
            if (!input) { showToast('请填写 input', 'error'); return; }

            // W-8: task_shape 不再在 UI 收集（保留模型字段，零迁移）
            const taskShape = null;
            // O-2: 标签从 chips 交互收集（state.editorTags）
            const tags = (state.editorTags || []).slice();
            // O-6: 标签全局唯一——编辑器新打的标签自动进全局标签库
            const existingSet = new Set(window._allExistingTags || []);
            for (const t of tags) {
                if (!existingSet.has(t)) {
                    try {
                        await api('/tags', { method: 'POST', body: JSON.stringify({ name: t }) });
                        existingSet.add(t);
                    } catch (e) {
                        // 重名（并发创建）或其他错误：忽略，标签仍写入 case.tags
                    }
                }
            }
            // W-6: validations 作为唯一数据源（不再读旧 eval_type select / expected / checks 区）
            const validations = collectValidations() || [];
            if (validations.length === 0) { showToast('请至少添加 1 条主输出 validation', 'error'); return; }

            // 兼容字段回填：validations[0] → 旧 eval_type/expected_output/output_requirement/eval_params
            // validations[1:] → checks
            const main = validations[0];
            const evalType = main.eval_type || 'exact';
            const mainEp = main.eval_params || {};
            let expectedOutput = null, outputRequirement = null, evalParams = {};
            if (evalType === 'exact') expectedOutput = main.expected || '';
            else if (evalType === 'contains' || evalType === 'not_contains') {
                evalParams.substring = mainEp.substring || '';
                expectedOutput = null;
            } else if (evalType === 'length') {
                evalParams = {};
                if (mainEp.min !== undefined && mainEp.min !== null) evalParams.min = mainEp.min;
                if (mainEp.max !== undefined && mainEp.max !== null) evalParams.max = mainEp.max;
            } else if (evalType === 'llm_judge') {
                outputRequirement = main.output_requirement || '';
            }
            // checks = validations[1:]（llm_judge 用 expected 存 output_requirement，兼容旧 checks 格式）
            // O-1: validation 不再有名称字段
            const checks = validations.slice(1).map(v => {
                const check = {
                    field: v.field || '',
                    eval_type: v.eval_type || 'exact',
                    expected: '',
                    eval_params: v.eval_params || {},
                };
                if (v.eval_type === 'llm_judge') {
                    check.expected = v.output_requirement || '';
                } else if (v.eval_type === 'exact') {
                    check.expected = v.expected || '';
                }
                return check;
            });

            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = evalset.cases || [];
                const idx = cases.findIndex(c => c.id === caseId);
                const newCase = {
                    id: caseId,
                    case_name: caseName,
                    input,
                    expected_output: expectedOutput,
                    output_requirement: outputRequirement,
                    eval_type: evalType,
                    eval_params: evalParams,
                    task_shape: taskShape,
                    variables: variables,
                    tags: tags,
                    checks: checks.length ? checks : null,
                    validations: validations,
                    enabled: idx >= 0 ? cases[idx].enabled : true
                };
                if (idx >= 0) {
                    cases[idx] = newCase;
                } else {
                    cases.push(newCase);
                }
                await api(`/evalsets/${evalsetId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ ...evalset, cases })
                });
                closeModal('caseEditorModal');
                showToast(idx >= 0 ? '已更新用例' : '已新增用例');
                switchTab('evalsets');
            } catch (err) {}
        }

        // B-5: 用例硬删除（红色入口 + 二次确认 + 影响说明）
        function showDeleteCaseModal(evalsetId, projectId, caseId) {
            // 从 state.currentEvalsets 查 case_name，避免在 HTML 属性里拼接用户输入（XSS 风险）
            const evalset = (state.currentEvalsets || []).find(e => e.id === evalsetId);

        async function confirmDeleteCase(evalsetId, projectId, caseId) {
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = (evalset.cases || []).filter(c => c.id !== caseId);
                await api(`/evalsets/${evalsetId}`, {

                <div class="card mb-4">

                        设置单次 run 的 token 预算上限（成本 = target_token + judge_token）。
                        关闭 warn_only 时超预算会中断评测，剩余 case 标记为 skipped（不计入 pass_rate 分母）。

                        <label class="form-label">limit（token 上限，留空 = 不限）</label>

                <div class="card mb-4">

                    <div style="padding: 0 0 12px; color: var(--ink-4); font-size: 12px;">
                        T3-1: 设置项目级最大并发数。发起评测时可在 run 级选 ≤ 此值的并发；
                        并发会引入延迟噪声，性能指标卡会标注「在 N 并发下采集，仅参考」。

            // 渲染认证字段（首次进入）

            // B-7: 初始化响应解析行编辑器（从 rp 数据填充）
            initRpPathLists(rp);
            // T2-3/REQ-15: 加载配置模板列表到下拉菜单
            refreshTargetTplList();
            // REQ-16: 加载全局 Judge 配置列表到下拉选择器
            refreshJudgeConfigSelect();

            // T1-6: 配置页初始化完成后，建立 dirty 基准快照并绑定字段监听
            // _suppressDirtyCheck 防止初始化期间 toggleApiMode 等触发 change 误报 dirty
            state._suppressDirtyCheck = true;
            state._configSnapshot = JSON.stringify(collectConfigSnapshot());
            state._configDirty = false;
            // 重新渲染配置页时清除可能残留的 dirty 圆点（保存后切回 config 走的就是这条路径）
            removeConfigDirtyDot();
            bindConfigDirtyListeners();
            // 下一个事件循环再放开监听，避免初始化触发的 change 被吞掉后又被误报
            setTimeout(() => { state._suppressDirtyCheck = false; }, 0);
        }

        // T1-6: 绑定配置页字段的 change/input 事件 → markConfigDirtyIfChanged
        // 绑定到 #tabContent 容器，依赖事件冒泡；过滤只在 config tab 上生效
        let _configDirtyBound = false;
        function bindConfigDirtyListeners() {
            if (_configDirtyBound) return;
            const container = document.getElementById('tabContent');
            if (!container) return;
            container.addEventListener('input', (e) => {
                if (!isInConfigTab()) return;
                const t = e.target;
                if (!t || !t.closest) return;
                // 只关心表单字段
                if (!t.matches('input, textarea, select')) return;
                markConfigDirtyIfChanged();
            });
            container.addEventListener('change', (e) => {
                if (!isInConfigTab()) return;
                const t = e.target;
                if (!t || !t.closest) return;
                if (!t.matches('input, textarea, select')) return;
                markConfigDirtyIfChanged();
            });
            _configDirtyBound = true;
        }
        function isInConfigTab() {
            const tab = document.querySelector('.tab[data-tab="config"]');
            return !!tab && tab.classList.contains('active');
        }

        // B-6: API 模式切换时调整字段提示
        function toggleApiMode() {
            const mode = document.getElementById('targetApiType')?.value;
            const modelGroup = document.getElementById('modelGroup');
            const modelRequired = document.getElementById('modelRequired');
            const templateHint = document.getElementById('templateHint');
            if (!mode) return;
            if (mode === 'custom') {
                if (modelRequired) modelRequired.style.display = 'none';
                if (templateHint) templateHint.textContent = '（必填，JSON 格式，不注入 model/messages）';
                if (modelGroup) modelGroup.querySelector('label').firstChild.textContent = 'model（可选） ';
            } else {
                if (modelRequired) modelRequired.style.display = '';
                if (templateHint) templateHint.textContent = '（留空 {input} = 默认 OpenAI 格式）';
                if (modelGroup) modelGroup.querySelector('label').firstChild.textContent = 'model ';
            }
            // REQ-11: 统一描述文案
            const descEl = document.getElementById('targetApiModeDesc');
            if (descEl) {
                descEl.textContent = mode === 'custom'
                    ? '任意 HTTP JSON 接口。需请求模板；不注入 model/messages，请求体完全由模板决定。'
                    : '标准模型接口（OpenAI 风格）。需 base_url + model；api_key 可留空（无认证头）。';
            }
        }

        function renderAuthFields(projectId) {
            const container = document.getElementById('authFields');
            if (!container) return;
            const type = document.getElementById('authType').value;
            const auth = state._auth || { type: 'none' };
            // 切换类型时保留同名字段，其它清空
            const isMasked = v => v && typeof v === 'object' && v.masked === true;
            const MASK_PLACEHOLDER = '••••••••';
            const secretInput = (id, value) => {
                const masked = isMasked(value);
                const val = masked ? MASK_PLACEHOLDER : escapeHtml(value || '');
                return `<input type="password" class="form-input mono" value="${val}" id="${id}" data-masked="${masked ? 'true' : 'false'}" oninput="this.dataset.masked='false'">`;
            };

            let html = '';
            if (type === 'bearer') {
                html = `
                    <div class="form-group">
                        <label class="form-label">bearer_token</label>
                        ${secretInput('authBearerToken', auth.bearer_token)}
                    </div>
                `;
            } else if (type === 'api_key') {
                html = `
                    <div class="form-group">
                        <label class="form-label">header 名</label>
                        <input type="text" class="form-input mono" value="${escapeHtml(auth.api_key_header || 'X-API-Key')}" id="authApiKeyHeader">
                    </div>
                    <div class="form-group">
                        <label class="form-label">api_key 值</label>
                        ${secretInput('authApiKeyValue', auth.api_key_value)}
                    </div>
                `;
            } else if (type === 'cookie') {
                const cookies = Array.isArray(auth.cookies) ? auth.cookies : [];
                html = `
                    <div class="form-group">
                        <label class="form-label">Cookies（每行一个 name=value）</label>
                        <textarea class="form-input mono" id="authCookies" placeholder="session=abc">${escapeHtml(cookies.map(c => `${c.name}=${isMasked(c.value) ? '••••••••' : (c.value || '')}`).join('\n'))}</textarea>
                        <div style="margin-top: 4px; font-size: 11px; color: var(--ink-4);">掩码值将自动用 __UNCHANGED__ 保留</div>
                    </div>
                `;
            } else if (type === 'headers') {
                const headers = Array.isArray(auth.headers) ? auth.headers : [];
                html = `
                    <div class="form-group">
                        <label class="form-label">自定义 Headers（每行 name: value）</label>
                        <textarea class="form-input mono" id="authHeaders" placeholder="X-Env: test">${escapeHtml(headers.map(h => `${h.name}: ${h.value || ''}`).join('\n'))}</textarea>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // 工具：从带 data-masked 的输入读取值，掩码时返回哨兵
        function readSecret(id) {
            const el = document.getElementById(id);
            if (!el) return '';
            if (el.dataset.masked === 'true') return '__UNCHANGED__';
            return el.value;
        }

        function collectAuth() {
            const type = document.getElementById('authType').value;
            const auth = { type, bearer_token: null, api_key_header: 'X-API-Key', api_key_value: null, cookies: [], headers: [] };
            if (type === 'bearer') {
                auth.bearer_token = readSecret('authBearerToken') || null;
            } else if (type === 'api_key') {
                auth.api_key_header = document.getElementById('authApiKeyHeader')?.value || 'X-API-Key';
                auth.api_key_value = readSecret('authApiKeyValue') || null;
            } else if (type === 'cookie') {
                const lines = (document.getElementById('authCookies')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
                auth.cookies = lines.map((line, i) => {
                    const idx = line.indexOf('=');
                    const name = idx >= 0 ? line.slice(0, idx).trim() : line;
                    const value = idx >= 0 ? line.slice(idx + 1).trim() : '';
                    // 用户没改掩码占位 → 哨兵
                    const oldValue = (state._auth?.cookies || [])[i]?.value;
                    const wasMasked = oldValue && typeof oldValue === 'object' && oldValue.masked === true;
                    return { name, value: wasMasked && value === '••••••••' ? '__UNCHANGED__' : value };
                });
            } else if (type === 'headers') {
                const lines = (document.getElementById('authHeaders')?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
                auth.headers = lines.map(line => {
                    const idx = line.indexOf(':');
                    return { name: idx >= 0 ? line.slice(0, idx).trim() : line, value: idx >= 0 ? line.slice(idx + 1).trim() : '' };
                });
            }
            return auth;
        }

        // B-7: 响应解析行编辑器 + JSON 树点选
        // 当前激活的路径目标：'output_paths' | 'token_paths' | 'token_fields' | null
        // 用户点 input 聚焦时设值，点 JSON 树节点时按此目标填入

        const RP_LIST_IDS = {
            output_paths: 'rpOutputPathsList',
            token_paths: 'rpTokenPathsList',
            token_fields: 'rpTokenFieldsList'
        };

        function initRpPathLists(rp) {
            state._rpActiveTarget = null;
            state._rpSample = state._rpSample || '';
            // 填充 output_paths

        // ============== JSON 树渲染 + 点选生成路径 ==============

        function parseSampleToTree() {
            const sample = document.getElementById('parsingSample')?.value.trim();
            const treeDiv = document.getElementById('jsonTree');
            const container = document.getElementById('jsonTreeContainer');
            if (!sample) { showToast('请先粘贴样例响应', 'warning'); return; }
            let data;
            try {
                data = JSON.parse(sample);
            } catch (e) {
                showToast('JSON 解析失败: ' + e.message, 'error');
                container.style.display = 'none';
                return;
            }
            state._rpSample = sample;
            treeDiv.innerHTML = renderJsonTree(data, '$');
            container.style.display = 'block';
            // 事件委托：点击 [data-path] 节点 → 生成路径；点击 [data-toggle] → 折叠
            treeDiv.onclick = e => {
                const toggler = e.target.closest('[data-toggle]');
                if (toggler) {
                    const children = toggler.nextElementSibling;
                    if (children && children.classList.contains('jt-children')) {
                        children.classList.toggle('jt-hidden');
                        toggler.classList.toggle('jt-collapsed');
                    }
                    return;
                }
                const node = e.target.closest('[data-path]');
                if (node) pickJsonPath(node.dataset.path);
            };
        }

        // 递归渲染 JSON 节点。path 是当前节点的 JSONPath
        function renderJsonTree(node, path) {
            if (node === null) {
                return `<span class="jt-leaf jt-null" data-path="${escapeHtml(path)}">null</span>`;
            }
            if (typeof node !== 'object') {
                const type = typeof node;
                const cls = type === 'string' ? 'jt-string' : (type === 'boolean' ? 'jt-boolean' : 'jt-number');
                const display = type === 'string' ? `"${escapeHtml(node)}"` : escapeHtml(String(node));
                return `<span class="jt-leaf ${cls}" data-path="${escapeHtml(path)}">${display}</span>`;
            }
            const isArray = Array.isArray(node);
            const entries = isArray
                ? node.map((v, i) => [i, v])
                : Object.entries(node);
            if (entries.length === 0) {
                return `<span class="jt-bracket">${isArray ? '[]' : '{}'}</span>`;
            }
            const children = entries.map(([k, v]) => {
                let childPath;
                if (isArray) {
                    childPath = `${path}[${k}]`;
                } else if (/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(String(k))) {
                    childPath = `${path}.${k}`;
                } else {
                    childPath = `${path}['${String(k).replace(/'/g, "\\'")}']`;
                }
                const preview = (v === null || typeof v !== 'object')
                    ? ''
                    : ` <span class="jt-preview">${escapeHtml(Array.isArray(v) ? `[${v.length} 项]` : `{${Object.keys(v).length} 键}`)}</span>`;
                return `<div class="jt-row">
                    <span class="jt-key" data-path="${escapeHtml(childPath)}">${escapeHtml(String(k))}:</span>
                    ${renderJsonTree(v, childPath)}
                    ${preview}
                </div>`;
            }).join('');
            const open = isArray ? '[' : '{';
            const close = isArray ? ']' : '}';
            return `<span class="jt-bracket" data-toggle="1" data-path="${escapeHtml(path)}">${open}</span>
                <div class="jt-children">${children}</div>
                <span class="jt-bracket">${close}</span>`;
        }

        function pickJsonPath(path) {
            const target = state._rpActiveTarget;
            if (!target) {
                showToast('请先点击上方的路径输入框选中目标', 'warning');
                return;
            }
            // token_fields 目标：把 $.a.b 转成末段字段名（用户可手改）
            let value = path;
            if (target === 'token_fields') {
                const m = path.match(/\.([A-Za-z_$][A-Za-z0-9_$]*)$/);
                if (m) value = m[1];
                else if (path !== '$') value = path.replace(/^\$\.?|^\$/, '').replace(/^\['/, '').replace(/'\]$/, '');
            }
            // 优先填当前聚焦的 input
            const active = document.activeElement;
            if (active && active.classList && active.classList.contains('rp-path-input') && active.closest('#' + RP_LIST_IDS[target])) {
                active.value = value;
                active.focus();
                return;
            }
            // 找第一个空 input 填入
            const list = document.getElementById(RP_LIST_IDS[target]);
            if (!list) return;
            const inputs = Array.from(list.querySelectorAll('.rp-path-input'));
            const empty = inputs.find(i => !i.value.trim());
            if (empty) {
                empty.value = value;
                empty.focus();
                return;
            }
            // 没空 input → 新增一行
            addRpPathRow(target, value);
            const last = list.querySelector('.rp-path-row:last-child .rp-path-input');
            if (last) last.focus();
        }

        function collectResponseParsing() {
            const readList = target => {
                const listId = RP_LIST_IDS[target];
                const list = document.getElementById(listId);
                if (!list) return [];
                return Array.from(list.querySelectorAll('.rp-path-input'))
                    .map(i => i.value.trim()).filter(Boolean);
            };
            const scopeRaw = document.getElementById('rpTokenScope')?.value.trim();
            let tokenScope = null;
            if (scopeRaw) {
                try { tokenScope = JSON.parse(scopeRaw); }
                catch (e) { /* 留空，save 时由后端兜底；test 时单独报错 */ }
            }
            const mode = document.querySelector('input[name="rpTokenMode"]:checked')?.value || 'none';
            const unpackEl = document.getElementById('rpOutputUnpackJson');
            const fieldEl = document.getElementById('rpOutputField');
            return {
                output_paths: readList('output_paths'),
                token_paths: mode === 'paths' ? readList('token_paths') : [],
                token_fields: mode === 'fields' ? readList('token_fields') : [],
                token_scope: tokenScope,
                output_unpack_json: unpackEl ? unpackEl.checked : false,
                output_field: (fieldEl && fieldEl.value.trim()) ? fieldEl.value.trim() : null
            };
        }

        // B-14: 开关 content 解包时联动显示 output_field 输入
        function toggleRpUnpackField() {
            const cb = document.getElementById('rpOutputUnpackJson');
            const grp = document.getElementById('rpOutputFieldGroup');

        // P2-6: 收集 token_budget（limit 留空 = null = 不限预算）
        function collectTokenBudget() {
            const limitEl = document.getElementById('budgetLimit');
            const warnEl = document.getElementById('budgetWarnOnly');
            if (!limitEl) return state.currentProject?.token_budget || null;
            const raw = limitEl.value.trim();
            if (!raw) return null;
            const limit = parseInt(raw, 10);
            if (isNaN(limit) || limit < 0) return null;
            return {
                limit,
                warn_only: warnEl ? warnEl.checked : true
            };
        }

                                        const dprColor = dpr > 0 ? 'var(--green)' : dpr < 0 ? 'var(--red)' : 'var(--ink-4)';
                                        const dtColor = dt > 0 ? 'var(--red)' : dt < 0 ? 'var(--green)' : 'var(--ink-4)';
                                        const dprSign = dpr > 0 ? '+' : '';
                                        const dtSign = dt > 0 ? '+' : '';
                                        return `
                                        <tr>
                                            <td><strong>${escapeHtml(r.version_name)}</strong></td>
                                            <td class="num">${r.run_count}</td>
                                            <td class="num">${(r.pass_rate * 100).toFixed(1)}%</td>
                                            <td class="num" style="color: ${dprColor};">${r.delta_pass_rate !== undefined ? dprSign + (dpr * 100).toFixed(1) + '%' : '-'}</td>
                                            <td class="num">${formatNumber(r.total_token)}</td>
                                            <td class="num" style="color: ${dtColor};">${r.delta_total_token !== undefined ? dtSign + formatNumber(dt) : '-'}</td>
                                            <td class="num">${r.latency_p50 ? (r.latency_p50 / 1000).toFixed(1) + 's' : '-'}</td>
                                        </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }
            } catch (err) {
                compareEl.innerHTML = `<div style="color: var(--red); font-size: 13px;">对比数据加载失败: ${escapeHtml(err.message)}</div>`;
            }
        }
