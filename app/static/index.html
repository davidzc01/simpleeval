            showJudgeConfigEditorModal(sel.value);
        }

        // T2-3/REQ-15: 加载配置模板列表到下拉菜单
        async function refreshTargetTplList() {
            const listEl = document.getElementById('tplDropdownList');
            if (!listEl) return;
            try {
                const data = await api('/config-templates');
                const templates = data.templates || [];
                if (templates.length === 0) {
                    listEl.innerHTML = '<div style="padding: 8px 12px; font-size: 12px; color: var(--ink-4);">暂无模板</div>';
                } else {
                    listEl.innerHTML = templates.map(t => `
                        <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px;">
                            <button class="btn btn-sm" style="flex: 1; text-align: left; padding: 4px 8px; background: transparent; border: none; color: var(--ink-2); font-size: 12px;" onclick="loadTargetTemplateById('${escapeHtml(t.id)}', state.currentProject?.id || '')" title="加载模板到当前表单">
                                📥 ${escapeHtml(t.name)}
                            </button>
                            <button class="btn btn-sm" style="padding: 2px 6px; background: transparent; border: none; color: var(--red); font-size: 14px;" onclick="deleteTargetTemplateById('${escapeHtml(t.id)}', '${escapeHtml(t.name)}')" title="删除模板">✕</button>
                        </div>
                    `).join('');
                }
            } catch (e) { /* 静默失败 */ }
        }

        // REQ-15: 模板下拉菜单开关
        function toggleTplDropdown(ev) {
            ev.stopPropagation();
            const menu = document.getElementById('tplDropdownMenu');
            if (!menu) return;
            const isOpen = menu.style.display !== 'none';
            menu.style.display = isOpen ? 'none' : '';
            if (!isOpen) {
                refreshTargetTplList();
                // 点击外部关闭
                setTimeout(() => {
                    document.addEventListener('click', closeTplDropdownOnOutside, { once: true });
                }, 0);
            }
        }

        function closeTplDropdownOnOutside(ev) {
            const menu = document.getElementById('tplDropdownMenu');
            const wrapper = document.querySelector('.tpl-dropdown-wrapper');
            if (menu && menu.style.display !== 'none' && !wrapper?.contains(ev.target)) {
                menu.style.display = 'none';
            }
        }

        // REQ-17: 保存模板弹窗（名称输入 + 同名覆盖确认）
        function showSaveTemplateModal(projectId) {
            document.getElementById('tplDropdownMenu').style.display = 'none';
            const modalId = 'saveTemplateModal';
            const existing = document.getElementById(modalId);
            if (existing) existing.remove();
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = modalId;
            modal.innerHTML = `
                <div class="modal">
                <div class="modal-header">
                    <span class="modal-title">保存为配置模板</span>
                    <button class="modal-close" onclick="closeModal('${modalId}')">×</button>
                </div>
                <div style="padding: 16px;">
                    <div class="form-group">
                        <label class="form-label">模板名称 <span style="color: var(--red);">*</span></label>
                        <input type="text" class="form-input" id="tplNameInput" placeholder="如：FastGPT-企业提取" style="width: 100%;">
                        <div id="tplNameError" style="font-size: 12px; color: var(--red); margin-top: 4px; display: none;"></div>
                    </div>
                    <div style="font-size: 12px; color: var(--ink-4); margin-bottom: 12px;">
                        将保存当前项目的 Target API 配置（base_url/api_type/auth/request_template/response_parsing），<br>
                        api_key 等敏感字段也会保存（便于跨项目引用，加载时提示手动补 key）。
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: flex-end;">
                        <button class="btn btn-secondary" onclick="closeModal('${modalId}')">取消</button>
                        <button class="btn btn-primary" id="tplSaveBtn" onclick="confirmSaveTemplate('${projectId}')">保存</button>
                    </div>
                </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => document.getElementById('tplNameInput')?.focus(), 50);
        }

        async function confirmSaveTemplate(projectId) {
            const nameInput = document.getElementById('tplNameInput');
            const name = nameInput?.value?.trim() || '';
            const errEl = document.getElementById('tplNameError');
            if (!name) {
                if (errEl) { errEl.textContent = '模板名称必填'; errEl.style.display = ''; }
                nameInput?.focus();
                return;
            }
            // 检查同名
            let existingId = null;
            try {
                const data = await api('/config-templates');
                const match = (data.templates || []).find(t => t.name === name);
                if (match) existingId = match.id;
            } catch (e) {}
            if (existingId) {
                if (!window.confirm(`已存在名为「${name}」的模板，是否覆盖？`)) return;
            }
            try {
                const fd = new FormData();
                fd.append('name', name);
                const res = await fetch(`/api/config-templates?project_id=${encodeURIComponent(projectId)}`, {
                    method: 'POST',
                    body: fd
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err?.detail?.error?.message || err?.detail || `保存失败 (${res.status})`);
                }
                showToast('模板已保存');
                closeModal('saveTemplateModal');
                await refreshTargetTplList();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        // T2-3: 按模板 ID 加载到当前 Target 表单
        async function loadTargetTemplateById(tplId, projectId) {
            document.getElementById('tplDropdownMenu').style.display = 'none';
            try {
                const tpl = await api(`/config-templates/${encodeURIComponent(tplId)}`);
                const tc = tpl.target_config;
                if (!tc) throw new Error('模板无 target_config');
                const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v ?? ''; };
                setVal('targetApiType', tc.api_type || 'openai_compatible');
                setVal('targetBaseUrl', tc.base_url || '');
                setVal('targetModel', tc.model || '');
                setVal('targetTemplate', tc.request_template || '');
                const authEl = document.getElementById('authType');
                if (authEl && tc.auth) {
                    authEl.value = tc.auth.type || 'none';
                    state._auth = JSON.parse(JSON.stringify(tc.auth));
                    renderAuthFields(projectId);
                }
                const rp = tc.response_parsing || { output_paths: [], token_paths: [], token_fields: [], token_scope: null, output_unpack_json: false, output_field: null };
                initRpPathLists(rp);
                const unpackEl = document.getElementById('rpOutputUnpackJson');
                if (unpackEl) unpackEl.checked = !!rp.output_unpack_json;
                setVal('rpOutputField', rp.output_field || '');
                if (typeof toggleRpUnpackField === 'function') toggleRpUnpackField();
                const apiKeyEl = document.getElementById('targetApiKey');
                if (apiKeyEl) { apiKeyEl.value = ''; apiKeyEl.dataset.masked = 'false'; }
                toggleApiMode();
                showToast('模板已加载，api_key 等敏感字段请手动补全', 'info');
                markConfigDirtyIfChanged();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        // T2-3: 按模板 ID 删除
        async function deleteTargetTemplateById(tplId, tplName) {
            document.getElementById('tplDropdownMenu').style.display = 'none';
            if (!window.confirm(`确认删除模板「${tplName}」？此操作不可恢复。`)) return;
            try {
                await api(`/config-templates/${encodeURIComponent(tplId)}`, { method: 'DELETE' });
                showToast('模板已删除');
                await refreshTargetTplList();
                // U-2: 若在配置管理页 templates tab，刷新表格
                const cfgContent = document.getElementById('cfgMgmtContent');
                if (cfgContent) await renderTargetTemplatesTab(cfgContent);
            } catch (e) {
                showToast(e.message, 'error');
            }
        }


        // T1-3: 收集 Judge 配置（auth + response_parsing 从 JSON 文本框解析）
        function collectJudgeConfigExtras() {
            const mode = document.getElementById('judgeApiType')?.value || 'openai_compatible';
            const result = { api_type: mode, auth: { type: 'none' }, response_parsing: null, request_template: null };
            if (mode !== 'custom') return result;
            const tplEl = document.getElementById('judgeRequestTemplate');
            result.request_template = tplEl ? tplEl.value : null;
            // auth JSON
            const authEl = document.getElementById('judgeAuthJson');
            if (authEl && authEl.value.trim()) {
                try {
                    result.auth = JSON.parse(authEl.value);
                } catch (e) {
                    throw new Error('Judge auth 不是合法 JSON: ' + e.message);
                }
            }
            // response_parsing JSON
            const rpEl = document.getElementById('judgeResponseParsingJson');
            if (rpEl && rpEl.value.trim()) {
                try {
                    result.response_parsing = JSON.parse(rpEl.value);
                } catch (e) {
                    throw new Error('Judge response_parsing 不是合法 JSON: ' + e.message);
                }
            }
            return result;
        }

        async function testJudgeConfig(projectId) {
            const resultDiv = document.getElementById('judgeTestResult');
            resultDiv.innerHTML = '<span class="text-muted">测试中...</span>';

            let extras;
            try {
                extras = collectJudgeConfigExtras();
            } catch (e) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(e.message)}</span>`;
                return;
            }

            try {
                const res = await api(`/test/judge?project_id=${encodeURIComponent(projectId)}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        base_url: document.getElementById('judgeBaseUrl').value,
                        api_key: readSecret('judgeApiKey') || '__UNCHANGED__',
                        model: document.getElementById('judgeModel').value,
                        prompt_template: document.getElementById('judgePrompt').value,
                        input: '测试输入',
                        output_requirement: '测试要求',
                        actual_output: '测试输出',
                        api_type: extras.api_type,
                        request_template: extras.request_template,
                        auth: extras.auth,
                        response_parsing: extras.response_parsing
                    })
                });

                if (res.ok) {
                    resultDiv.innerHTML = `<span style="color: var(--green);">✓ 得分: ${res.score} · ${res.passed ? '通过' : '不通过'}${res.token_used ? ' · ' + res.token_used + ' tokens' : ''}</span>`;
                } else {
                    resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(res.error?.message || '失败')}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color: var(--red);">✗ ${escapeHtml(err.message)}</span>`;
            }
        }

        async function saveProjectConfig(projectId) {
            // T1-3: 收集 Judge 双模式字段（可能抛出 JSON 解析错误）
            let judgeExtras;
            try {
                judgeExtras = collectJudgeConfigExtras();
            } catch (e) {
                showToast(e.message, 'error');
                return;
            }
            const config = {
                id: projectId,
                name: state.currentProject.name,
                task_shape: state.currentProject.task_shape,
                judge_config: {
                    api_type: judgeExtras.api_type,
                    base_url: document.getElementById('judgeBaseUrl').value,
                    api_key: readSecret('judgeApiKey') || '__UNCHANGED__',
                    model: document.getElementById('judgeModel').value || null,
                    request_template: judgeExtras.request_template,
                    auth: judgeExtras.auth,
                    response_parsing: judgeExtras.response_parsing,
                    prompt_template: document.getElementById('judgePrompt').value,
                },
                judge_config_id: document.getElementById('judgeConfigIdSelect')?.value || null,
                target_config: {
                    api_type: document.getElementById('targetApiType').value,
                    base_url: document.getElementById('targetBaseUrl').value,
                    api_key: readSecret('targetApiKey') || '__UNCHANGED__',
                    model: document.getElementById('targetModel').value || null,
                    request_template: document.getElementById('targetTemplate').value,
                    auth: collectAuth(),
                    response_mapping: [],
                    response_parsing: collectResponseParsing()
                },
                token_budget: collectTokenBudget(),
                max_concurrency: parseInt(document.getElementById('maxConcurrency')?.value || '1', 10) || 1,
                schedule: collectSchedule()
            };

            try {
                const updated = await api(`/projects/${projectId}`, {
                    method: 'PUT',
                    body: JSON.stringify(config)
                });
                // 更新本地缓存，让后续操作看到最新掩码状态
                state.currentProject = updated;
                // T1-6: 保存后清除 dirty 标记
                state._configDirty = false;
                state._configSnapshot = JSON.stringify(collectConfigSnapshot());
                showToast('保存成功');
                // 重新渲染配置页，把掩码状态刷新（用户改过的字段恢复为 masked 占位）
                switchTab('config');
            } catch (err) {}
        }

        // T1-6: 收集当前配置页可序列化字段（用于 dirty 比对）
        function collectConfigSnapshot() {
            // 跳过 secret 字段（masked 状态用户没改 → __UNCHANGED__，不会触发 dirty）
            let judgeExtras = null;
            try { judgeExtras = collectJudgeConfigExtras(); } catch (e) { judgeExtras = { _parseError: e.message }; }
            return {
                target_api_type: document.getElementById('targetApiType')?.value,
                target_base_url: document.getElementById('targetBaseUrl')?.value,
                target_api_key: readSecret('targetApiKey'),
                target_model: document.getElementById('targetModel')?.value,
                target_template: document.getElementById('targetTemplate')?.value,
                target_auth: collectAuth(),
                target_rp: collectResponseParsing(),
                judge_api_type: document.getElementById('judgeApiType')?.value,
                judge_base_url: document.getElementById('judgeBaseUrl')?.value,
                judge_api_key: readSecret('judgeApiKey'),
                judge_model: document.getElementById('judgeModel')?.value,
                judge_template: document.getElementById('judgeRequestTemplate')?.value,
                judge_auth_json: document.getElementById('judgeAuthJson')?.value,
                judge_rp_json: document.getElementById('judgeResponseParsingJson')?.value,
                judge_prompt: document.getElementById('judgePrompt')?.value,
                judge_config_id: document.getElementById('judgeConfigIdSelect')?.value,
                budget_limit: document.getElementById('budgetLimit')?.value,
                budget_warn_only: document.getElementById('budgetWarnOnly')?.checked,
                max_concurrency: document.getElementById('maxConcurrency')?.value,
                _judgeExtras: judgeExtras
            };
        }

        // 收集定时回归配置（配置页不再有旧面板；保持原 schedule 不变）
        // 唯一配置入口在「定时任务」页（PUT /projects/{id}/schedule）
        function collectSchedule() {
            return state.currentProject?.schedule || null;
        }

        function updateScheduleToggle() { /* 空实现，配置页不再有旧面板 */ }

        // T1-6: 比较当前快照与初始快照，返回 dirty 状态
        function isConfigDirty() {
            if (!state._configSnapshot) return false;
            const current = JSON.stringify(collectConfigSnapshot());
            return current !== state._configSnapshot;
        }

        // T1-6: 触发 dirty 检测更新（配置页字段 change 事件回调）
        function markConfigDirtyIfChanged() {
            if (state._suppressDirtyCheck) return;
            const dirty = isConfigDirty();
            state._configDirty = dirty;
            // 配置 tab 标签上加/移除 dirty 圆点
            const configTab = document.querySelector('.tab[data-tab="config"]');
            if (configTab) {
                const existingDot = configTab.querySelector('.dirty-tab-dot');
                if (dirty && !existingDot) {
                    configTab.insertAdjacentHTML('beforeend', '<span class="dirty-tab-dot"></span>');
                } else if (!dirty && existingDot) {
                    existingDot.remove();
                }
            }
        }

        async function toggleCaseEnabled(evalsetId, projectId, caseId, enabled) {
            try {
                const evalset = await api(`/evalsets/${evalsetId}?project_id=${projectId}`);
                const cases = evalset.cases || [];
                const caseIndex = cases.findIndex(c => c.id === caseId);
                if (caseIndex >= 0) {
                    cases[caseIndex].enabled = enabled;
                    await api(`/evalsets/${evalsetId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ ...evalset, cases })
                    });
                    showToast(enabled ? '已启用' : '已禁用');
                    switchTab('evalsets');
                }
            } catch (err) {}
        }

        async function exportEvalSet(evalsetId, projectId) {
            try {
                const data = await api(`/evalsets/${evalsetId}/export?project_id=${projectId}`);
                downloadCSV(data.content, data.filename);
            } catch (err) {}
        }

        async function exportRun(runId, projectId) {
            try {
                const data = await api(`/runs/${runId}/export?project_id=${projectId}`);
                downloadCSV(data.content, data.filename);
            } catch (err) {}
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function closeModal(id) {
            document.getElementById(id)?.remove();
        }

        // ==================== 工具函数 ====================
        function formatRelativeTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString.replace('Z', '+00:00'));
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            return Math.floor(diff / 86400) + ' 天前';
        }

        function formatNumber(num) {
            if (!num && num !== 0) return '-';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // V-4: run 状态标签化（进行中/已完成/已失败）
        function runStatusBadge(status) {
            const map = {
                queued: { label: '进行中', cls: 'status-running' },
                running: { label: '进行中', cls: 'status-running' },
                completed: { label: '已完成', cls: 'status-passed' },
                failed: { label: '已失败', cls: 'status-failed' },
            };
            const m = map[status] || { label: status, cls: 'status-disabled' };
            return `<span class="status-badge ${m.cls}"><span class="status-dot"></span>${escapeHtml(m.label)}</span>`;
        }

        // V-3: 完整时间戳格式化（YYYY-MM-DD HH:mm）
        function formatTimestamp(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString.replace('Z', '+00:00'));
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        // V-2: 通用三态排序辅助（升序 ▴ / 降序 ▾ / 默认）
        // state 对象上存 _sortKey / _sortDir，点击表头循环三态
        function sortIndicator(colKey, sortKey, sortDir) {
            if (sortKey !== colKey) return '';
            return sortDir === 'asc' ? ' ▴' : sortDir === 'desc' ? ' ▾' : '';
        }
        function applySort(rows, sortKey, sortDir, valFn) {
            if (!sortKey || !sortDir) return rows;
            const sorted = [...rows].sort((a, b) => {
                const va = valFn(sortKey, a), vb = valFn(sortKey, b);
                if (typeof va === 'number' && typeof vb === 'number') {
                    return sortDir === 'asc' ? va - vb : vb - va;
                }
                const sa = String(va ?? ''), sb = String(vb ?? '');
                return sortDir === 'asc' ? sa.localeCompare(sb) : sb.localeCompare(sa);
            });
            return sorted;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 优先从 hash 恢复，没有 hash 默认回列表
            const parsed = parseHash(location.hash);
            if (parsed) {
                runNavigation(parsed.page, parsed.params || {});
            } else {
                navigateTo('projects');
            }
            // 启动运行中任务胶囊轮询
            loadRunningTasks();
            setInterval(loadRunningTasks, 5000);
        });

        // 暴露给 window，方便 onclick 内联调用
        window.navigateTo = navigateTo;
        window.runNavigation = runNavigation;
    </script>
