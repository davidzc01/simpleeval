<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simpleEval - LLM 与 Agent 评测工具</title>
    <style>
        /* ==================== 设计令牌 ==================== */
        :root {
            /* 背景 */
            --page-bg: #f7f8fa;
            --card-bg: #ffffff;
            --light-bg: #f4f5f7;
            --row-hover: #fafbfc;
            --code-bg: #1e1e24;
            --code-inline: #2a2a32;

            /* 文字灰阶 */
            --ink-1: #1a1d24;
            --ink-2: #2d3138;
            --ink-3: #5c6470;
            --ink-4: #8a919c;
            --ink-5: #b0b6bf;
            --ink-6: #d6dae0;

            /* 强调色 */
            --accent: #3b6fae;
            --accent-deep: #2f5c91;
            --accent-pale: #ecf2f9;
            --accent-bd: #c3d6ea;

            /* 语义色 */
            --green: #1a7f4b;
            --green-bg: #effaf3;
            --green-bd: #c2e7d1;
            --red: #d13438;
            --red-bg: #fdf0f0;
            --red-bd: #f3c9cb;
            --amber: #b36b00;
            --amber-bg: #fdf6e8;
            --amber-bd: #f2dcae;
            --teal: #0f766e;
            --teal-bg: #eff9f7;
            --teal-bd: #b8e0da;
            --gray: #7d8590;
            --gray-bg: #f4f5f7;
            --gray-bd: #dde1e6;

            /* 圆角 */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            --radius-pill: 999px;

            /* 阴影 */
            --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
            --shadow-dropdown: 0 8px 24px rgba(16,24,40,.12);
            --shadow-modal: 0 16px 48px rgba(16,24,40,.18);

            /* 字体 */
            --font-ui: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;

            /* 间距 */
            --sidebar-width: 220px;
            --header-height: 56px;
        }

        /* ==================== 重置 ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            font-size: 13px;
            color: var(--ink-2);
            background: var(--page-bg);
            line-height: 1.5;
        }

        .mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
        }

        .num {
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        /* ==================== 布局 ==================== */
        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--code-bg);
            color: #9a9fab;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 5;
        }

        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #333;
        }

        .sidebar-logo {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
            overflow-y: auto;
        }

        .nav-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .12s ease;
            position: relative;
        }

        .nav-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .nav-item.active {
            color: var(--accent);
            background: var(--accent-pale);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
        }

        .nav-item .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #333;
            font-size: 12px;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--ink-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 4;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .content {
            padding: 28px;
            flex: 1;
        }

        /* ==================== 按钮 ==================== */
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all .12s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-deep);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--ink-2);
            border: 1px solid var(--ink-6);
        }

        .btn-secondary:hover {
            background: var(--light-bg);
        }

        .btn-danger {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red-bd);
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================== 卡片 ==================== */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 16px 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .card + .card {
            margin-top: 12px;
        }

        /* ==================== 指标卡 ==================== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 16px;
            text-align: center;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--ink-1);
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--ink-3);
        }

        /* ==================== 表格 ==================== */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--ink-6);
        }

        th {
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-3);
            background: var(--light-bg);
        }

        tr:hover td {
            background: var(--row-hover);
        }

        .truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==================== 表单 ==================== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-3);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--ink-6);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            transition: border-color .12s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-pale);
        }

        .form-input.mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            background: var(--card-bg);
        }

        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        select.form-input {
            cursor: pointer;
        }

        /* ==================== 代码块 ==================== */
        .code-block {
            background: var(--code-bg);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
            overflow-x: auto;
        }

        .code-block .code-header {
            color: #888;
            font-size: 11px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
        }

        /* ==================== 标签/徽章 ==================== */
        .tag {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 500;
        }

        .tag-exact { background: var(--accent-pale); color: var(--accent); }
        .tag-contains { background: var(--teal-bg); color: var(--teal); }
        .tag-not_contains { background: var(--red-bg); color: var(--red); }
        .tag-length { background: var(--amber-bg); color: var(--amber); }
        .tag-llm_judge, .tag-judge { background: #f3e8ff; color: #7c3aed; }

        /* ==================== 状态 ==================== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-passed { background: var(--green-bg); color: var(--green); }
        .status-passed .status-dot { background: var(--green); }
        .status-failed { background: var(--red-bg); color: var(--red); }
        .status-failed .status-dot { background: var(--red); }
        .status-running { background: var(--amber-bg); color: var(--amber); }
        .status-running .status-dot { background: var(--amber); animation: pulse 1.5s infinite; }
        .status-queued { background: var(--teal-bg); color: var(--teal); }
        .status-queued .status-dot { background: var(--teal); }
        .status-disabled { background: var(--gray-bg); color: var(--gray); }
        .status-disabled .status-dot { background: var(--gray); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ==================== Tabs ==================== */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--ink-6);
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 16px;
            cursor: pointer;
            color: var(--ink-3);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all .12s ease;
        }

        .tab:hover {
            color: var(--ink-2);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ==================== 导入拖拽区 ==================== */
        .import-drop-zone {
            border: 2px dashed var(--ink-6);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color .12s ease, background .12s ease;
        }
        .import-drop-zone:hover {
            background: var(--row-hover);
            border-color: var(--accent-bd);
        }

        /* ==================== 模态框 ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(23,26,33,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-modal);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow: auto;
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--ink-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink-1);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--ink-4);
        }

        .modal-body {
            padding: 18px 22px;
        }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid var(--ink-6);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ==================== 三栏对比视图 ==================== */
        .comparison-view {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        .comparison-column {
            background: var(--code-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .comparison-header {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #888;
            background: var(--code-inline);
        }

        .comparison-content {
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 12.5px;
            color: #e0e0e0;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ==================== 进度条 ==================== */
        .progress-bar {
            height: 8px;
            background: var(--light-bg);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: var(--radius-pill);
            transition: width .4s ease;
        }

        /* ==================== 空态 ==================== */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--ink-4);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* ==================== Toast ==================== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-dropdown);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn .2s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast-success { border-left: 3px solid var(--green); }
        .toast-error { border-left: 3px solid var(--red); }
        .toast-warning { border-left: 3px solid var(--amber); }

        /* ==================== 任务指示器 ==================== */
        .task-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid var(--amber-bd);
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background .12s ease;
            max-width: 100%;
            overflow: hidden;
        }

        .task-indicator:hover {
            background: var(--amber-bd);
        }

        .task-indicator .status-dot {
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        .task-indicator .task-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ==================== 骨架屏 ==================== */
        .skeleton {
            background: linear-gradient(90deg, var(--light-bg) 0%, var(--row-hover) 50%, var(--light-bg) 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.4s infinite linear;
            border-radius: var(--radius-sm);
            display: block;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-row td, .skeleton-cell {
            padding: 10px 12px;
        }

        .skeleton-line {
            height: 12px;
            width: 100%;
        }

        .skeleton-line.w-60 { width: 60%; }
        .skeleton-line.w-40 { width: 40%; }
        .skeleton-line.w-30 { width: 30%; }
        .skeleton-line.w-80 { width: 80%; }

        .skeleton-card {
            height: 80px;
            border-radius: var(--radius-lg);
        }

        /* ==================== 隐藏类 ==================== */
        .hidden { display: none !important; }

        /* ==================== 工具类 ==================== */
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .text-right { text-align: right; }
        .text-muted { color: var(--ink-4); }

        /* B-7: 响应解析行编辑器 + JSON 树点选 */
        .rp-path-list { display: flex; flex-direction: column; gap: 6px; }
        .rp-path-row { display: flex; gap: 6px; align-items: center; }
        .rp-path-row .rp-path-input { flex: 1; font-size: 13px; }
        .rp-path-row .btn-sm { padding: 4px 10px; line-height: 1.4; }
        .rp-toolbar { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

        /* B-13: 变量 kv 行编辑器 */
        .kv-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
        .kv-row { display: flex; gap: 6px; align-items: center; }
        .kv-row .kv-key { flex: 1; font-size: 13px; }
        .kv-row .kv-val { flex: 2; font-size: 13px; }
        .kv-row .btn-sm { padding: 4px 10px; line-height: 1.4; }

        .json-tree { font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--ink-2); }
        .json-tree .jt-row { margin-left: 18px; border-left: 1px dashed var(--gray-bd); padding-left: 8px; }
        .json-tree .jt-key { color: var(--accent); cursor: pointer; }
        .json-tree .jt-key:hover { text-decoration: underline; }
        .json-tree .jt-leaf { cursor: pointer; padding: 0 2px; border-radius: 2px; }
        .json-tree .jt-leaf:hover { background: var(--accent-pale); }
        .json-tree .jt-string { color: var(--green); }
        .json-tree .jt-number { color: var(--ink-1); font-weight: 600; }
        .json-tree .jt-boolean { color: var(--red); }
        .json-tree .jt-null { color: var(--ink-4); font-style: italic; }
        .json-tree .jt-bracket { color: var(--ink-3); cursor: pointer; user-select: none; }
        .json-tree .jt-bracket:hover { color: var(--accent); }
        .json-tree .jt-children.jt-hidden { display: none; }
        .json-tree .jt-preview { color: var(--ink-4); font-style: italic; margin-left: 8px; font-size: 11px; }
        .json-tree .jt-hint { font-size: 11px; color: var(--ink-4); margin-bottom: 8px; }
        .json-tree-container { border: 1px solid var(--gray-bd); border-radius: var(--radius-md); padding: 12px; max-height: 400px; overflow: auto; background: var(--gray-bg); }
        .rp-target-badge { font-size: 11px; color: var(--ink-4); margin-left: 8px; }
        .rp-target-badge.active { color: var(--accent); font-weight: 600; }

        /* ==================== T1-2: Tag chips ==================== */
        .tag-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .tag-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; font-size: 11px;
            background: var(--accent-pale); color: var(--accent-deep);
            border: 1px solid var(--accent-bd); border-radius: var(--radius-pill);
            cursor: default; user-select: none;
        }
        .tag-chip .tag-chip-x { cursor: pointer; color: var(--ink-4); font-weight: 600; }
        .tag-chip .tag-chip-x:hover { color: var(--red); }
        .tag-chip-toggle { cursor: pointer; }
        .tag-chip-toggle.off { background: var(--gray-bg); color: var(--ink-4); border-color: var(--gray-bd); }
        .tag-chip-toggle.off .tag-chip-x { color: var(--ink-5); }

        /* 表格内 tag chips（紧凑） */
        .tag-cell .tag-chip { font-size: 10px; padding: 1px 6px; }

        /* P-2: 评测集 tab 标签过滤条 */
        .filter-chip { cursor: pointer; transition: all .12s ease; border: 1px solid var(--accent-bd); }
        .filter-chip:hover { border-color: var(--accent); }
        .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }

        /* 评测弹窗 tag 筛选区 */
        .tag-filter-bar {
            margin-top: 12px; padding: 10px 12px;
            background: var(--light-bg); border: 1px solid var(--gray-bd);
            border-radius: var(--radius-md);
        }
        .tag-filter-bar .tag-filter-mode { margin-left: 12px; font-size: 12px; color: var(--ink-3); }
        .tag-filter-bar .tag-filter-mode label { margin-left: 8px; cursor: pointer; }

        /* ==================== T1-1: 危险操作菜单 ==================== */
        .row-menu-wrap { position: relative; display: inline-block; }
        .row-menu {
            position: absolute; right: 0; top: 100%; z-index: 10;
            min-width: 140px; padding: 4px 0;
            background: var(--card-bg);
            border: 1px solid var(--gray-bd);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-dropdown);
            display: none;
        }
        .row-menu.open { display: block; }
        .row-menu-item {
            display: block; width: 100%; padding: 8px 12px;
            background: none; border: none; cursor: pointer;
            font-size: 13px; color: var(--ink-2); text-align: left;
        }
        .row-menu-item:hover { background: var(--light-bg); }
        .row-menu-item.danger { color: var(--red); }
        .row-menu-item.danger:hover { background: var(--red-bg); }

        /* T1-1: 输入名称二次确认 */
        .confirm-input {
            width: 100%; padding: 8px 10px;
            border: 2px solid var(--gray-bd); border-radius: var(--radius-md);
            font-size: 13px; font-family: var(--font-mono);
        }
        .confirm-input:focus { border-color: var(--accent); outline: none; }
        .confirm-input.unlocked { border-color: var(--green); }

        /* ==================== T1-6: Dirty 警告 ==================== */
        .dirty-bar {
            margin-top: 12px; padding: 10px 12px;
            background: var(--amber-bg); border: 1px solid var(--amber-bd);
            border-radius: var(--radius-md); color: var(--amber);
            font-size: 12px; display: flex; align-items: center; gap: 12px;
        }
        .dirty-bar a { color: var(--accent-deep); cursor: pointer; text-decoration: underline; font-weight: 600; }
        .dirty-tab-dot {
            display: inline-block; width: 6px; height: 6px;
            background: var(--amber); border-radius: 50%;
            margin-left: 4px; vertical-align: middle;
        }

        /* ==================== T1-5: checks 列表编辑器 ==================== */
        .checks-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .check-row {
            display: grid; grid-template-columns: 1.2fr 1.2fr 1fr 1.6fr auto;
            gap: 6px; align-items: center; padding: 8px;
            background: var(--gray-bg); border-radius: var(--radius-md);
        }
        .check-row .form-input { font-size: 12px; padding: 4px 8px; }
        .check-row .btn-sm { padding: 4px 10px; line-height: 1.4; }
        /* W-6: Validation 区域与 Input 区域同款等宽字体（field/expected/substring 等均为代码内容） */
        .val-row .form-input { font-family: var(--font-mono); }
        /* O-1: validation 行移除名称字段后 4 列布局（field / type / params / delete） */
        .val-row { grid-template-columns: 1fr 1fr 1.6fr auto; }
        .checks-section {
            border: 1px dashed var(--gray-bd); border-radius: var(--radius-md);
            padding: 12px; margin-top: 8px;
        }
        .checks-section > .checks-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink-3); font-size: 12px; }
        .checks-section.collapsed > .checks-body { display: none; }

        /* run 详情 check 结果展示 */
        .check-result-list { margin-top: 12px; }
        .check-result-row {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; margin-bottom: 4px;
            background: var(--gray-bg); border-radius: var(--radius-sm);
            font-size: 12px;
        }
        .check-result-row .chk-status { width: 8px; height: 8px; border-radius: 50%; }
        .check-result-row .chk-status.pass { background: var(--green); }
        .check-result-row .chk-status.fail { background: var(--red); }

        /* ==================== T1-7: Token 模式分段控件 ==================== */
        .token-mode-segment {
            display: inline-flex; padding: 2px; background: var(--light-bg);
            border: 1px solid var(--gray-bd); border-radius: var(--radius-md);
            margin-bottom: 8px; gap: 0;
        }
        .token-mode-segment label {
            font-size: 12px; cursor: pointer;
            color: var(--ink-3); border-radius: var(--radius-sm);
            transition: all .12s ease; display: inline-flex;
        }
        .token-mode-segment input { display: none; }
        .token-mode-segment label span {
            display: inline-block; padding: 5px 14px;
            border-radius: var(--radius-sm);
        }
        .token-mode-segment input:checked + span {
            background: var(--card-bg); color: var(--accent-deep);
            font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,40,.08);
        }
        .token-scope-fold {
            margin-top: 8px; padding: 8px 10px;
            background: var(--gray-bg); border-radius: var(--radius-md);
            font-size: 11px; color: var(--ink-4);
        }
        .token-scope-fold summary { cursor: pointer; color: var(--ink-3); font-size: 12px; }
        .token-empty-hint {
            padding: 8px 10px; background: var(--gray-bg); border-radius: var(--radius-md);
            font-size: 11px; color: var(--ink-4); text-align: center;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 侧栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">simpleEval</div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-item" data-page="projects" onclick="navigateTo('projects')">
                    <span>📁</span> 项目总览
                </div>
                <div class="nav-item" data-page="config-management" onclick="navigateTo('config-management')">
                    <span>⚙</span> 配置管理
                </div>
                <div class="nav-item" data-page="schedules" onclick="navigateTo('schedules')">
                    <span>⏰</span> 定时任务
                </div>
            </nav>
            <div class="sidebar-footer">
                <div id="runningTasks"></div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="header">
                <h1 class="header-title" id="pageTitle">Projects</h1>
                <div class="header-actions" id="headerActions">
                    <!-- 动态按钮 -->
                </div>
            </header>
            <div class="content" id="mainContent">
                <!-- 动态内容 -->
            </div>
        </main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== 全局状态 ====================
        const state = {
            projects: [],
            currentProject: null,
            currentRun: null,
            currentEvalsets: null,
            currentEvalsetId: null,
            apiBase: '/api',
            // T1-6 dirty 检测
            _configSnapshot: null,    // 配置页打开时保存的 JSON 快照
            _configDirty: false,
            _suppressDirtyCheck: false, // 切到 config tab 初始化期间临时关闭
            // P-2: 评测集 tab 标签筛选（OR 语义，空 = 全部）
            _evalsetTagFilter: [],
            // Judge 双模式共享的 auth/_rp 状态
            _judgeAuth: null,
            _judgeRpSample: '',
            _judgeRpActiveTarget: null
        };

        // ==================== 辅助函数 ====================
        function isProjectReady(project) {
            // 检查项目是否配置完整（Target API 和 Judge）
            // B-6: custom 模式不要求 model
            if (!project) return false;
            const tc = project.target_config || {};
            const jc = project.judge_config || {};
            const targetReady = tc.base_url && (tc.api_type === 'custom' ? true : !!tc.model);
            return !!(targetReady && jc.base_url && jc.model);
        }

        // ==================== API 客户端 ====================
        async function api(endpoint, options = {}) {
            try {
                const res = await fetch(state.apiBase + endpoint, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail?.error?.message || data.detail?.message || 'Request failed');
                }
                return data;
            } catch (err) {
                console.error('API Error:', err);
                showToast(err.message, 'error');
                throw err;
            }
        }

        // ==================== Toast 提示 ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✗' : '⚠'}</span><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== 侧栏项目列表 ====================
        // B-11: active 用 URL hash 判断（不依赖 state.currentProject），数据缓存（不每次 fetch）
        function getActiveProjectIdFromHash() {
            const parsed = parseHash(location.hash);
            if (!parsed) return null;
            if (parsed.page === 'project-detail') return parsed.params?.id || null;
            if (parsed.page === 'run-detail') return parsed.params?.projectId || null;
            return null;
        }

        function renderSidebarProjects() {
            const container = document.getElementById('projectList');
            if (!container) return;
            const projects = state.sidebarProjects || [];
            const activeId = getActiveProjectIdFromHash();
            if (projects.length === 0) {
                container.innerHTML = '<div style="padding: 10px 16px; color: var(--ink-5); font-size: 12px;">暂无项目</div>';
                return;
            }
            container.innerHTML = projects.map(p => {
                const hasRunning = p.last_run?.status === 'running' || p.last_run?.status === 'queued';
                return `
                    <div class="nav-item project-item ${activeId === p.id ? 'active' : ''}"
                         data-page="project-detail" data-id="${escapeHtml(p.id)}"
                         onclick="navigateTo('project-detail', {id: '${escapeHtml(p.id)}'})">
                        ${hasRunning ? '<span class="status-dot"></span>' : '<span style="width: 6px;"></span>'}
                        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(p.name)}</span>
                    </div>
                `;
            }).join('');
        }

        async function loadSidebarProjects(force = false) {
            const container = document.getElementById('projectList');
            if (!container) return;
            // 有缓存且不强制 → 立即渲染（0 延迟，点击同步切换 active）
            if (state.sidebarProjects && !force) {
                renderSidebarProjects();
                return;
            }
            try {
                const data = await api('/projects');
                state.sidebarProjects = data.projects || [];
                renderSidebarProjects();
            } catch (err) {
                container.innerHTML = '<div style="padding: 10px 16px; color: var(--ink-5); font-size: 12px;">加载失败</div>';
            }
        }

        // 强制刷新侧栏（项目增删后调用）
        function refreshSidebarProjects() {
            state.sidebarProjects = null;
            loadSidebarProjects(true);
        }

        // ==================== 页面导航（带 hash 路由）====================
        // 程序化改 hash 时设此 flag，避免 hashchange 再触发一次 navigateTo 造成循环
        let _programmaticHash = false;

        function buildHash(page, params = {}) {
            if (page === 'projects') return '#/projects';
            if (page === 'project-detail') return `#/project/${encodeURIComponent(params.id || '')}`;
            if (page === 'run-detail') return `#/run/${encodeURIComponent(params.projectId || '')}/${encodeURIComponent(params.id || '')}`;
            if (page === 'config-management') return '#/config-management';
            if (page === 'judge-configs') return '#/config-management';
            if (page === 'schedules') return '#/schedules';
            return '#/projects';
        }

        function parseHash(hash) {
            const h = (hash || '').replace(/^#\/?/, '');
            if (!h) return null;
            const parts = h.split('/').map(decodeURIComponent);
            if (parts[0] === 'projects') return { page: 'projects' };
            if (parts[0] === 'project' && parts[1]) return { page: 'project-detail', params: { id: parts[1] } };
            if (parts[0] === 'run' && parts[1] && parts[2]) return { page: 'run-detail', params: { id: parts[2], projectId: parts[1] } };
            if (parts[0] === 'config-management') return { page: 'config-management' };
            if (parts[0] === 'judge-configs') return { page: 'config-management' };
            if (parts[0] === 'schedules') return { page: 'schedules' };
            return null;
        }

        function navigateTo(page, params = {}) {
            // T1-6: 当前在 config tab 且 dirty 时，拦截离开
            if (state._configDirty && !_isNavigationSelf(page, params)) {
                showDiscardDirtyConfirm(() => {
                    state._configDirty = false;
                    state._configSnapshot = null;
                    removeConfigDirtyDot();
                    _navigateToNoCheck(page, params);
                });
                return;
            }
            _navigateToNoCheck(page, params);
        }

        // 同页同参数（如 openRunModal 二次导航）不视为离开，不拦截
        function _isNavigationSelf(page, params) {
            // 切到当前页面（如刷新当前项目详情）属于用户主动行为，仍拦截；此处仅跳过完全同 hash 的调用
            return false;
        }

        function _navigateToNoCheck(page, params = {}) {
            // 同步 hash（静默：不触发 hashchange 二次导航）
            const newHash = buildHash(page, params);
            if (location.hash !== newHash) {
                _programmaticHash = true;
                location.hash = newHash;
            }
            runNavigation(page, params);
        }

        // T1-6: 浏览器刷新/关闭拦截 —— beforeunload 由浏览器原生弹窗处理
        window.addEventListener('beforeunload', (e) => {
            if (state._configDirty) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        function runNavigation(page, params = {}) {
            // W-2: 侧栏 active 由 URL hash 驱动，点击即时切换
            // 清除所有 nav-item 的 active
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            // 高亮当前页对应的侧栏项
            const navItem = document.querySelector(`.nav-item[data-page="${page}"]`);
            if (navItem) navItem.classList.add('active');
            // 项目详情页高亮"项目总览"（侧栏无项目级入口，依赖总览页导航）
            if (page === 'project-detail' || page === 'run-detail') {
                const projectsNav = document.querySelector('.nav-item[data-page="projects"]');
                if (projectsNav) projectsNav.classList.add('active');
            }

            document.getElementById('pageTitle').textContent = page === 'projects' ? '项目总览' : page === 'project-detail' ? (state.currentProject?.name || '项目详情') : page === 'run-detail' ? (state.currentRun?.id || 'Run 详情') : page === 'config-management' ? '配置管理' : page === 'judge-configs' ? '配置管理' : page === 'schedules' ? '定时任务' : page;

            const content = document.getElementById('mainContent');
            const headerActions = document.getElementById('headerActions');
            headerActions.innerHTML = '';

            switch(page) {
                case 'projects':
                    renderProjectsPage(content, headerActions);
                    break;
                case 'project-detail':
                    renderProjectDetailPage(content, headerActions, params);
                    break;
                case 'run-detail':
                    renderRunDetailPage(content, headerActions, params);
                    break;
                case 'judge-configs':
                case 'config-management':
                    renderConfigManagementPage(content, headerActions, params);
                    break;
                case 'schedules':
                    renderSchedulesPage(content, headerActions);
                    break;
            }
        }

        // 记录上一个 hash，供 hashchange 时拦截 dirty 后回滚
        let _lastConfirmedHash = location.hash;
        window.addEventListener('hashchange', () => {
            if (_programmaticHash) { _programmaticHash = false; _lastConfirmedHash = location.hash; return; }
            const parsed = parseHash(location.hash);
            if (!parsed) { runNavigation('projects'); _lastConfirmedHash = location.hash; return; }
            // T1-6: dirty 拦截 —— 用户用浏览器前进/后退或手动改 hash 时
            if (state._configDirty) {
                // 回滚 hash（同步设 _programmaticHash，避免回滚再触发）
                _programmaticHash = true;
                location.hash = _lastConfirmedHash;
                showDiscardDirtyConfirm(() => {
                    state._configDirty = false;
                    state._configSnapshot = null;
                    removeConfigDirtyDot();
                    _navigateToNoCheck(parsed.page, parsed.params || {});
                    _lastConfirmedHash = location.hash;
                });
                return;
            }
            runNavigation(parsed.page, parsed.params || {});
            _lastConfirmedHash = location.hash;
        });

        // ==================== 骨架屏工具 ====================
        function skeletonRows(n, cols, widths) {
            // widths: 数组，每列宽度比例（如 ['w-60', 'w-40']），缺省用 'w-80'
            return Array.from({length: n}).map(() => {
                const tds = Array.from({length: cols}).map((_, i) => {
                    const w = (widths && widths[i]) || 'w-80';
                    return `<td class="skeleton-cell"><div class="skeleton skeleton-line ${w}"></div></td>`;
                }).join('');
                return `<tr class="skeleton-row">${tds}</tr>`;
            }).join('');
        }

        function skeletonMetrics(n) {
            return Array.from({length: n}).map(() =>
                `<div class="metric-card"><div class="skeleton skeleton-line w-60" style="height: 24px; margin-bottom: 6px;"></div><div class="skeleton skeleton-line w-40"></div></div>`
            ).join('');
        }

        // ==================== 运行中任务胶囊 ====================
        async function loadRunningTasks() {
            const container = document.getElementById('runningTasks');
            if (!container) return;
            try {
                const data = await api('/projects');
                const projects = data.projects || [];
                const running = [];
                for (const p of projects) {
                    const lr = p.last_run;
                    if (lr && (lr.status === 'running' || lr.status === 'queued')) {
                        running.push({ projectId: p.id, projectName: p.name, runId: lr.id, status: lr.status });
                    }
                }
                state.runningTasks = running;
                if (running.length === 0) {
                    container.innerHTML = '';
                    return;
                }
                container.innerHTML = `<div class="task-list">${running.map(t => `
                    <div class="task-indicator" title="${escapeHtml(t.status === 'running' ? '运行中' : '排队中')}：${escapeHtml(t.projectName)} — ${escapeHtml(t.runId)}"
                         onclick="navigateTo('run-detail', {id: '${escapeHtml(t.runId)}', projectId: '${escapeHtml(t.projectId)}'})">
                        <span class="status-dot"></span>
                        <span class="task-name">${escapeHtml(t.projectName)}</span>
                    </div>
                `).join('')}</div>`;
            } catch (err) {
                // 静默失败，不打扰用户
                container.innerHTML = '';
            }
        }

        // ==================== U-2: 配置管理页（Judge + Target 模板统一归口）====================
        async function renderConfigManagementPage(container, headerActions, params = {}) {
            const initialTab = params.tab || 'judge';
            headerActions.innerHTML = '';
            container.innerHTML = `
                <div style="padding: 16px;">
                    <div class="tabs" style="margin-bottom: 16px;">
                        <div class="tab ${initialTab === 'judge' ? 'active' : ''}" data-cfg-tab="judge" onclick="switchConfigManagementTab('judge')">⚖ Judge 配置</div>
                        <div class="tab ${initialTab === 'templates' ? 'active' : ''}" data-cfg-tab="templates" onclick="switchConfigManagementTab('templates')">🎯 Target 模板</div>
                        <div class="tab ${initialTab === 'tags' ? 'active' : ''}" data-cfg-tab="tags" onclick="switchConfigManagementTab('tags')">🏷 标签管理</div>
                    </div>
                    <div id="cfgMgmtContent"><div style="color: var(--ink-4);">加载中...</div></div>
                </div>
            `;
            await renderConfigManagementTab(initialTab, params);
        }

        // ==================== W-3: 定时任务页 ====================

        async function renderSchedulesPage(container, headerActions) {
            headerActions.innerHTML = `
                <button class="btn btn-primary" onclick="showScheduleEditModal(null)">+ 添加定时任务</button>
            `;
            container.innerHTML = '<div style="color: var(--ink-4); padding: 16px;">加载中...</div>';
            try {
                const [schedRes, logsRes, projectsRes, tagsRes] = await Promise.all([
                    api('/schedules'),
                    api('/schedules/logs?limit=20'),
                    api('/projects'),
                    api('/tags').catch(() => ({ tags: [] })),
                ]);
                const schedules = schedRes.schedules || [];
                const logs = logsRes.logs || [];
                // 尚未配置 schedule 的项目（用于新建下拉）
                const allProjects = projectsRes.projects || [];
                const schedPids = new Set(schedules.map(s => s.project_id));
                window._scheduleProjects = allProjects;
                window._allTagsForSchedule = (tagsRes.tags || []).map(t => t.name || '').filter(Boolean);

                container.innerHTML = `
                    <div style="padding: 16px;">
                        <div style="margin-bottom: 16px;">
                            <h3 style="margin-bottom: 12px;">定时任务</h3>
                            ${schedules.length === 0 ? `
                                <div class="empty-state" style="padding: 40px 0;">
                                    <div class="empty-state-icon">⏰</div>
                                    <div class="empty-state-text">还没有定时任务</div>
                                    <div style="font-size: 12px; color: var(--ink-5); margin-top: 4px;">
                                        创建自动回归任务，按标签筛选用例，支持结果波动通知
                                    </div>
                                    <div style="margin-top: 16px;">
                                        <button class="btn btn-primary" onclick="showScheduleEditModal(null)">+ 新建定时任务</button>
                                    </div>
                                </div>
                            ` : `
                                <div class="card">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>项目</th>
                                                <th>cron</th>
                                                <th>标签筛选</th>
                                                <th>阈值</th>
                                                <th>启用</th>
                                                <th>上次执行</th>
                                                <th>结果</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${schedules.map(s => {
                                                const tags = (s.tags || []).map(t => `<span class="tag-chip" style="font-size: 10px;">${escapeHtml(t)}</span>`).join('') || '<span class="text-muted">全部</span>';
                                                const lastRun = s.last_run;
                                                const lastTime = lastRun ? formatTimestamp(lastRun.created_at) : '<span class="text-muted">-</span>';
                                                const lastResult = lastRun ? `${runStatusBadge(lastRun.status)}${lastRun.pass_rate != null ? ` <span style="font-size: 12px;">${(lastRun.pass_rate * 100).toFixed(1)}%</span>` : ''}` : '<span class="text-muted">-</span>';
                                                const thr = s.regression_threshold != null ? `${(s.regression_threshold * 100).toFixed(0)}%` : '-';
                                                return `
                                                    <tr>
                                                        <td>${escapeHtml(s.project_name)}</td>
                                                        <td><code style="font-size: 12px;">${escapeHtml(s.cron)}</code></td>
                                                        <td>${tags}</td>
                                                        <td style="font-size: 12px;">${thr}</td>
                                                        <td>
                                                            <label style="display: inline-flex; align-items: center; gap: 4px; cursor: pointer;">
                                                                <input type="checkbox" ${s.enabled ? 'checked' : ''} onchange="toggleScheduleEnable('${escapeHtml(s.project_id)}', this.checked)" style="margin: 0;">
                                                                <span style="font-size: 12px;">${s.enabled ? '已启用' : '已停用'}</span>
                                                            </label>
                                                        </td>
                                                        <td style="font-size: 12px;">${lastTime}</td>
                                                        <td>${lastResult}</td>
                                                        <td>
                                                            <button class="btn btn-sm btn-secondary" onclick="showScheduleEditModal('${escapeHtml(s.project_id)}')">编辑</button>
                                                            <button class="btn btn-sm" style="padding: 0 4px; background: transparent; border: none; color: var(--red); font-size: 12px;" onclick="confirmDeleteSchedule('${escapeHtml(s.project_id)}', '${escapeHtml(s.project_name)}')">删除</button>
                                                        </td>
                                                    </tr>
                                                `;

        function buildCronFromBasic() {
            const mode = document.getElementById('seBasicMode').value;
            if (mode === 'daily') {
                const h = document.getElementById('seDayHour').value;
                const m = document.getElementById('seDayMin').value;
                return `${m} ${h} * * *`;
            }
            if (mode === 'weekly') {
                const dow = document.getElementById('seWeekDow').value;
                const h = document.getElementById('seWeekHour').value;
                const m = document.getElementById('seWeekMin').value;
                return `${m} ${h} * * ${dow}`;
            }
            if (mode === 'everyNmin') {
                const n = document.getElementById('seNMin').value;
                return `*/${n} * * * *`;
            }
            if (mode === 'everyNhour') {
                const n = document.getElementById('seNHour').value;
                return `0 */${n} * * *`;
            }
            return null;
        }

        function validateCron5(cron) {
            if (typeof cron !== 'string') return 'cron 为空';
            const parts = cron.trim().split(/\s+/).filter(Boolean);
            if (parts.length !== 5) return `需要 5 字段（分 时 日 月 周），当前 ${parts.length} 个字段`;
            const [m, h, dom, mon, dow] = parts;
            const ranges = [
                [m, 0, 59, '分'],
                [h, 0, 23, '时'],
                [dom, 1, 31, '日'],
                [mon, 1, 12, '月'],
                [dow, 0, 7, '周'],
            ];
            const validPart = (p, lo, hi) => {
                if (p === '*' || p === '?') return true;
                if (/^\*\/\d+$/.test(p)) {
                    const n = parseInt(p.slice(2), 10);
                    return n >= lo && n <= hi && n > 0;
                }
                if (/^\d+$/.test(p)) {
                    const n = parseInt(p, 10);
                    return n >= lo && n <= hi;
                }
                if (/^\d+(-\d+)?(,\d+(-\d+)?)*$/.test(p)) {
                    return p.split(',').every(seg => {
                        const [a, b] = seg.split('-');
                        const an = parseInt(a, 10), bn = b !== undefined ? parseInt(b, 10) : an;
                        return an >= lo && an <= hi && bn >= lo && bn <= hi && an <= bn;
                    });
                }
                return false;
            };
            for (const [p, lo, hi, nm] of ranges) {
                if (!validPart(p, lo, hi)) return `${nm} 字段非法：${p}（范围 ${lo}-${hi}，支持 *、*/N、数字、a-b、a,b,c）`;
            }
            return null;
        }

        function updateCronHint() {
            const hintEl = document.getElementById('seCronHint');
            if (!hintEl) return;
            const adv = document.getElementById('seAdvancedToggle');
            let cron;
            if (adv && adv.checked) {
                cron = document.getElementById('seCronInput').value;
            } else {
                cron = buildCronFromBasic();
            }
            const err = validateCron5(cron || '');
            hintEl.textContent = err
                ? `⚠ ${err}`
                : `✓ 将保存为 cron：${cron}`;
            hintEl.style.color = err ? 'var(--red)' : 'var(--green)';
            // 高级模式实时校验
            if (adv && adv.checked) {
                document.getElementById('seCronInput').oninput = () => updateCronHint();
            }
        }

        async function submitScheduleEdit(fixedProjectId) {
            const errEl = document.getElementById('seError');
            errEl.textContent = '';
            let projectId = fixedProjectId;
            if (!projectId) {
                projectId = document.getElementById('seProject').value;
            }
            if (!projectId) { errEl.textContent = '请选择项目'; return; }
            let cron;
            const adv = document.getElementById('seAdvancedToggle').checked;
            if (adv) {
                cron = (document.getElementById('seCronInput').value || '').trim();
                const cerr = validateCron5(cron);
                if (cerr) { errEl.textContent = cerr; return; }
            } else {
                cron = buildCronFromBasic();
                const cerr = validateCron5(cron);
                if (cerr) { errEl.textContent = cerr; return; }
            }
            const enabled = document.getElementById('seEnabled').checked;
            const tagChecks = document.querySelectorAll('#seTags input[type="checkbox"]:checked');
            const tags = Array.from(tagChecks).map(cb => cb.dataset.tag).filter(Boolean);
            const versionId = document.getElementById('seVersion').value || null;
            const threshold = parseFloat(document.getElementById('seThresholdRange').value);

            try {
                await api(`/projects/${projectId}/schedule`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        enabled, cron, tags,
                        version_id: versionId,
                        regression_threshold: isNaN(threshold) ? 0.1 : threshold,
                    })
                });
                closeModal('scheduleEditModal');
                showToast(fixedProjectId ? '已更新定时任务' : '已创建定时任务');
                renderSchedulesPage(document.getElementById('mainContent'), document.getElementById('headerActions'));
            } catch (e) {
                errEl.textContent = e.message || '保存失败';
            }
        }

        function toggleJcEditorMode() {

        async function saveJudgeConfig(jcId) {
            const name = document.getElementById('jcNameInput')?.value?.trim() || '';
            if (!name) { showToast('名称必填', 'error'); return; }
            const apiType = document.getElementById('jcApiType')?.value || 'openai_compatible';
            const apiKey = document.getElementById('jcApiKey')?.value || '';
            const isMasked = document.getElementById('jcApiKey')?.dataset?.masked === 'true';
            const jc = {
                api_type: apiType,
                base_url: document.getElementById('jcBaseUrl')?.value || '',
                api_key: (jcId && isMasked) ? '__UNCHANGED__' : apiKey,
                model: document.getElementById('jcModel')?.value || null,
                prompt_template: document.getElementById('jcPromptTemplate')?.value || '',
            };
            if (apiType === 'custom') {
                jc.request_template = document.getElementById('jcRequestTemplate')?.value || '';
                try { jc.auth = JSON.parse(document.getElementById('jcAuthJson')?.value || '{"type": "none"}'); }
                catch (e) { showToast('auth JSON 解析失败: ' + e.message, 'error'); return; }
                try { jc.response_parsing = JSON.parse(document.getElementById('jcRpJson')?.value || 'null'); }
                catch (e) { showToast('response_parsing JSON 解析失败: ' + e.message, 'error'); return; }
            }
            const fd = new FormData();
            fd.append('name', name);
            fd.append('judge_config_json', JSON.stringify(jc));
            try {
                if (jcId) {
                    fd.append('overwrite', 'true');
                    await fetch(`/api/judge-configs/${encodeURIComponent(jcId)}`, { method: 'PUT', body: fd });
                    showToast('Judge 配置已更新');
                } else {
                    await fetch('/api/judge-configs', { method: 'POST', body: fd });
                    showToast('Judge 配置已创建');
                }
                closeModal('judgeConfigModal');
                navigateTo('config-management');
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        // ==================== REQ-12: 获取真实样例响应 ====================
        async function fetchRealSample(projectId) {
            const hintEl = document.getElementById('fetchSampleHint');
            const btn = event?.target;
            if (btn) { btn.disabled = true; btn.textContent = '📡 获取中...'; }
            if (hintEl) hintEl.textContent = '正在取第一条启用 case 调用目标 API...';
            try {
                const evalsetData = await api(`/projects/${encodeURIComponent(projectId)}/evalsets`);
                const evalsets = evalsetData.evalsets || [];
                if (!evalsets.length) {
                    if (hintEl) hintEl.textContent = '无评测集，无法获取样例';
                    showToast('请先导入评测集用例', 'error');
                    return;
                }
                const cases = evalsets[0].cases || [];
                const enabledCase = cases.find(c => c.enabled);
                if (!enabledCase) {
                    if (hintEl) hintEl.textContent = '无启用的 case';
                    showToast('无启用的 case，无法获取样例', 'error');
                    return;
                }
                const proj = state.currentProject;
                if (!proj) { showToast('项目数据未加载', 'error'); return; }
                const tc = proj.target_config;
                const isMasked = v => v && typeof v === 'object' && v.masked === true;
                const res = await fetch('/api/test/target?project_id=' + encodeURIComponent(projectId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base_url: tc.base_url,
                        api_key: isMasked(tc.api_key) ? '__UNCHANGED__' : (tc.api_key || ''),
                        model: tc.model || null,
                        request_template: tc.request_template || '{input}',
                        api_type: tc.api_type || 'openai_compatible',
                        auth: tc.auth || { type: 'none' },
                        response_mapping: tc.response_mapping || [],
                        response_parsing: tc.response_parsing || null,
                    })
                });
                const result = await res.json();
                if (result.ok) {
                    // 样例区填入完整响应（截断前 2000 字符避免超长）
                    const sampleEl = document.getElementById('parsingSample');
                    if (sampleEl) {
                        // 尝试获取完整 JSON 响应（output 是截断的，需要完整响应）
                        // test/target 返回的是截断 output，我们用它作为样例
                        sampleEl.value = result.output || '';
                        state._rpSample = sampleEl.value;
                    }
                    if (hintEl) hintEl.textContent = `✓ 已获取响应（token: ${result.token_used ?? '?'}）`;
                    // 自动渲染 JSON 树
                    if (typeof parseSampleToTree === 'function') parseSampleToTree();
                } else {
                    if (hintEl) hintEl.textContent = `✗ ${result.error?.message || '调用失败'}`;
                }
            } catch (e) {
                if (hintEl) hintEl.textContent = `✗ ${e.message}`;
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '📡 获取真实样例（会真实调用，消耗 token）'; }
            }
        }

                                        <th>pass rate</th>
                                        <th>运行 token</th>
                                        <th>评测 token</th>

                                        // O-7: 当前版本 = 项目最近版本名（按 created_at 降序取首）
                                        const vers = (p.versions || []).slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
                                        const curVer = vers.length > 0 ? vers[0].name : null;
                                        // O-7: token 拆分（运行 = total - judge；评测 = judge）
                                        const totalTok = p.last_run?.total_token ?? 0;
                                        const judgeTok = p.last_run?.judge_token ?? 0;
                                        const runTok = Math.max(0, totalTok - judgeTok);
                                        return `
                                        <tr>
                                            <td><strong>${escapeHtml(p.name)}</strong></td>

                                                        ${(p.last_run.pass_rate * 100).toFixed(1)}%

                                            <td>${renderSparkline(p.trend || [])}</td>

            } catch (err) {

            }
        }

        function renderSparkline(data) {
            if (!data.length) return '-';
            // B-9: y 轴固定 0–1（pass_rate 为 0-1 小数），禁止 min-max 缩放
            const height = 20;
            const width = 60;
            const points = data.map((d, i) => {
                const x = data.length === 1 ? width / 2 : (i / (data.length - 1)) * width;
                const y = height - d.pass_rate * height;
                return `${x},${y}`;
            }).join(' ');
            return `<svg width="${width}" height="${height}"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
        }

        // B-9: 概览趋势图（双系列：pass_rate 折线 + total_token 浅柱）
        function renderTrendChart(trend) {
            if (!trend || !trend.length) return '<div class="empty-state-text">暂无趋势数据</div>';
            const n = trend.length;
            const width = 440;
            const height = 140;
            const pad = { top: 16, right: 20, bottom: 28, left: 44 };
            const plotW = width - pad.left - pad.right;
            const plotH = height - pad.top - pad.bottom;

            // token 最大值用于柱状图缩放
            const maxToken = Math.max(...trend.map(d => d.total_token || 0), 1);
            const barW = Math.min(plotW / n * 0.5, 20);
            const xStep = n === 1 ? 0 : plotW / (n - 1);
            const xFor = i => n === 1 ? pad.left + plotW / 2 : pad.left + i * xStep;
            // pass_rate y 轴固定 0-1
            const yRateFor = v => pad.top + plotH * (1 - v);
            // token y 轴 0-maxToken
            const yTokenFor = v => pad.top + plotH * (1 - v / maxToken);

            // 网格
            let grid = '';
            for (const v of [0, 0.5, 1.0]) {
                const y = yRateFor(v);
                grid += `<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--border)"/>`;
                grid += `<text x="${pad.left - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--ink-4)">${v.toFixed(1)}</text>`;
            }

            // token 柱
            let bars = '';
            trend.forEach((d, i) => {
                const x = xFor(i) - barW / 2;
                const y = yTokenFor(d.total_token || 0);
                const h = pad.top + plotH - y;
                bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--accent-pale)" rx="2"/>`;
            });

            // pass_rate 折线
            const pts = trend.map((d, i) => `${xFor(i).toFixed(1)},${yRateFor(d.pass_rate).toFixed(1)}`).join(' ');
            const dots = trend.map((d, i) => `<circle cx="${xFor(i).toFixed(1)}" cy="${yRateFor(d.pass_rate).toFixed(1)}" r="3" fill="var(--accent)" stroke="white" stroke-width="1.5"/>`).join('');

            // x 轴标签（run 序号）
            const xLabels = trend.map((d, i) => `<text x="${xFor(i).toFixed(1)}" y="${height - 8}" text-anchor="middle" font-size="10" fill="var(--ink-4)">#${i + 1}</text>`).join('');

            return `
                <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="max-width: 100%;">
                    ${grid}
                    ${bars}
                    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
                    ${dots}
                    ${xLabels}
                </svg>
                <div style="display: flex; gap: 16px; margin-top: 8px; font-size: 11px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 16px; height: 2px; background: var(--accent); display: inline-block;"></span>
                        <span style="color: var(--ink-3);">pass rate</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="width: 12px; height: 12px; background: var(--accent-pale); display: inline-block; border: 1px solid var(--accent-bd);"></span>
                        <span style="color: var(--ink-3);">token</span>
                    </div>
                </div>
            `;
        }

        // ==================== Project 详情页 ====================
        async function renderProjectDetailPage(container, headerActions, params) {
            // 骨架屏：先画 tab 框架 + 概览卡片骨架
            container.innerHTML = `

                    <div class="tab" style="background: var(--light-bg); width: 60px; height: 24px;"></div>
                    <div class="tab" style="background: var(--light-bg); width: 60px; height: 24px;"></div>

                </div>
